<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cofre">
<meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0E13" media="(prefers-color-scheme: dark)">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-/7QCdrWwbhMtkcvul872nTdLTC149NMaZZm+Ff7V1mQ='; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">

<title>Cofre Financeiro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root {
  --bg: #F3F4F7;
  --card: #FFFFFF;
  --card-2: #F7F8FA;
  --ink: #0E1726;
  --ink-2: #4A5568;
  --ink-3: #8A94A6;
  --line: #E4E7EC;
  --accent: #0B6E69;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3F2F0;
  --hero-1: #0A2E3B;
  --hero-2: #0B6E69;
  --gold: #B7862A;
  --gold-soft: #FBF3E2;
  --neg: #C2412D;
  --pos: #12805C;
  --warn: #B45309;
  --warn-soft: #FEF3E2;
  --danger: #C0262D;
  --danger-soft: #FDECEC;
  --info-soft: #EAF1FB;
  --info: #1D5FBF;
  --verde: #16A34A; --amarelo: #CA8A04; --laranja: #EA580C; --vermelho: #DC2626;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(14, 23, 38, .06), 0 4px 16px rgba(14, 23, 38, .05);
  --tabbar-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0A0E13; --card: #141A22; --card-2: #1A212B; --ink: #E9EEF4; --ink-2: #B3BDCB; --ink-3: #7D8899;
    --line: #242D39; --accent: #2BB3A8; --accent-ink: #04201E; --accent-soft: #0F2E2C;
    --hero-1: #082029; --hero-2: #0B5753; --gold: #E2B357; --gold-soft: #2A2214;
    --neg: #F08A78; --pos: #4FD1A1; --warn: #F5B158; --warn-soft: #2B2112; --danger: #FF7B7B; --danger-soft: #2E1517;
    --info-soft: #132238; --info: #7DB2FF;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
body {
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
  min-height: 100vh; min-height: 100dvh;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num, .money { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
body.hide-values .money { filter: blur(7px); user-select: none; }

#app { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 8px) 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 24px); }
.page-title { font-size: 30px; font-weight: 750; letter-spacing: -0.02em; margin: 10px 0 14px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 12px; }
.topbar .hello { font-size: 14px; color: var(--ink-3); }
.topbar .name { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--card); box-shadow: var(--shadow); display: inline-grid; place-items: center; color: var(--ink-2); }
.icon-btn svg { width: 20px; height: 20px; }
.back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--accent); font-weight: 600; padding: 8px 0; font-size: 16px; }
.back svg { width: 20px; height: 20px; }

.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.card h3, .section-title { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 0 0 10px; }
.section-title { margin: 22px 4px 8px; display: flex; justify-content: space-between; align-items: baseline; }
.section-title a, .link { color: var(--accent); font-weight: 600; text-transform: none; letter-spacing: 0; font-size: 14px; background: none; border: 0; padding: 0; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }

.hero {
  background: linear-gradient(135deg, var(--hero-1), var(--hero-2)); color: #fff; border-radius: 22px; padding: 18px 18px 16px;
  box-shadow: 0 10px 30px rgba(11, 110, 105, .25); margin-bottom: 14px; position: relative; overflow: hidden;
}
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255, 255, 255, .06); }
.hero .label { font-size: 13px; opacity: .8; }
.hero .big { font-size: 36px; font-weight: 750; letter-spacing: -0.02em; margin: 2px 0 12px; }
.hero .row { display: flex; gap: 10px; }
.hero .pill { flex: 1; background: rgba(255, 255, 255, .1); border-radius: 14px; padding: 9px 11px; }
.hero .pill .k { font-size: 11.5px; opacity: .8; }
.hero .pill .v { font-size: 16px; font-weight: 650; }
.hero .foot { font-size: 11.5px; opacity: .7; margin-top: 10px; }

.light { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px 7px 9px; border-radius: 999px; border: 0; font-weight: 700; font-size: 13px; letter-spacing: .04em; color: #fff; }
.light::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #fff; opacity: .9; }
.light.VERDE { background: var(--verde); } .light.AMARELO { background: var(--amarelo); } .light.LARANJA { background: var(--laranja); } .light.VERMELHO { background: var(--vermelho); }
.light.none { background: var(--ink-3); }

.rows { list-style: none; margin: 0; padding: 0; }
.row-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.rows > :first-child .row-item, .rows > .row-item:first-child { border-top: 0; }
.row-item .ico { width: 40px; height: 40px; border-radius: 12px; background: var(--card-2); display: grid; place-items: center; font-size: 19px; flex: none; }
.row-item .main { flex: 1; min-width: 0; }
.row-item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-item .s { font-size: 13px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-item .amt { font-weight: 650; text-align: right; white-space: nowrap; }
.row-item .amt .s { text-align: right; }
.amt.neg { color: var(--ink); } .amt.pos { color: var(--pos); } .amt.forecast { color: var(--ink-3); font-style: italic; }
.chev { color: var(--ink-3); width: 18px; height: 18px; flex: none; }

.badge { display: inline-block; font-size: 11px; font-weight: 650; padding: 2px 7px; border-radius: 999px; background: var(--card-2); color: var(--ink-2); vertical-align: middle; letter-spacing: .01em; }
.badge.ok { background: var(--accent-soft); color: var(--accent); }
.badge.plan { background: var(--info-soft); color: var(--info); border: 1px dashed currentColor; }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.badge.gold { background: var(--gold-soft); color: var(--gold); }

.notice { border-radius: 14px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; display: flex; gap: 10px; align-items: flex-start; }
.notice svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.danger { background: var(--danger-soft); color: var(--danger); }
.notice.info { background: var(--info-soft); color: var(--info); }
.notice.ok { background: var(--accent-soft); color: var(--accent); }
.notice b { font-weight: 700; }
.notice .ntext { color: var(--ink); } .notice .ntext b { color: inherit; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 650; background: var(--accent); color: var(--accent-ink); width: 100%; font-size: 16px; }
.btn svg { width: 19px; height: 19px; }
.btn.secondary { background: var(--card-2); color: var(--ink); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { background: var(--danger); color: #fff; }
.btn:disabled { opacity: .45; }
.btn + .btn { margin-top: 10px; }
.btn-row { display: flex; gap: 10px; } .btn-row .btn + .btn { margin-top: 0; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--ink-2); border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }

.seg { display: flex; background: var(--card-2); border-radius: 12px; padding: 3px; margin-bottom: 14px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 10px; padding: 8px 6px; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.stat { background: var(--card); border-radius: 16px; padding: 13px; box-shadow: var(--shadow); }
.stat .k { font-size: 12.5px; color: var(--ink-3); }
.stat .v { font-size: 19px; font-weight: 700; margin-top: 2px; }
.stat .s { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.stat.gold .v { color: var(--gold); }

.progress { height: 8px; background: var(--card-2); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
.progress > div { height: 100%; background: var(--accent); border-radius: 999px; }

/* gráfico de barras */
.bars { display: flex; align-items: flex-end; gap: 10px; height: 140px; padding-top: 10px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bar { width: 100%; max-width: 44px; border-radius: 8px 8px 3px 3px; background: var(--accent); min-height: 3px; }
.bar.hist { background: repeating-linear-gradient(135deg, var(--ink-3) 0 4px, transparent 4px 8px); border: 1.5px solid var(--ink-3); }
.bar-col .bl { font-size: 11.5px; color: var(--ink-3); }
.bar-col .bv { font-size: 11px; font-weight: 650; }

/* calendário */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-head b { font-size: 17px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal .dow { font-size: 11.5px; color: var(--ink-3); font-weight: 600; padding: 4px 0; }
.cal .day { aspect-ratio: 1; border: 0; border-radius: 12px; background: transparent; font-size: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.cal .day.out { opacity: .25; }
.cal .day.today { outline: 2px solid var(--accent); }
.cal .day.sel { background: var(--ink); color: var(--bg); }
.dots { display: flex; gap: 3px; height: 5px; }
.dot { width: 5px; height: 5px; border-radius: 50%; }
.dot.due { background: var(--danger); } .dot.inc { background: var(--pos); } .dot.tx { background: var(--info); }

/* barra de abas */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
.tabbar nav { max-width: 640px; margin: 0 auto; display: flex; height: var(--tabbar-h); }
.tabbar button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; font-weight: 600; color: var(--ink-3); position: relative; }
.tabbar button svg { width: 23px; height: 23px; }
.tabbar button.on { color: var(--accent); }
.tabbar .pip { position: absolute; top: 9px; right: calc(50% - 17px); width: 8px; height: 8px; border-radius: 50%; background: var(--laranja); border: 2px solid var(--card); }

.fab { position: fixed; right: max(16px, calc(50% - 304px)); bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px); z-index: 19; width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 24px rgba(11, 110, 105, .35); display: grid; place-items: center; }
.fab svg { width: 26px; height: 26px; }

/* folhas (modais) */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; background: rgba(5, 10, 15, .45); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 94vh; max-height: 94dvh; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: up .24s cubic-bezier(.2, .8, .2, 1); }
.sheet.full { height: 94vh; height: 94dvh; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; gap: 10px; }
.sheet-head h2 { font-size: 18px; margin: 0; font-weight: 700; flex: 1; }
.sheet-body { overflow-y: auto; padding: 4px 16px 16px; -webkit-overflow-scrolling: touch; flex: 1; }
.sheet-foot { padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg); }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* formulários */
.field { margin-bottom: 12px; }
.field > label, .lbl { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 0 0 5px 2px; }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 13px; font-size: 16px; outline: none; -webkit-appearance: none; appearance: none; }
select.input { background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.big { font-size: 28px; font-weight: 700; text-align: center; padding: 14px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.help { font-size: 12.5px; color: var(--ink-3); margin: 4px 2px 0; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; margin: 1px 0 0; }
.radio-card { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; margin-bottom: 8px; background: var(--card); }
.radio-card input { accent-color: var(--accent); width: 20px; height: 20px; margin: 1px 0 0; flex: none; }

/* diferenças na importação */
.diff-item { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 10px; box-shadow: var(--shadow); }
.diff-item .hdr { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.diff-field { font-size: 13px; margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 8px; }
.diff-field .f { font-weight: 650; color: var(--ink-2); }
.old { color: var(--neg); text-decoration: line-through; word-break: break-word; }
.new { color: var(--pos); word-break: break-word; }
.pick { display: flex; gap: 6px; margin-top: 10px; }
.pick button { flex: 1; border: 1px solid var(--line); background: var(--card-2); border-radius: 10px; padding: 8px; font-size: 13px; font-weight: 650; color: var(--ink-2); }
.pick button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.kv { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; word-break: break-word; }
pre.raw { white-space: pre-wrap; word-break: break-word; font-size: 12px; background: var(--card-2); padding: 10px; border-radius: 10px; max-height: 260px; overflow: auto; }

/* PIN */
.lock { position: fixed; inset: 0; z-index: 100; background: linear-gradient(160deg, var(--hero-1), var(--hero-2)); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.lock h2 { margin: 14px 0 4px; font-size: 20px; }
.pin-dots { display: flex; gap: 14px; margin: 22px 0 28px; }
.pin-dots span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .8); }
.pin-dots span.f { background: #fff; }
.keypad { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px; }
.keypad button { height: 76px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .12); color: #fff; font-size: 28px; font-weight: 500; }
.keypad button.blank { background: transparent; }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 86px); z-index: 120; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); max-width: calc(100% - 32px); display: flex; gap: 12px; align-items: center; animation: up .2s ease; }
.toast button { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 0; }

.empty { text-align: center; padding: 30px 16px; color: var(--ink-3); }
.empty .e-ico { font-size: 34px; margin-bottom: 6px; }
details.fold > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 650; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "›"; font-size: 22px; color: var(--ink-3); transition: transform .2s; }
details.fold[open] > summary::after { transform: rotate(90deg); }
.welcome { text-align: center; padding: 30px 6px 10px; }
.welcome .logo { width: 84px; height: 84px; border-radius: 22px; margin: 0 auto 14px; display: block; box-shadow: 0 10px 30px rgba(11, 110, 105, .3); }
.welcome h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.02em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ações rápidas estilo banco */
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 14px; }
.quick button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); padding: 4px 0; }
.quick button span { width: 54px; height: 54px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--accent); }
.quick button span svg { width: 23px; height: 23px; }
[style*="grid-template-columns"] > .btn + .btn { margin-top: 0; }

/* Pergunte ao Cofre */
.bubble { max-width: 92%; padding: 11px 14px; border-radius: 18px; margin: 0 0 10px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
.bubble.user { margin-left: auto; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 6px; width: fit-content; }
.bubble.bot { background: var(--card); box-shadow: var(--shadow); border-bottom-left-radius: 6px; }
.bubble .kv { font-size: 13.5px; }
.ans-title { font-weight: 700; font-size: 15px; }
.ans-total { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin-top: 4px; }
.askbar { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); z-index: 21; display: flex; gap: 8px; padding: 10px 12px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); max-width: 640px; margin: 0 auto; }
.askbar .input { flex: 1; padding: 11px 13px; }
.askbar .btn { width: 48px; padding: 0; flex: none; }

</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<noscript>Este app precisa de JavaScript ativado.</noscript>
<script>
/* Cofre Financeiro Familiar — motor de dados (sem interface).
 * Funções puras: validação, migração, comparação, mesclagem, saldos, integridade.
 * Princípios:
 *  - Nunca reescrever dados do usuário; só interpretar.
 *  - Mesclagem por ID estável; campos ausentes no arquivo importado são preservados.
 *  - Saldo = snapshot + lançamentos CONFIRMADOS posteriores ao corte.
 */
(function (root) {
  'use strict';

  const APP_SCHEMA = '1.1.0';
  const APP_NAME = 'Cofre Financeiro Familiar';

  // Chaves de metadados gerados pelo app: ignoradas na comparação/importação.
  const META_KEYS = new Set([
    'schema_version', 'exported_at', 'integrity', 'calculated_balances',
    'app', 'format_guide', 'backup_id', 'sync'
  ]);

  const TX_TYPES = {
    despesa: 'despesa', gasto: 'despesa', expense: 'despesa',
    receita: 'receita', entrada: 'receita', income: 'receita',
    transferencia: 'transferencia', transferencia_interna: 'transferencia', transfer: 'transferencia',
    provisao: 'provisao', provision: 'provisao', reserva: 'provisao',
    ajuste: 'ajuste', adjustment: 'ajuste',
    pagamento_fatura: 'pagamento_fatura', pagamento_de_fatura: 'pagamento_fatura', fatura: 'pagamento_fatura', card_payment: 'pagamento_fatura',
    emprestimo: 'emprestimo', emprestimo_recebido: 'emprestimo', loan: 'emprestimo'
  };
  const TX_STATUS = {
    confirmado: 'confirmado', confirmed: 'confirmado', realizado: 'confirmado', pago: 'confirmado',
    pendente: 'pendente', pending: 'pendente',
    planejado: 'planejado', planned: 'planejado',
    estimado: 'estimado', estimated: 'estimado', previsto: 'estimado',
    cancelado: 'cancelado', cancelada: 'cancelado', canceled: 'cancelado', cancelled: 'cancelado'
  };
  const CLOSED_OBLIGATION = new Set(['pago', 'paga', 'quitado', 'quitada', 'cancelado', 'cancelada', 'paid']);
  const CATEGORIES = ['Casa', 'Alimentação/Compras', 'Transporte', 'Lazer/Assinaturas', 'Banco/Dívidas', 'Viagem/Espanha', 'Saúde/Emergências'];

  // ---------- utilitários ----------
  function norm(s) {
    return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '')
      .toLowerCase().trim().replace(/[\s-]+/g, '_');
  }
  function isObj(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }
  function clone(v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }
  function stable(v) {
    if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
    if (isObj(v)) return '{' + Object.keys(v).sort().filter(k => v[k] !== undefined)
      .map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
    return JSON.stringify(v === undefined ? null : v);
  }
  function fnv(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h.toString(16).padStart(8, '0');
  }
  function num(v) {
    if (typeof v === 'number' && isFinite(v)) return v;
    if (typeof v === 'string' && v.trim() !== '') {
      const s = v.replace(/[R$€\s]/g, '');
      const n = Number(/,\d{1,2}$/.test(s) ? s.replace(/\./g, '').replace(',', '.') : s);
      return isFinite(n) ? n : NaN;
    }
    return NaN;
  }
  function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  function dateOnly(v) {
    if (typeof v !== 'string') return null;
    const m = v.match(/^(\d{4}-\d{2}-\d{2})/);
    return m ? m[1] : null;
  }
  function idOf(item) {
    if (!isObj(item)) return undefined;
    if (item.id != null && item.id !== '') return String(item.id);
    if (item.event_id != null && item.event_id !== '') return String(item.event_id);
    return undefined;
  }
  function idField(item) { return isObj(item) && item.id == null && item.event_id != null ? 'event_id' : 'id'; }
  function txType(t) { return TX_TYPES[norm(t && t.type)] || null; }
  function txStatus(t) { return TX_STATUS[norm(t && t.status)] || null; }
  function amountOf(o) {
    if (!isObj(o)) return NaN;
    for (const k of ['amount', 'amount_brl', 'amount_max_brl', 'amount_remaining_brl', 'value']) {
      if (o[k] !== undefined && o[k] !== null) { const n = num(o[k]); if (!isNaN(n)) return n; }
    }
    return NaN;
  }
  function currencyOf(o, ds) {
    if (o && o.currency) return String(o.currency).toUpperCase();
    if (o && Object.keys(o).some(k => /_brl$/.test(k))) return 'BRL';
    if (o && Object.keys(o).some(k => /_eur$/.test(k))) return 'EUR';
    return (ds && ds.currency_default) || 'BRL';
  }
  function isObligationOpen(o) { return !CLOSED_OBLIGATION.has(norm(o && o.status)); }

  // Coleção = lista de objetos com id/event_id.
  function isIdCollection(arr) {
    return Array.isArray(arr) && arr.length > 0 && arr.every(x => isObj(x) && (idOf(x) !== undefined || x.__needsId));
  }
  function looksLikeRecordList(arr) {
    // lista de objetos onde a maioria tem id → tratamos como coleção (itens sem id ganham id automático)
    if (!Array.isArray(arr) || arr.length === 0 || !arr.every(isObj)) return false;
    const withId = arr.filter(x => idOf(x) !== undefined).length;
    return withId > 0 && withId >= arr.length / 2;
  }
  function kindOf(cur, inc) {
    const a = inc !== undefined ? inc : cur;
    const b = inc !== undefined ? cur : undefined;
    const coll = v => Array.isArray(v) && (looksLikeRecordList(v));
    if (coll(a) || coll(b)) return 'collection';
    if (Array.isArray(a) && a.length === 0 && Array.isArray(b) && b.length === 0) return 'list';
    if (Array.isArray(a) && a.every(x => !isObj(x) && !Array.isArray(x))) return 'list';
    if (Array.isArray(a) && a.length === 0 && Array.isArray(b) && b.every(x => !isObj(x))) return 'list';
    return 'block';
  }
  // Coleções conhecidas: mesmo vazias, são coleções.
  const KNOWN_COLLECTIONS = new Set(['accounts', 'credit_facilities', 'transactions', 'obligations', 'budgets',
    'income_forecasts', 'goals', 'audit_log', 'attachments_manifest', 'ride_history', 'planned_recurring',
    'pending_receivables', 'deleted_records']);

  // ---------- preparação (migração + IDs automáticos determinísticos) ----------
  function prepare(input) {
    const notes = [];
    if (!isObj(input)) return { data: null, notes, fatal: 'O arquivo não contém um objeto JSON de backup.' };
    const ds = clone(input);

    // Migração do formato inicial (1.0.0): lançamentos confirmados pós-corte → transactions
    if (Array.isArray(ds.confirmed_transactions_after_snapshot)) {
      const moved = ds.confirmed_transactions_after_snapshot;
      if (!Array.isArray(ds.transactions)) ds.transactions = [];
      const have = new Set(ds.transactions.map(idOf));
      let n = 0;
      for (const t of moved) { if (!have.has(idOf(t))) { ds.transactions.push(t); n++; } }
      delete ds.confirmed_transactions_after_snapshot;
      notes.push(n ? `${n} lançamento(s) confirmados pós-corte movidos para "transactions".`
        : 'Campo "confirmed_transactions_after_snapshot" (vazio) convertido para "transactions".');
    }
    if (!Array.isArray(ds.transactions)) ds.transactions = [];
    if (!Array.isArray(ds.deleted_records)) ds.deleted_records = [];

    // Semáforo: se não houver campo próprio, derivar da regra textual (sem inventar).
    if (!isObj(ds.traffic_light) && Array.isArray(ds.rules)) {
      for (const r of ds.rules) {
        const m = typeof r === 'string' && r.match(/sem[aá]foro[^:]*:\s*(verde|amarelo|laranja|vermelho)/i);
        if (m) {
          ds.traffic_light = { level: m[1].toUpperCase(), date: ds.snapshot_date || null, source: 'derivado das regras do backup' };
          break;
        }
      }
    }

    // IDs automáticos determinísticos para itens de coleção sem ID (reimportar = mesmo ID).
    let autoIds = 0;
    for (const key of Object.keys(ds)) {
      const arr = ds[key];
      if (!(KNOWN_COLLECTIONS.has(key) ? Array.isArray(arr) : looksLikeRecordList(arr))) continue;
      const seen = {};
      for (const item of arr) {
        if (!isObj(item) || idOf(item) !== undefined) continue;
        const base = key.replace(/s$/, '').slice(0, 12) + '-auto-' + fnv(stable(item));
        seen[base] = (seen[base] || 0) + 1;
        item.id = seen[base] > 1 ? base + '-' + seen[base] : base;
        item.id_generated_by_app = true;
        autoIds++;
      }
    }
    if (autoIds) notes.push(`${autoIds} registro(s) sem ID receberam ID automático estável.`);
    return { data: ds, notes };
  }

  // ---------- validação ----------
  function validate(ds) {
    const errors = [], warnings = [], counts = {};
    if (!isObj(ds)) return { errors: ['Arquivo inválido: não é um objeto JSON.'], warnings, counts };
    const sv = ds.schema_version;
    if (sv == null) warnings.push('Arquivo sem "schema_version".');
    else if (String(sv).split('.')[0] !== '1') errors.push(`Versão de formato desconhecida (${sv}). Este app lê a versão 1.x.`);
    if (!Array.isArray(ds.accounts)) errors.push('Arquivo sem lista "accounts" — não parece um backup do cofre.');
    if (ds.snapshot_date != null && !DATE_RE.test(ds.snapshot_date)) warnings.push(`"snapshot_date" com formato inesperado: ${ds.snapshot_date}`);
    if (ds.snapshot_date == null) warnings.push('Arquivo sem "snapshot_date" (data de corte dos saldos).');

    for (const key of Object.keys(ds)) {
      const arr = ds[key];
      if (!Array.isArray(arr)) continue;
      counts[key] = arr.length;
      if (!(KNOWN_COLLECTIONS.has(key) || looksLikeRecordList(arr))) continue;
      const ids = new Map();
      arr.forEach((it, i) => {
        if (!isObj(it)) { errors.push(`"${key}" item ${i + 1} não é um registro.`); return; }
        const id = idOf(it);
        if (id === undefined) { warnings.push(`"${key}" item ${i + 1} sem ID.`); return; }
        if (ids.has(id)) errors.push(`ID repetido em "${key}": ${id}`);
        ids.set(id, true);
      });
    }

    const acctIds = new Set((ds.accounts || []).map(idOf));
    const creditIds = new Set((ds.credit_facilities || []).map(idOf));
    (ds.accounts || []).forEach(a => {
      if (!isObj(a)) return;
      if (a.snapshot_balance !== null && a.snapshot_balance !== undefined && isNaN(num(a.snapshot_balance)))
        errors.push(`Conta ${idOf(a)}: saldo de corte inválido (${a.snapshot_balance}).`);
      if (a.currency && !['BRL', 'EUR'].includes(String(a.currency).toUpperCase()))
        warnings.push(`Conta ${idOf(a)}: moeda ${a.currency} não reconhecida.`);
      if (a.snapshot_date && !DATE_RE.test(a.snapshot_date)) warnings.push(`Conta ${idOf(a)}: data de corte com formato inesperado.`);
    });
    (ds.transactions || []).forEach(t => {
      if (!isObj(t)) return;
      const id = idOf(t) || '(sem id)';
      if (!DATE_RE.test(dateOnly(t.date) || '')) errors.push(`Lançamento ${id}: data inválida (${t.date}). Use AAAA-MM-DD.`);
      if (isNaN(num(t.amount))) errors.push(`Lançamento ${id}: valor inválido (${t.amount}).`);
      if (!txType(t)) warnings.push(`Lançamento ${id}: tipo "${t.type}" não reconhecido — não afeta saldos.`);
      if (!txStatus(t)) warnings.push(`Lançamento ${id}: status "${t.status}" não reconhecido — tratado como não confirmado.`);
      const ty = txType(t);
      if (t.account_id && !acctIds.has(String(t.account_id)) && !creditIds.has(String(t.account_id)))
        warnings.push(`Lançamento ${id}: conta "${t.account_id}" não existe — não afeta saldos.`);
      if (!t.account_id && ty !== 'provisao') warnings.push(`Lançamento ${id}: sem conta (account_id).`);
      if (ty === 'transferencia' && !t.to_account_id) warnings.push(`Transferência ${id}: sem conta de destino (to_account_id).`);
      if (ty === 'pagamento_fatura' && !creditIds.has(String(t.to_account_id))) warnings.push(`Pagamento de fatura ${id}: "to_account_id" deve ser um cartão de "credit_facilities".`);
      if (ty !== 'ajuste' && num(t.amount) < 0) warnings.push(`Lançamento ${id}: valor negativo; use valor positivo e o tipo certo.`);
    });
    (ds.obligations || []).forEach(o => {
      if (!isObj(o)) return;
      if (isNaN(amountOf(o))) warnings.push(`Conta a pagar ${idOf(o)}: sem valor numérico.`);
      if (o.due_date != null && !DATE_RE.test(o.due_date)) warnings.push(`Conta a pagar ${idOf(o)}: vencimento com formato inesperado (${o.due_date}).`);
    });
    return { errors, warnings, counts };
  }

  // ---------- comparação ----------
  function txFingerprint(t) {
    return [dateOnly(t.date), round2(num(t.amount)), t.account_id || '', txType(t) || ''].join('|');
  }
  function genericFingerprint(it) {
    const c = Object.assign({}, it);
    delete c.id; delete c.event_id; delete c.created_at; delete c.updated_at; delete c.id_generated_by_app;
    return stable(c);
  }


  // Nome legível para IDs técnicos (só exibição; o dado não muda).
  const ID_NAMES = { rent: 'Aluguel', internet: 'Internet', claro_tv: 'Claro TV', chip_user: 'Chip usuário', school_transport: 'Perua escolar', lawyer: 'Advogado',
    real_estate_process: 'Processo imobiliária', psn: 'PSN', icloud: 'iCloud', luna_salary: 'Salário Luna', user_salary_nov: 'Salário usuário (nov)', user_advance_nov: 'Adiantamento usuário (nov)',
    user_13th_first: '13º usuário (1ª parcela)', luna_13th_first: '13º Luna (1ª parcela)', luna_vr: 'VR Luna', user_vr: 'VR usuário', vilma_dm: 'Vilma (DM)', claro_vilma: 'Claro (Vilma)',
    claro_renan: 'Claro (Renan)', luna_supermarket: 'Supermercado Luna (reembolso)', transport_until_nov1: 'Transporte até 1/nov', kids_leisure_oct: 'Lazer das crianças (out)',
    milk_purchase: 'Compra do leite', spain: 'Espanha', emergency: 'Reserva emergencial', dm_credit_card: 'Cartão DM' };
  const ID_WORDS = { cartao: 'cartão', usuario: 'usuário', user: 'usuário', emprestimo: 'empréstimo', agua: 'água', facil: 'Fácil', reneg: 'renegociação', dm: 'DM', psn: 'PSN',
    icloud: 'iCloud', enel: 'Enel', luna: 'Luna', nao: 'não', provisao: 'provisão', colchao: 'colchão', espanha: 'Espanha', credit: 'crédito', card: 'cartão', tv: 'TV', vr: 'VR' };
  function displayName(id) {
    if (id == null) return '';
    const raw = String(id); if (ID_NAMES[raw]) return ID_NAMES[raw];
    let s = raw.replace(/[_-]+/g, ' ').trim();
    s = s.split(' ').map(w => ID_WORDS[w.toLowerCase()] !== undefined ? ID_WORDS[w.toLowerCase()] : w).filter(Boolean).join(' ');
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function recHash(r) { return fnv(stable(r)); }
  // Impressão digital de cada registro no momento da exportação (base da comparação em 3 vias).
  function makeBase(ds) {
    const base = {};
    for (const k of Object.keys(ds || {})) {
      if (META_KEYS.has(k) || !Array.isArray(ds[k])) continue;
      if (!(KNOWN_COLLECTIONS.has(k) || looksLikeRecordList(ds[k]))) continue;
      base[k] = {};
      ds[k].forEach(x => { const id = idOf(x); if (id !== undefined) base[k][id] = recHash(x); });
    }
    return base;
  }
  function changesSince(ds, base) {
    const out = [];
    if (!base) return out;
    for (const k of Object.keys(ds || {})) {
      if (META_KEYS.has(k) || !Array.isArray(ds[k]) || k === 'audit_log') continue;
      if (!(KNOWN_COLLECTIONS.has(k) || looksLikeRecordList(ds[k]))) continue;
      const b = base[k] || {};
      ds[k].forEach(x => {
        const id = idOf(x); if (id === undefined) return;
        if (b[id] === undefined) out.push({ collection: k, id, change: 'novo' });
        else if (b[id] !== recHash(x)) out.push({ collection: k, id, change: 'alterado' });
      });
    }
    return out;
  }
  function categoryGroup(c) {
    const n = norm(c);
    if (!n) return 'Sem categoria';
    if (/aliment|compra|mercado/.test(n)) return 'Alimentação/Compras';
    if (/transport/.test(n)) return 'Transporte';
    if (/^casa|moradia/.test(n)) return 'Casa';
    if (/lazer|assinatura/.test(n)) return 'Lazer/Assinaturas';
    if (/banco|divida/.test(n)) return 'Banco/Dívidas';
    if (/viagem|espanha/.test(n)) return 'Viagem/Espanha';
    if (/saude|emergenc/.test(n)) return 'Saúde/Emergências';
    return String(c);
  }

  function diff(current, incoming, opts) {
    opts = opts || {};
    const res = { collections: {}, lists: {}, blocks: {}, localOnly: [], warnings: [], older: false, firstImport: !current };
    current = current || {};
    // Arquivo mais antigo?
    const incAt = Date.parse(incoming.exported_at || '');
    const curAt = Date.parse(opts.currentAsOf || '');
    if (!isNaN(incAt) && !isNaN(curAt) && incAt < curAt - 60000) {
      res.older = true;
      res.warnings.push('Este arquivo é MAIS ANTIGO que os dados atuais do app. Na dúvida, mantenha os dados atuais.');
    }
    if (current.snapshot_date && incoming.snapshot_date && current.snapshot_date !== incoming.snapshot_date)
      res.warnings.push(`A data de corte mudou: ${current.snapshot_date} → ${incoming.snapshot_date}. Confira se os saldos de corte também foram atualizados.`);

    const deleted = new Set((current.deleted_records || []).map(d => d && d.collection + ':' + d.record_id));
    const keys = Array.from(new Set([...Object.keys(current), ...Object.keys(incoming)]));
    for (const key of keys) {
      if (META_KEYS.has(key)) continue;
      const cur = current[key], inc = incoming[key];
      if (inc === undefined) { res.localOnly.push(key); continue; }
      const kind = KNOWN_COLLECTIONS.has(key) && (Array.isArray(inc) || Array.isArray(cur)) ? 'collection' : kindOf(cur, inc);
      if (kind === 'collection') {
        const curArr = Array.isArray(cur) ? cur : [];
        const incArr = Array.isArray(inc) ? inc : [];
        const byId = new Map(curArr.map(x => [idOf(x), x]));
        const fpCur = new Map();
        curArr.forEach(x => { if (isObj(x)) fpCur.set(key === 'transactions' ? txFingerprint(x) : genericFingerprint(x), idOf(x)); });
        const fpNew = new Map();
        const c = { added: [], changed: [], same: 0, localOnly: 0 };
        for (const it of incArr) {
          if (!isObj(it)) continue;
          const id = idOf(it);
          const old = byId.get(id);
          if (!old) {
            const fp = key === 'transactions' ? txFingerprint(it) : genericFingerprint(it);
            const entry = { id, item: it };
            if (deleted.has(key + ':' + id)) entry.wasDeleted = true;
            if (fpCur.has(fp)) entry.suspectOf = fpCur.get(fp);
            else if (fpNew.has(fp)) entry.suspectOf = fpNew.get(fp);
            fpNew.set(fp, id);
            c.added.push(entry);
          } else {
            const fields = Object.keys(it).filter(k => stable(it[k]) !== stable(old[k]));
            if (fields.length) {
              // 3 vias: compara com a versão da última exportação (se conhecida)
              const b = opts.base && opts.base[key] ? opts.base[key][id] : undefined;
              let side = 'unknown';
              if (b !== undefined) {
                const localChanged = recHash(old) !== b, fileChanged = recHash(it) !== b;
                side = localChanged && fileChanged ? 'conflict' : (localChanged ? 'local' : 'file');
              }
              c.changed.push({ id, current: old, incoming: it, fields, side });
            } else c.same++;
          }
        }
        const incIds = new Set(incArr.map(idOf));
        c.localOnly = curArr.filter(x => !incIds.has(idOf(x))).length;
        res.collections[key] = c;
      } else if (kind === 'list') {
        const curArr = Array.isArray(cur) ? cur : [];
        const incArr = Array.isArray(inc) ? inc : [];
        const cs = new Set(curArr.map(stable)), is = new Set(incArr.map(stable));
        const added = incArr.filter(x => !cs.has(stable(x)));
        const missing = curArr.filter(x => !is.has(stable(x)));
        res.lists[key] = { added, missing, identical: !added.length && !missing.length };
      } else {
        if (cur === undefined) res.blocks[key] = { kind: 'new', incoming: inc };
        else if (stable(cur) !== stable(inc)) res.blocks[key] = { kind: 'changed', current: cur, incoming: inc };
      }
    }
    return res;
  }

  function defaultDecisions(d) {
    const dec = { collections: {}, lists: {}, blocks: {} };
    for (const [k, c] of Object.entries(d.collections)) {
      dec.collections[k] = { added: {}, changed: {} };
      c.added.forEach(a => { dec.collections[k].added[a.id] = !(a.suspectOf || a.wasDeleted); });
      c.changed.forEach(ch => {
        dec.collections[k].changed[ch.id] = ch.side === 'conflict' ? null : ch.side === 'local' ? 'current' : ch.side === 'file' ? 'incoming' : (d.older ? 'current' : 'incoming');
      });
    }
    for (const k of Object.keys(d.lists)) dec.lists[k] = 'merge';
    for (const [k, b] of Object.entries(d.blocks)) dec.blocks[k] = b.kind === 'new' ? 'incoming' : (d.older ? 'current' : 'incoming');
    return dec;
  }

  function diffStats(d) {
    let added = 0, changed = 0, same = 0, suspects = 0, localOnly = 0;
    for (const c of Object.values(d.collections)) {
      added += c.added.length; changed += c.changed.length; same += c.same; localOnly += c.localOnly;
      suspects += c.added.filter(a => a.suspectOf || a.wasDeleted).length;
    }
    const lists = Object.values(d.lists).filter(l => !l.identical).length;
    const blocks = Object.keys(d.blocks).length;
    let conflicts = 0;
    for (const c of Object.values(d.collections)) conflicts += c.changed.filter(x => x.side === 'conflict').length;
    return { added, changed, same, suspects, localOnly, lists, blocks, conflicts, nothing: !added && !changed && !lists && !blocks };
  }

  function applyMerge(current, incoming, d, dec) {
    const out = clone(current) || {};
    const summary = { added: 0, updated: 0, skipped: 0, kept: 0 };
    for (const [key, c] of Object.entries(d.collections)) {
      if (!Array.isArray(out[key])) out[key] = [];
      const idx = new Map(out[key].map((x, i) => [idOf(x), i]));
      for (const ch of c.changed) {
        if ((dec.collections[key] || {}).changed?.[ch.id] === 'incoming') {
          // mescla por campo: campos ausentes no arquivo são preservados

        raw: cat.rows.map(r => [r.cat, { v: r.hist, t: 'money' }, { v: r.after, t: 'money' }, { v: r.total, t: 'money' }]), rawHead: ['Categoria', 'Até o corte (resumo)', 'Lançamentos confirmados', 'Total'], align: ['left', 'right', 'right', 'right'] });
    }

    const obRows = [...ob.paid.map(o => [oblTitle(o), fd(o.due_date), 'Pago', money(C.amountOf(o))]), ...ob.open.map(o => [oblTitle(o), fd(o.due_date), human(o.status), money(C.amountOf(o))])];
    m.sections.push({ type: 'table', title: 'Contas do mês (pagas e em aberto)', head: ['Conta', 'Vencimento', 'Status', 'Valor'], widths: [40, 18, 18, 20], align: ['left', 'left', 'left', 'right'], rows: obRows, empty: 'Nenhuma conta com vencimento neste mês.',
      raw: [...ob.paid, ...ob.open].map(o => [oblTitle(o), { v: o.due_date, t: 'date' }, human(o.status), { v: C.amountOf(o), t: 'money' }]), rawHead: ['Conta', 'Vencimento', 'Status', 'Valor'] });
    const tb = txTable(ds, txs, null, null);
    m.sections.push({ type: 'table', title: `Lançamentos do mês (${txs.length})`, head: tb.head, rows: tb.rows, raw: tb.raw, rawHead: tb.rawHead, widths: tb.widths, primary: true, empty: 'Nenhum lançamento registrado no app neste mês.' });
    m.sections.push({ type: 'notes', items: cat.notes.concat(['Euros (Espanha) e caixinha são reservas protegidas e não entram no disponível.', 'Crédito, cashback e valores prometidos não são dinheiro em caixa.']) });
    m.formats = ['pdf', 'png', 'xlsx', 'csv']; m.file = 'relatorio_mensal_' + month;

  }
  function accountsTable(ds, s) {
    const rows = s.balances.map(b => [b.name, b.currency, b.unknown ? 'Saldo desconhecido' : money(b.balance, b.currency), b.protected ? 'Protegida' : (b.unknown ? '—' : 'Disponível')]);

      raw: s.balances.map(b => [b.name, b.currency, b.unknown ? 'desconhecido' : { v: b.balance, t: 'money' }, b.protected ? 'Protegida' : 'Disponível']), rawHead: ['Conta', 'Moeda', 'Saldo', 'Situação'] };
  }

  // 3. Resumo familiar (para compartilhar)
  function family(ds, month) {

    const tl = ds.traffic_light && ds.traffic_light.level ? String(ds.traffic_light.level).toUpperCase() : null;
    const m = baseModel('familia', 'Resumo Financeiro da Família', p.label, [['Mês', p.label], ['Semáforo', tl || 'não definido']]);
    m.traffic = tl;
    m.sections.push({ type: 'kpis', items: [
      { label: 'Disponível em conta', value: money(s.cashBRL), tone: 'accent' },
      { label: 'Livre após provisões', value: money(s.freeAfterProvisions) },

    m.sections.push({ type: 'notes', items: cat.notes.concat([`A pagar em aberto: ${money(s.openPending)} pendente e ${money(s.openPlanned)} planejado.`]) });

  // 5. Despesas por categoria
  function categories(ds, start, end, label) {
    const cat = categoryRows(ds, start, end);
    const txs = R.filterTx(ds, { start, end }).filter(t => C.txType(t) === 'despesa' && C.txStatus(t) === 'confirmado').sort((a, b) => C.num(b.amount) - C.num(a.amount));
    const total = C.round2(cat.histTotal + cat.afterTotal);
    const lbl = label || `${fd(start)} a ${fd(end)}`;
    const m = baseModel('categorias', 'Relatório de Despesas por Categoria', lbl, [['Período', lbl]]);
    m.sections.push({ type: 'kpis', items: [{ label: 'Total de despesas', value: money(total) }, { label: 'Lançamentos confirmados', value: money(cat.afterTotal), sub: txs.length + ' lançamento(s)' }, { label: 'Resumo histórico', value: cat.histTotal ? money(cat.histTotal) : '—', sub: 'até a data de corte' }] });
    if (cat.rows.length) m.sections.push({ type: 'bars', title: 'Distribuição', items: cat.rows.map(r => ({ label: r.cat, value: r.total, display: money(r.total) + (total ? ` · ${Math.round(r.total / total * 100)}%` : '') })) });
    m.sections.push({ type: 'table', title: 'Por categoria', head: ['Categoria', 'Até o corte', 'Lançamentos', 'Total', '%'], widths: [32, 18, 18, 18, 10], align: ['left', 'right', 'right', 'right', 'right'], primary: true,
      rows: cat.rows.map(r => [r.cat, r.hist ? money(r.hist) : '—', r.after ? money(r.after) : '—', money(r.total), total ? Math.round(r.total / total * 100) + '%' : '—']), foot: ['Total', money(cat.histTotal), money(cat.afterTotal), money(total), '100%'], empty: 'Nenhuma despesa no período.',
      raw: cat.rows.map(r => [r.cat, { v: r.hist, t: 'money' }, { v: r.after, t: 'money' }, { v: r.total, t: 'money' }, { v: total ? Math.round(r.total / total * 1000) / 10 : 0, t: 'n' }]), rawHead: ['Categoria', 'Até o corte (resumo)', 'Lançamentos', 'Total', '%'] });
    if (txs.length) m.sections.push({ type: 'table', title: 'Maiores despesas lançadas', head: ['Data', 'Descrição', 'Categoria', 'Valor'], widths: [14, 46, 20, 20], align: ['left', 'left', 'left', 'right'], rows: txs.slice(0, 12).map(t => [fd(t.date), t.description || '—', C.categoryGroup(t.category), money(C.num(t.amount), t.currency)]),
      raw: txs.map(t => [{ v: C.dateOnly(t.date), t: 'date' }, t.description || '', C.categoryGroup(t.category), { v: C.num(t.amount), t: 'money' }]), rawHead: ['Data', 'Descrição', 'Categoria', 'Valor'] });
    m.sections.push({ type: 'notes', items: cat.notes.concat(['Transferências entre contas e pagamentos de fatura não são despesas e ficam de fora. Compras no crédito entram como despesa na data da compra.']) });
    m.formats = ['pdf', 'png', 'xlsx', 'csv']; m.file = 'despesas_por_categoria_' + start.replace(/^0000.*/, 'inicio') + '_' + end.replace(/^9999.*/, 'hoje');
    return m;
  }

    const tb = txTable(ds, txs, null, null);
    m.sections.push({ type: 'table', title: `Lançamentos (${txs.length})`, head: tb.head, rows: tb.rows, raw: tb.raw, rawHead: tb.rawHead, widths: tb.widths, primary: true, empty: 'Nenhum lançamento registrado após o corte.' });
    const known = Array.isArray(ds.known_paid_october) ? ds.known_paid_october : [];
    if (known.length) m.sections.push({ type: 'table', title: 'Pagamentos históricos conhecidos (já no saldo de corte)', head: ['Descrição', 'Pago por', 'Valor'], widths: [55, 20, 25], align: ['left', 'left', 'right'], rows: known.map(k => [k.description || '', k.paid_by || '', money(C.amountOf(k))]), foot: ['Total', '', money(C.round2(known.reduce((a, k) => a + (C.amountOf(k) || 0), 0)))],
      raw: known.map(k => [k.description || '', k.paid_by || '', { v: C.amountOf(k), t: 'money' }]), rawHead: ['Descrição', 'Pago por', 'Valor'] });
    const rides = Array.isArray(ds.ride_history) ? ds.ride_history : [];

      raw: rides.map(r => [{ v: r.date, t: 'date' }, r.mode || '', r.reason || '', { v: C.amountOf(r), t: 'money' }]), rawHead: ['Data', 'Modo', 'Motivo', 'Valor'] });

  // ---------- PDF ----------
  const TEAL = '#0B6E69', INK = '#14202E', GRAY = '#6B7686', LIGHT = '#F2F5F7', LINE = '#DDE3E8';
  function renderPdf(m) {
    const pdf = new P.PDF(); const W = pdf.W, H = pdf.H, M = 36, CW = W - 2 * M, BOTTOM = H - 46;
    let y;
    const newPage = (first) => {
      pdf.addPage();
      if (first) {
        pdf.rect(M, M, CW, 74, { fill: TEAL, r: 10 });
        pdf.text(m.title, M + 16, M + 30, { size: 18, bold: true, color: '#FFFFFF', maxWidth: CW - 170 });
        if (m.subtitle) pdf.text(m.subtitle, M + 16, M + 50, { size: 10.5, color: '#D7F0EE', maxWidth: CW - 170 });
        pdf.text('REGISTRO PESSOAL', M + CW - 14, M + 28, { size: 8, bold: true, color: '#FFFFFF', align: 'right' });
        pdf.text('não é documento bancário', M + CW - 14, M + 40, { size: 7.5, color: '#D7F0EE', align: 'right' });
        pdf.text('Cofre Financeiro Familiar', M + CW - 14, M + 60, { size: 7.5, color: '#D7F0EE', align: 'right' });
        y = M + 92;
        const half = CW / 2;
        m.meta.forEach((kv, i) => {
          const col = i % 2, x = M + col * half;
          if (col === 0 && i) y += 15;
          pdf.text(kv[0], x, y, { size: 7.5, color: GRAY });
          pdf.text(kv[1], x + 92, y, { size: 8.5, bold: true, color: INK, maxWidth: half - 100 });
        });
        y += 20;
      } else {
        pdf.text(m.title, M, M + 10, { size: 9, bold: true, color: TEAL });
        pdf.text(m.subtitle || '', M + CW, M + 10, { size: 8, color: GRAY, align: 'right' });
        pdf.line(M, M + 16, M + CW, M + 16, { color: LINE });
        y = M + 32;
      }
    };
    const ensure = h => { if (y + h > BOTTOM) newPage(false); };
    newPage(true);
    for (const s of m.sections) {
      if (s.type === 'kpis') {
        const n = Math.min(4, s.items.length), gap = 8, w = (CW - gap * (n - 1)) / n;
        for (let i = 0; i < s.items.length; i += n) {
          ensure(58);
          s.items.slice(i, i + n).forEach((it, j) => {
            const x = M + j * (w + gap);
            pdf.rect(x, y, w, 50, { fill: LIGHT, r: 6 });
            pdf.text(it.label, x + 9, y + 15, { size: 7.5, color: GRAY, maxWidth: w - 18 });
            const long = pdf.width(it.value, 12.5, true) > w - 18;
            pdf.text(it.value, x + 9, y + 32, { size: long ? 9 : 12.5, bold: true, color: it.value.startsWith('Saldo histórico') ? '#A15C07' : INK, maxWidth: w - 18 });
            if (it.sub) pdf.text(it.sub, x + 9, y + 44, { size: 6.8, color: GRAY, maxWidth: w - 18 });
          });
          y += 58;
        }
        y += 6;
      } else if (s.type === 'bars') {
        ensure(30 + Math.min(s.items.length, 3) * 16);
        pdf.text(s.title, M, y + 8, { size: 11, bold: true, color: INK }); y += 20;
        const max = Math.max(...s.items.map(i => i.value), 1), lw = 150, vw = 110, bw = CW - lw - vw - 10;
        for (const it of s.items) {
          ensure(16);
          pdf.text(it.label, M, y + 9, { size: 8.5, color: INK, maxWidth: lw - 6 });
          pdf.rect(M + lw, y + 1, bw, 10, { fill: LIGHT, r: 3 });
          if (it.value > 0) pdf.rect(M + lw, y + 1, Math.max(3, bw * it.value / max), 10, { fill: TEAL, r: 3 });
          pdf.text(it.display, M + CW, y + 9, { size: 8.5, bold: true, color: INK, align: 'right' });
          y += 16;
        }
        if (s.total) { pdf.text('Total: ' + s.total, M + CW, y + 9, { size: 8.5, bold: true, color: TEAL, align: 'right' }); y += 14; }
        y += 10;
      } else if (s.type === 'table') {
        const ws = s.widths || s.head.map(() => 1), sum = ws.reduce((a, b) => a + b, 0);
        const cw = ws.map(w => CW * w / sum);
        const al = s.align || s.head.map((h, i) => (/Valor|Saldo|Total|Limite|Utilizado|Disponível|%|Lançamentos|corte/.test(h) && i > 0) ? 'right' : 'left');
        const header = () => {
          pdf.rect(M, y, CW, 17, { fill: TEAL, r: 3 });
          let x = M; s.head.forEach((h, i) => { pdf.text(h, al[i] === 'right' ? x + cw[i] - 5 : x + 5, y + 11.5, { size: 7.5, bold: true, color: '#FFFFFF', align: al[i], maxWidth: cw[i] - 10 }); x += cw[i]; });
          y += 17;
        };
        ensure(40);
        pdf.text(s.title, M, y + 8, { size: 11, bold: true, color: INK }); y += 16;
        header();
        if (!s.rows.length) { pdf.text(s.empty || 'Sem registros.', M + 5, y + 12, { size: 8.5, color: GRAY }); y += 20; }
        s.rows.forEach((r, ri) => {
          if (y + 15 > BOTTOM) { newPage(false); header(); }
          if (ri % 2) pdf.rect(M, y, CW, 15, { fill: '#F7F9FA' });
          let x = M; r.forEach((c, i) => { pdf.text(c, al[i] === 'right' ? x + cw[i] - 5 : x + 5, y + 10.5, { size: 7.8, color: INK, align: al[i], maxWidth: cw[i] - 10 }); x += cw[i]; });
          y += 15;
        });
        if (s.foot) {
          ensure(18); pdf.line(M, y, M + CW, y, { color: TEAL, lw: 0.8 });
          let x = M; s.foot.forEach((c, i) => { if (c) pdf.text(c, al[i] === 'right' ? x + cw[i] - 5 : x + 5, y + 11, { size: 8, bold: true, color: INK, align: al[i], maxWidth: cw[i] - 10 }); x += cw[i]; });
          y += 16;
        }
        y += 14;
      } else if (s.type === 'notes') {
        ensure(24);
        pdf.text('Observações', M, y + 8, { size: 9.5, bold: true, color: INK }); y += 16;
        for (const it of s.items) {
          const lines = pdf.wrap(it, CW - 12, 8, false);
          ensure(lines.length * 11 + 2);
          pdf.text('•', M, y + 8, { size: 8, color: TEAL });
          lines.forEach(l => { pdf.text(l, M + 10, y + 8, { size: 8, color: GRAY }); y += 11; });
          y += 2;
        }
        y += 8;
      }
    }
    // rodapé com aviso e paginação
    const total = pdf.pages.length;
    const disc = pdf.wrap(DISCLAIMER, CW - 70, 6.8, false);
    pdf.pages.forEach((pg, i) => {
      pdf.cur = pg;
      pdf.line(M, H - 40, M + CW, H - 40, { color: LINE });
      disc.slice(0, 2).forEach((l, k) => pdf.text(l, M, H - 30 + k * 8.5, { size: 6.8, color: GRAY }));
      pdf.text(`Página ${i + 1} de ${total}`, M + CW, H - 30, { size: 7, color: GRAY, align: 'right' });
    });
    return pdf.output({ title: m.title + (m.subtitle ? ' - ' + m.subtitle : '') });
  }

  // ---------- Excel / CSV / JSON ----------
  function renderXlsx(m) {
    const resumo = [[{ v: m.title, bold: true }], [m.subtitle || ''], []];
    m.meta.forEach(kv => resumo.push([{ v: kv[0], bold: true }, kv[1]]));
    resumo.push([]);
    m.sections.filter(s => s.type === 'kpis').forEach(s => s.items.forEach(it => resumo.push([{ v: it.label, bold: true }, it.value, it.sub || ''])));
    resumo.push([]); resumo.push([DISCLAIMER]);
    const sheets = [{ name: 'Resumo', rows: resumo, colWidths: [34, 34, 28] }];
    const used = {};
    m.sections.filter(s => s.type === 'table' && s.raw).forEach(s => {
      let nm = s.title.replace(/\s*\(.*\)\s*$/, '').slice(0, 28); if (used[nm]) nm = nm.slice(0, 25) + ' ' + (++used[nm]); used[nm] = used[nm] || 1;
      sheets.push({ name: nm, freezeRow: 1, colWidths: s.rawHead.map(h => /Descri|Observ|Conta$|Motivo/.test(h) ? 36 : (h === 'ID' ? 30 : 15)), rows: [s.rawHead.map(h => ({ v: h, header: true }))].concat(s.raw) });
    });
    return X.buildXlsx(sheets, { title: m.title });
  }
  function renderCsv(m) {
    const s = m.sections.find(x => x.type === 'table' && x.primary && x.raw) || m.sections.find(x => x.type === 'table' && x.raw);
    if (!s) return X.buildCsv([[m.title]]);

/* Armazenamento local (IndexedDB). Tudo fica só neste aparelho. */
(function (root) {
  'use strict';
  const NAME = 'cofre-financeiro-familiar', VERSION = 1;
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((resolve, reject) => {
      const req = indexedDB.open(NAME, VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        if (!db.objectStoreNames.contains('backups')) db.createObjectStore('backups', { keyPath: 'id', autoIncrement: true });
        if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'id' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error('Banco de dados bloqueado por outra janela do app.'));
    });
    return dbp;
  }
  function tx(stores, mode, fn) {
    return open().then(db => new Promise((resolve, reject) => {
      const t = db.transaction(stores, mode);
      let result;
      t.oncomplete = () => resolve(result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error || new Error('Gravação cancelada.'));
      result = fn(t);
    }));
  }
  function reqP(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

  const DB = {
    async get(key) { let v; await tx(['kv'], 'readonly', t => { reqP(t.objectStore('kv').get(key)).then(x => { v = x; }); }); return v; },
    set(key, val) { return tx(['kv'], 'readwrite', t => { t.objectStore('kv').put(val, key); }); },
    // Grava dados + metadados numa única transação (tudo ou nada).
    saveState(data, meta) {
      return tx(['kv'], 'readwrite', t => { const s = t.objectStore('kv'); s.put(data, 'current'); s.put(meta, 'meta'); });
    },
    // Grava cópia automática + novo estado juntos (tudo ou nada).
    saveWithBackup(backup, data, meta, keep) {
      return tx(['kv', 'backups'], 'readwrite', t => {
        if (backup) t.objectStore('backups').add(backup);
        const s = t.objectStore('kv'); s.put(data, 'current'); s.put(meta, 'meta');
      }).then(() => DB.pruneBackups(keep || 20));
    },
    async listBackups() {
      let list = [];
      await tx(['backups'], 'readonly', t => {
        const r = t.objectStore('backups').openCursor(null, 'prev');
        r.onsuccess = () => { const c = r.result; if (c) { const v = c.value; list.push({ id: v.id, created_at: v.created_at, reason: v.reason, counts: v.counts, exported_at: v.exported_at }); c.continue(); } };

    },
    async getBackup(id) { let v; await tx(['backups'], 'readonly', t => { reqP(t.objectStore('backups').get(id)).then(x => { v = x; }); }); return v; },
    deleteBackup(id) { return tx(['backups'], 'readwrite', t => { t.objectStore('backups').delete(id); }); },

      const extra = list.slice(keep);
      if (extra.length) await tx(['backups'], 'readwrite', t => { extra.forEach(b => t.objectStore('backups').delete(b.id)); });
    },

    async getFile(id) { let v; await tx(['files'], 'readonly', t => { reqP(t.objectStore('files').get(id)).then(x => { v = x; }); }); return v; },
    async listFiles() { let v = []; await tx(['files'], 'readonly', t => { reqP(t.objectStore('files').getAll()).then(x => { v = x; }); }); return v; },
    deleteFile(id) { return tx(['files'], 'readwrite', t => { t.objectStore('files').delete(id); }); },

  // ---------- valores genéricos (nada fica escondido) ----------
  function fmtVal(v, key) {
    if (v === null || v === undefined) return '<span class="muted">não informado</span>';

      if (/(_brl|^amount|balance|^value)/.test(key || '')) return M(v, /_eur$/.test(key) ? 'EUR' : 'BRL');
      if (/_eur$/.test(key || '')) return M(v, 'EUR');

    if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(v)) return fdatetime(v);

  function renderValue(v, key, depth) {

  // ---------- toasts e folhas ----------

    t.innerHTML = `<span>${esc(msg)}</span>` + (actionLabel ? `<button>${esc(actionLabel)}</button>` : '');
    if (actionLabel) t.querySelector('button').onclick = () => { t.remove(); action(); };

  function openSheet(o) {
    const w = document.createElement('div'); w.className = 'sheet-wrap';

    const sheet = {
      el: w, body: w.querySelector('.sheet-body'), foot: w.querySelector('.sheet-foot'),
      close() { w.remove(); S.sheets = S.sheets.filter(s => s !== sheet); if (o.onClose) o.onClose(); }
    };
    w.addEventListener('click', e => {
      if (e.target === w && !o.sticky) sheet.close();
      if (e.target.closest('[data-close]')) sheet.close();
    });
    document.body.appendChild(w);
    S.sheets.push(sheet);
    if (o.body) sheet.body.innerHTML = o.body;
    if (o.footHtml && sheet.foot) sheet.foot.innerHTML = o.footHtml;

  function confirmDialog({ title, text, ok, danger, cancel, typeWord }) {
    return new Promise(resolve => {

        title, sticky: true,

        onClose: () => { if (!done) resolve(false); }
      });

      sh.foot.querySelector('[data-no]').onclick = () => sh.close();

        body: `${text ? `<div class="notice warn">${ic('alert')}<div class="ntext">${text}</div></div>` : ''}

  function logEvent(ds, type, description, extra) {

  function countsOf(ds) { const c = {}; for (const k of Object.keys(ds || {})) if (Array.isArray(ds[k])) c[k] = ds[k].length; return c; }

  async function commit(newDs, opts) {
    opts = opts || {};
    if (opts.audit) logEvent(newDs, opts.audit.type, opts.audit.description, opts.audit.extra);
    const meta = Object.assign({}, S.meta, opts.meta || {}, { last_modified_at: nowIso(), dirty: true });
    const backup = opts.backupReason && S.ds ? makeBackup(S.ds, opts.backupReason) : null;
    try { await DB.saveWithBackup(backup, newDs, meta); }
    catch (e) { showError('Não foi possível salvar', 'Nada foi alterado. Detalhe técnico: ' + esc(e && e.message)); throw e; }
    S.ds = newDs; S.meta = meta;
    render();
    if (opts.toast) toast(opts.toast, 'Exportar', () => go('mais', 'backup'));
  }

    rec.currency = isCreditId(d.account_id) ? 'BRL' : currencyForAccount(d.account_id);
    rec.status = d.status; rec.origin = d.origin || 'usuario';

    set('obligation_id', d.type === 'despesa' || d.type === 'pagamento_fatura' ? d.obligation_id : '');

    };
