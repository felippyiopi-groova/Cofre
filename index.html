        <li>Defina uma validade (ex.: 1 ano), gere e cole o token aqui.</li></ol></details>
      <div class="notice info">${ic('info')}<div class="ntext"><b>O que você precisa saber:</b> o token fica guardado <b>sem criptografia</b> neste aparelho (como o resto dos dados do app) e nunca vai dentro dos backups. Por isso ele deve dar acesso <b>só</b> ao repositório de backup. Comprovantes (imagens) não vão para o GitHub, só a lista deles: para eles, use o ZIP completo.</div></div>`;
    return h;
  }

  // ---------- restauração e integridade ----------
  async function restoreBackup(id) {
    const b = await DB.getBackup(Number(id));
    if (!b) return;
    if (!(await confirmDialog({ title: 'Restaurar esta cópia?', text: `Os dados voltarão ao estado de <b>${fdatetime(b.created_at)}</b> (${esc(b.reason || '')}).<br><br>Os dados atuais serão guardados antes numa nova cópia automática, então dá para desfazer.`, ok: 'Restaurar' }))) return;
    const ds2 = C.clone(b.data);
    await commit(ds2, { audit: { type: 'restore', description: `Restaurada cópia automática de ${fdatetime(b.created_at)} (${b.reason || ''})` }, backupReason: 'Antes de restaurar a cópia de ' + fdatetime(b.created_at), toast: 'Cópia restaurada' });
    fillBackups();
  }
  async function integrityCheck() {
    const out = [];
    const ok = (t) => out.push(['ok', t]), warn = (t) => out.push(['warn', t]), bad = (t) => out.push(['bad', t]);
    const ds = S.ds;
    const v = C.validate(ds);
    v.errors.length ? v.errors.forEach(bad) : ok('Estrutura dos dados válida, sem IDs repetidos.');
    v.warnings.forEach(warn);
    try {
      const stored = await DB.get('current');
      C.stable(stored) === C.stable(ds) ? ok('O que está gravado no aparelho é idêntico ao que aparece na tela.') : bad('Diferença entre a tela e o armazenamento. Feche e abra o app.');
    } catch (e) { bad('Não foi possível ler o armazenamento: ' + e.message); }
    const txIds = new Set((ds.transactions || []).map(t => t.id));
    (ds.obligations || []).forEach(o => { if (o.paid_transaction_id && !txIds.has(o.paid_transaction_id)) warn(`Conta “${obligationTitle(o)}” aponta para um lançamento que não existe (${o.paid_transaction_id}).`); });
    const oblIds = new Set((ds.obligations || []).map(o => o.id));
    (ds.transactions || []).forEach(t => { if (t.obligation_id && !oblIds.has(t.obligation_id)) warn(`Lançamento “${t.description || t.id}” aponta para conta a pagar inexistente.`); });
    const files = await DB.listFiles();
    const man = ds.attachments_manifest || [];
    const missing = man.filter(m => !files.find(f => f.id === m.id));
    missing.length ? warn(`${missing.length} comprovante(s) listados mas sem arquivo neste aparelho (restaure com o ZIP completo).`) : ok(`Comprovantes: ${man.length} listado(s), todos presentes.`);
    const bal = C.computeBalances(ds);
    ok(`Saldos recalculados para ${bal.length} contas (${bal.filter(b => b.unknown).length} com saldo desconhecido).`);
    const backups = await DB.listBackups();
    ok(`${backups.length} cópia(s) automática(s) no aparelho.`);
    S.meta.last_export_at ? (S.meta.dirty ? warn('Há alterações ainda não exportadas.') : ok('Último backup externo está em dia.')) : warn('Nenhum backup externo foi exportado ainda.');
    openSheet({
      title: 'Verificação de integridade',
      body: `<div class="card"><div class="rows">${out.map(([k, t]) => `<div class="row-item"><div class="ico" style="color:${k === 'ok' ? 'var(--pos)' : (k === 'warn' ? 'var(--warn)' : 'var(--danger)')}">${ic(k === 'ok' ? 'check' : 'alert')}</div><div class="main"><div class="t" style="white-space:normal;font-weight:500">${esc(t)}</div></div></div>`).join('')}</div></div>`,
      footHtml: '<button class="btn secondary" data-close>Fechar</button>'
    });
  }

  // ---------- PIN ----------
  async function pinHash(pin, saltB64, iter) {
    const salt = saltB64 ? C.b64.dec(saltB64) : crypto.getRandomValues(new Uint8Array(16));
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, 256);
    return { salt: C.b64.enc(salt), hash: C.b64.enc(new Uint8Array(bits)), iter };
  }
  function setPin() {
    const sh = openSheet({
      title: S.meta.pin ? 'Trocar PIN' : 'Criar PIN', sticky: true,
      body: `<div class="field"><label>Novo PIN (4 a 6 números)</label><input class="input big num" id="p1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"></div>
        <div class="field"><label>Repita o PIN</label><input class="input big num" id="p2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"></div>
        <div id="perr" class="small" style="color:var(--danger)"></div>
        <p class="help">Se esquecer o PIN, a única saída é apagar os dados do app e restaurar um backup exportado.</p>`,
      footHtml: '<button class="btn" data-ok>Salvar PIN</button>'
    });
    sh.foot.querySelector('[data-ok]').onclick = async () => {
      const a = sh.body.querySelector('#p1').value, b = sh.body.querySelector('#p2').value, e = sh.body.querySelector('#perr');
      if (!/^\d{4,6}$/.test(a)) { e.textContent = 'Use de 4 a 6 números.'; return; }
      if (a !== b) { e.textContent = 'Os PINs não são iguais.'; return; }
      const h = await pinHash(a, null, 150000); h.length = a.length;
      await saveMeta({ pin: h }); sh.close(); render(); toast('PIN ativado');
    };
  }
  async function removePin() {
    if (!(await confirmDialog({ title: 'Desativar PIN?', text: 'O app abrirá sem pedir PIN.', ok: 'Desativar', danger: true }))) return;
    const m = Object.assign({}, S.meta); delete m.pin; S.meta = m; await DB.set('meta', m); render(); toast('PIN desativado');
  }
  let pinBuf = '';
  function renderLock() {
    let el = document.querySelector('.lock');
    if (!el) { el = document.createElement('div'); el.className = 'lock'; document.body.appendChild(el); }
    const len = (S.meta.pin && S.meta.pin.length) || 4;
    el.innerHTML = `<div style="width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.12);display:grid;place-items:center">${ic('lock')}</div><h2>Cofre bloqueado</h2><div style="opacity:.75;font-size:14px">Digite seu PIN</div>
      <div class="pin-dots">${Array.from({ length: len }, (_, i) => `<span class="${i < pinBuf.length ? 'f' : ''}"></span>`).join('')}</div>
      <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<button class="blank" data-forgot style="font-size:13px">Esqueci</button><button data-k="0">0</button><button class="blank" data-k="del" aria-label="Apagar">⌫</button></div>`;
    el.querySelectorAll('[data-k]').forEach(b => b.onclick = async () => {
      const k = b.dataset.k;
      if (k === 'del') pinBuf = pinBuf.slice(0, -1); else if (pinBuf.length < len) pinBuf += k;
      if (pinBuf.length === len) {
        const p = S.meta.pin, h = await pinHash(pinBuf, p.salt, p.iter);
        if (h.hash === p.hash) { pinBuf = ''; S.locked = false; el.remove(); render(); return; }
        pinBuf = ''; renderLock(); const dots = document.querySelector('.pin-dots'); if (dots) dots.classList.add('shake'); return;
      }
      renderLock();
    });
    el.querySelector('[data-forgot]').onclick = () => {
      S.locked = false; el.remove();
      wipe(true).then(okd => { if (!okd) { S.locked = true; render(); } });
    };
  }
  async function wipe(fromLock) {
    const okd = await confirmDialog({ title: fromLock ? 'Esqueceu o PIN?' : 'Apagar tudo?', text: (fromLock ? 'Sem o PIN, a única opção é <b>apagar os dados deste aparelho</b> e depois importar seu último backup exportado.<br><br>' : '') + 'Isso apaga dados, cópias automáticas e comprovantes deste aparelho. <b>Não dá para desfazer.</b>', ok: 'Apagar tudo', danger: true, typeWord: 'APAGAR' });
    if (!okd) return false;
    await wipeLocal();
    toast('Dados apagados deste aparelho');
    return true;
  }
  // Apaga tudo deste aparelho (dados, cópias, comprovantes, chave da IA, login) e volta para a tela inicial.
  async function wipeLocal() {
    await syForget(); // antes de apagar: senão a próxima sincronização apagaria os dados também na nuvem
    const backups = await DB.listBackups();
    for (const b of backups) await DB.deleteBackup(b.id);
    await DB.clearFiles();

        <p class="help" style="margin-top:10px">PDF para guardar ou imprimir · Imagem para o WhatsApp · Excel e CSV para planilhas · JSON para o ChatGPT.</p>`;

  function readyDoc(res) {
    const url = URL.createObjectURL(res.blob);

    const sh = openSheet({ title: 'Documento pronto', full: res.format === 'png',
      body: `<div class="card"><b>${esc(m.title)}</b><div class="small muted">${esc(m.subtitle || '')}</div><div class="tiny muted" style="margin-top:4px">${esc(res.name)} · ${(res.blob.size / 1024).toFixed(0)} KB</div></div>
        ${res.format === 'png' ? `<img src="${url}" alt="Prévia da imagem" style="width:100%;border-radius:14px;box-shadow:var(--shadow)">` : ''}
        ${res.format === 'pdf' ? `<div class="notice info">${ic('info')}<div class="ntext">Toque em <b>Abrir</b> para ver o PDF, ou em <b>Salvar / compartilhar</b> para mandar para Arquivos, WhatsApp, e-mail ou impressão.</div></div>` : ''}
        <p class="tiny muted">${esc(Docs.DISCLAIMER)}</p>`,
      footHtml: `<button class="btn" data-save>${ic('down')} Salvar / compartilhar</button>${res.format === 'pdf' || res.format === 'png' ? '<button class="btn secondary" data-open>Abrir</button>' : ''}`,
      onClose: () => setTimeout(() => URL.revokeObjectURL(url), 60000) });
    sh.foot.querySelector('[data-save]').onclick = () => deliver(res.blob, res.name, () => toast('Documento salvo'));
    const op = sh.foot.querySelector('[data-open]'); if (op) op.onclick = () => { window.open(url, '_blank', 'noopener'); };

  // Links que chegam pelo endereço: convite (#convite=…) e retorno do e-mail (#access_token=…&type=recovery|signup).
  // Roda ao abrir o app e quando o endereço muda com o app já aberto. Tira o segredo da barra de endereço.
  async function handleLinkHash() {
      const hp = new URLSearchParams(location.hash.replace(/^#/, ''));
      if (hp.get('access_token') || hp.get('error_description') || hp.get('error')) {
        if (hp.get('type') === 'recovery' && hp.get('access_token')) S.syRecovery = { access_token: hp.get('access_token'), refresh_token: hp.get('refresh_token'), expires_in: +hp.get('expires_in') || 3600 };
        else if (hp.get('access_token')) S.syLinkMsg = { ok: true, text: 'E-mail confirmado! Agora entre com seu e-mail e senha.' };
        else S.syLinkMsg = { ok: false, text: 'Este link expirou ou já foi usado. Peça outro.' };
        history.replaceState(null, '', location.pathname + location.search);
        S.tab = 'mais'; S.page = 'sync'; S.syMode = 'login';
      }
      const conv = /[#&]convite=([A-Za-z0-9_-]{20,})/.exec(location.hash);
      if (conv) { // link de convite: guarda o segredo e tira da barra de endereço
        try { await DB.set('sync_invite', { token: conv[1], at: Date.now() }); } catch (e) { /* sem armazenamento */ }
        history.replaceState(null, '', location.pathname + location.search);
        S.syInvited = true; S.tab = 'mais'; S.page = 'sync';
      } else if (await syInviteToken()) S.syInvited = true;
  }
  window.addEventListener('hashchange', async () => { if (/access_token=|error=|convite=/.test(location.hash)) { await handleLinkHash(); render(); } });

  // ---------- atualização do app ----------
  // Procura versão nova ao abrir, ao voltar para o app e a cada 30 min. A versão nova instala sozinha
  // e a página recarrega num momento seguro: sem janela aberta, sem campo em edição e sem interromper o PIN.
  const SW_CHECK_MS = 10 * 60e3;
  let swReg = null, swPending = false, swReloading = false;
  function swSafe() {
    const a = document.activeElement;
    const typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
    return !S.sheets.length && !typing && (!S.meta.pin || S.locked || !S.ds);
  }
  function swApply() {
    if (swReloading) return;
    if (!swSafe()) { swPending = true; return; }
    swReloading = true;
    try { sessionStorage.setItem('cofre-updated', '1'); } catch (e) { /* sem armazenamento */ }
    location.reload();
  }
  function swCheck(force) {
    if (!swReg || !navigator.onLine) return Promise.resolve();
    if (!force && Date.now() - (S.swLastCheck || 0) < SW_CHECK_MS) return Promise.resolve();
    S.swLastCheck = Date.now();
    return swReg.update().catch(() => { /* sem internet: tenta depois */ });
  }
  function swVersion() {
    return new Promise(res => {
      const c = navigator.serviceWorker && navigator.serviceWorker.controller; if (!c) return res(null);
      const ch = new MessageChannel(); ch.port1.onmessage = e => res(e.data); c.postMessage('version', [ch.port2]);
      setTimeout(() => res(null), 1500);
    });
  }
  function swSetup() {
    if (!('serviceWorker' in navigator) || !(location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) return;
    // Na primeira instalação o service worker só passa a controlar a página: nada a recarregar.
    // Nas trocas seguintes (versão nova), recarrega num momento seguro.
    let controlled = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (controlled) swApply(); controlled = true; });
    navigator.serviceWorker.register('sw.js').then(reg => { swReg = reg; S.swLastCheck = Date.now(); }).catch(() => { /* sem service worker: app funciona, mas não offline */ });
    setInterval(() => { if (!document.hidden) swCheck(true); }, 30 * 60e3);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (swPending) swApply(); swCheck(false); } });
    window.addEventListener('online', () => swCheck(false));
    let updated = false; try { updated = sessionStorage.getItem('cofre-updated') === '1'; sessionStorage.removeItem('cofre-updated'); } catch (e) { /* ignora */ }
    if (updated) setTimeout(() => toast('App atualizado para a versão mais recente'), 600);
  }
  // Uma janela fechou ou um campo perdeu o foco: se havia versão nova esperando, aplica agora.
  document.addEventListener('focusout', () => { if (swPending) setTimeout(() => { if (swPending) swApply(); }, 400); });

  // ---------- inicialização ----------
  async function init() {
    try {
      S.ds = (await DB.get('current')) || null;
      S.meta = (await DB.get('meta')) || {};
    } catch (e) {
      app.innerHTML = `<div class="notice danger" style="margin-top:40px">${ic('alert')}<div class="ntext"><b>Não foi possível abrir o armazenamento local.</b> No iPhone, verifique se não está em navegação privada. Detalhe: ${esc(e.message)}</div></div>`;
      return;
    }
    if (S.meta.pin && S.ds) S.locked = true;
    await syLoad();
    await fxLoadCache(); // cotação do último download: funciona sem internet
    await iaLoad(); // chave da IA do leitor de comprovantes (só deste aparelho)
    await handleLinkHash();
    render();
    if (syReady()) { const va = SY.state.verified_at; if (!va || Date.now() - Date.parse(va) > 6 * 3600e3) syVerify(false); else syRun(false); }
    fxRefresh(false);
    try { if (navigator.storage && navigator.storage.persist) S.persisted = await navigator.storage.persist(); } catch (e) { /* sem suporte */ }
    await storageInfo();
    swSetup();
  }
  window.__cofre = { S, C }; // para depuração
  init();
})();

</script>
