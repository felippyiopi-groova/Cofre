<style>
:root {
  --bg: #F3F4F7;
  --card: #FFFFFF;
  --card-2: #F7F8FA;
  --ink: #0E1726;
  --ink-2: #4A5568;
  --ink-3: #8A94A6;
  --line: #E4E7EC;
  --accent: #0B6E69;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3F2F0;
  --hero-1: #0A2E3B;
  --hero-2: #0B6E69;
  --gold: #B7862A;
  --gold-soft: #FBF3E2;
  --neg: #C2412D;
  --pos: #12805C;
  --warn: #B45309;
  --warn-soft: #FEF3E2;
  --danger: #C0262D;
  --danger-soft: #FDECEC;
  --info-soft: #EAF1FB;
  --info: #1D5FBF;
  --verde: #16A34A; --amarelo: #CA8A04; --laranja: #EA580C; --vermelho: #DC2626;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(14, 23, 38, .06), 0 4px 16px rgba(14, 23, 38, .05);
  --tabbar-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0A0E13; --card: #141A22; --card-2: #1A212B; --ink: #E9EEF4; --ink-2: #B3BDCB; --ink-3: #7D8899;
    --line: #242D39; --accent: #2BB3A8; --accent-ink: #04201E; --accent-soft: #0F2E2C;
    --hero-1: #082029; --hero-2: #0B5753; --gold: #E2B357; --gold-soft: #2A2214;
    --neg: #F08A78; --pos: #4FD1A1; --warn: #F5B158; --warn-soft: #2B2112; --danger: #FF7B7B; --danger-soft: #2E1517;
    --info-soft: #132238; --info: #7DB2FF;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
body {
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
  min-height: 100vh; min-height: 100dvh;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num, .money { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
body.hide-values .money { filter: blur(7px); user-select: none; }

#app { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 8px) 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 24px); }
.page-title { font-size: 30px; font-weight: 750; letter-spacing: -0.02em; margin: 10px 0 14px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 12px; }
.topbar .hello { font-size: 14px; color: var(--ink-3); }
.topbar .name { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--card); box-shadow: var(--shadow); display: inline-grid; place-items: center; color: var(--ink-2); }
.icon-btn svg { width: 20px; height: 20px; }
.back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--accent); font-weight: 600; padding: 8px 0; font-size: 16px; }
.back svg { width: 20px; height: 20px; }

.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.card h3, .section-title { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 0 0 10px; }
.section-title { margin: 22px 4px 8px; display: flex; justify-content: space-between; align-items: baseline; }
.section-title a, .link { color: var(--accent); font-weight: 600; text-transform: none; letter-spacing: 0; font-size: 14px; background: none; border: 0; padding: 0; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }

.hero {
  background: linear-gradient(135deg, var(--hero-1), var(--hero-2)); color: #fff; border-radius: 22px; padding: 18px 18px 16px;
  box-shadow: 0 10px 30px rgba(11, 110, 105, .25); margin-bottom: 14px; position: relative; overflow: hidden;
}
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255, 255, 255, .06); }
.hero .label { font-size: 13px; opacity: .8; }
.hero .big { font-size: 36px; font-weight: 750; letter-spacing: -0.02em; margin: 2px 0 12px; }
.hero .row { display: flex; gap: 10px; }
.hero .pill { flex: 1; background: rgba(255, 255, 255, .1); border-radius: 14px; padding: 9px 11px; }
.hero .pill .k { font-size: 11.5px; opacity: .8; }
.hero .pill .v { font-size: 16px; font-weight: 650; }
.hero .foot { font-size: 11.5px; opacity: .7; margin-top: 10px; }

.light { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px 7px 9px; border-radius: 999px; border: 0; font-weight: 700; font-size: 13px; letter-spacing: .04em; color: #fff; }
.light::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #fff; opacity: .9; }
.light.VERDE { background: var(--verde); } .light.AMARELO { background: var(--amarelo); } .light.LARANJA { background: var(--laranja); } .light.VERMELHO { background: var(--vermelho); }
.light.none { background: var(--ink-3); }

.rows { list-style: none; margin: 0; padding: 0; }
.row-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.rows > :first-child .row-item, .rows > .row-item:first-child { border-top: 0; }
.row-item .ico { width: 40px; height: 40px; border-radius: 12px; background: var(--card-2); display: grid; place-items: center; font-size: 19px; flex: none; }
.row-item .main { flex: 1; min-width: 0; }
.row-item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-item .s { font-size: 13px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-item .amt { font-weight: 650; text-align: right; white-space: nowrap; }
.row-item .amt .s { text-align: right; }
.amt.neg { color: var(--ink); } .amt.pos { color: var(--pos); } .amt.forecast { color: var(--ink-3); font-style: italic; }
.chev { color: var(--ink-3); width: 18px; height: 18px; flex: none; }

.badge { display: inline-block; font-size: 11px; font-weight: 650; padding: 2px 7px; border-radius: 999px; background: var(--card-2); color: var(--ink-2); vertical-align: middle; letter-spacing: .01em; }
.badge.ok { background: var(--accent-soft); color: var(--accent); }
.badge.plan { background: var(--info-soft); color: var(--info); border: 1px dashed currentColor; }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.badge.gold { background: var(--gold-soft); color: var(--gold); }

.notice { border-radius: 14px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; display: flex; gap: 10px; align-items: flex-start; }
.notice svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.danger { background: var(--danger-soft); color: var(--danger); }
.notice.info { background: var(--info-soft); color: var(--info); }
.notice.ok { background: var(--accent-soft); color: var(--accent); }
.notice b { font-weight: 700; }
.notice .ntext { color: var(--ink); } .notice .ntext b { color: inherit; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 650; background: var(--accent); color: var(--accent-ink); width: 100%; font-size: 16px; }
.btn svg { width: 19px; height: 19px; }
.btn.secondary { background: var(--card-2); color: var(--ink); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { background: var(--danger); color: #fff; }
.btn:disabled { opacity: .45; }
.btn + .btn { margin-top: 10px; }
.btn-row { display: flex; gap: 10px; } .btn-row .btn + .btn { margin-top: 0; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--ink-2); border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }

.seg { display: flex; background: var(--card-2); border-radius: 12px; padding: 3px; margin-bottom: 14px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 10px; padding: 8px 6px; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.stat { background: var(--card); border-radius: 16px; padding: 13px; box-shadow: var(--shadow); }
.stat .k { font-size: 12.5px; color: var(--ink-3); }
.stat .v { font-size: 19px; font-weight: 700; margin-top: 2px; }
.stat .s { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.stat.gold .v { color: var(--gold); }

.progress { height: 8px; background: var(--card-2); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
.progress > div { height: 100%; background: var(--accent); border-radius: 999px; }

/* gráfico de barras */
.bars { display: flex; align-items: flex-end; gap: 10px; height: 140px; padding-top: 10px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bar { width: 100%; max-width: 44px; border-radius: 8px 8px 3px 3px; background: var(--accent); min-height: 3px; }
.bar.hist { background: repeating-linear-gradient(135deg, var(--ink-3) 0 4px, transparent 4px 8px); border: 1.5px solid var(--ink-3); }
.bar-col .bl { font-size: 11.5px; color: var(--ink-3); }
.bar-col .bv { font-size: 11px; font-weight: 650; }

/* calendário */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-head b { font-size: 17px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal .dow { font-size: 11.5px; color: var(--ink-3); font-weight: 600; padding: 4px 0; }
.cal .day { aspect-ratio: 1; border: 0; border-radius: 12px; background: transparent; font-size: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.cal .day.out { opacity: .25; }
.cal .day.today { outline: 2px solid var(--accent); }
.cal .day.sel { background: var(--ink); color: var(--bg); }
.dots { display: flex; gap: 3px; height: 5px; }
.dot { width: 5px; height: 5px; border-radius: 50%; }
.dot.due { background: var(--danger); } .dot.inc { background: var(--pos); } .dot.tx { background: var(--info); }

/* barra de abas */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
.tabbar nav { max-width: 640px; margin: 0 auto; display: flex; height: var(--tabbar-h); }
.tabbar button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; font-weight: 600; color: var(--ink-3); position: relative; }
.tabbar button svg { width: 23px; height: 23px; }
.tabbar button.on { color: var(--accent); }
.tabbar .pip { position: absolute; top: 9px; right: calc(50% - 17px); width: 8px; height: 8px; border-radius: 50%; background: var(--laranja); border: 2px solid var(--card); }

.fab { position: fixed; right: max(16px, calc(50% - 304px)); bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px); z-index: 19; width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 24px rgba(11, 110, 105, .35); display: grid; place-items: center; }
.fab svg { width: 26px; height: 26px; }

/* folhas (modais) */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; background: rgba(5, 10, 15, .45); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 94vh; max-height: 94dvh; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: up .24s cubic-bezier(.2, .8, .2, 1); }
.sheet.full { height: 94vh; height: 94dvh; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; gap: 10px; }
.sheet-head h2 { font-size: 18px; margin: 0; font-weight: 700; flex: 1; }
.sheet-body { overflow-y: auto; padding: 4px 16px 16px; -webkit-overflow-scrolling: touch; flex: 1; }
.sheet-foot { padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg); }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* formulários */
.field { margin-bottom: 12px; }
.field > label, .lbl { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 0 0 5px 2px; }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 13px; font-size: 16px; outline: none; -webkit-appearance: none; appearance: none; }
select.input { background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.big { font-size: 28px; font-weight: 700; text-align: center; padding: 14px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.help { font-size: 12.5px; color: var(--ink-3); margin: 4px 2px 0; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; margin: 1px 0 0; }
.radio-card { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; margin-bottom: 8px; background: var(--card); }
.radio-card input { accent-color: var(--accent); width: 20px; height: 20px; margin: 1px 0 0; flex: none; }

/* diferenças na importação */
.diff-item { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 10px; box-shadow: var(--shadow); }
.diff-item .hdr { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.diff-field { font-size: 13px; margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 8px; }
.diff-field .f { font-weight: 650; color: var(--ink-2); }
.old { color: var(--neg); text-decoration: line-through; word-break: break-word; }
.new { color: var(--pos); word-break: break-word; }
.pick { display: flex; gap: 6px; margin-top: 10px; }
.pick button { flex: 1; border: 1px solid var(--line); background: var(--card-2); border-radius: 10px; padding: 8px; font-size: 13px; font-weight: 650; color: var(--ink-2); }
.pick button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.kv { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; word-break: break-word; }
pre.raw { white-space: pre-wrap; word-break: break-word; font-size: 12px; background: var(--card-2); padding: 10px; border-radius: 10px; max-height: 260px; overflow: auto; }

/* PIN */
.lock { position: fixed; inset: 0; z-index: 100; background: linear-gradient(160deg, var(--hero-1), var(--hero-2)); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.lock h2 { margin: 14px 0 4px; font-size: 20px; }
.pin-dots { display: flex; gap: 14px; margin: 22px 0 28px; }
.pin-dots span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .8); }
.pin-dots span.f { background: #fff; }
.keypad { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px; }
.keypad button { height: 76px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .12); color: #fff; font-size: 28px; font-weight: 500; }
.keypad button.blank { background: transparent; }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 86px); z-index: 120; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); max-width: calc(100% - 32px); display: flex; gap: 12px; align-items: center; animation: up .2s ease; }
.toast button { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 0; }

.empty { text-align: center; padding: 30px 16px; color: var(--ink-3); }
.empty .e-ico { font-size: 34px; margin-bottom: 6px; }
details.fold > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 650; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "›"; font-size: 22px; color: var(--ink-3); transition: transform .2s; }
details.fold[open] > summary::after { transform: rotate(90deg); }
.welcome { text-align: center; padding: 30px 6px 10px; }
.welcome .logo { width: 84px; height: 84px; border-radius: 22px; margin: 0 auto 14px; display: block; box-shadow: 0 10px 30px rgba(11, 110, 105, .3); }
.welcome h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.02em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

@keyframes spin { to { transform: rotate(360deg); } }
/* ações rápidas estilo banco */
.quick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 0 0 14px; }
.quick button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); padding: 4px 0; }
.quick button span { width: 54px; height: 54px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--accent); }
.quick button span svg { width: 23px; height: 23px; }
[style*="grid-template-columns"] > .btn + .btn { margin-top: 0; }

/* Pergunte ao Cofre */
.bubble { max-width: 92%; padding: 11px 14px; border-radius: 18px; margin: 0 0 10px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
.bubble.user { margin-left: auto; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 6px; width: fit-content; }
.bubble.bot { background: var(--card); box-shadow: var(--shadow); border-bottom-left-radius: 6px; }
.bubble .kv { font-size: 13.5px; }
.ans-title { font-weight: 700; font-size: 15px; }
.ans-total { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin-top: 4px; }
.askbar { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); z-index: 21; display: flex; gap: 8px; padding: 10px 12px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); max-width: 640px; margin: 0 auto; }
.askbar .input { flex: 1; padding: 11px 13px; }
.askbar .btn { width: 48px; padding: 0; flex: none; }

    emprestimo: 'emprestimo', emprestimo_recebido: 'emprestimo', loan: 'emprestimo'

  // 5. Despesas por categoria
  function categories(ds, start, end, label) {

    const txs = R.filterTx(ds, { start, end }).filter(t => C.txType(t) === 'despesa' && C.txStatus(t) === 'confirmado').sort((a, b) => C.num(b.amount) - C.num(a.amount));
    const total = C.round2(cat.histTotal + cat.afterTotal);
    const lbl = label || `${fd(start)} a ${fd(end)}`;
    const m = baseModel('categorias', 'Relatório de Despesas por Categoria', lbl, [['Período', lbl]]);
    m.sections.push({ type: 'kpis', items: [{ label: 'Total de despesas', value: money(total) }, { label: 'Lançamentos confirmados', value: money(cat.afterTotal), sub: txs.length + ' lançamento(s)' }, { label: 'Resumo histórico', value: cat.histTotal ? money(cat.histTotal) : '—', sub: 'até a data de corte' }] });
    if (cat.rows.length) m.sections.push({ type: 'bars', title: 'Distribuição', items: cat.rows.map(r => ({ label: r.cat, value: r.total, display: money(r.total) + (total ? ` · ${Math.round(r.total / total * 100)}%` : '') })) });

      rows: cat.rows.map(r => [r.cat, r.hist ? money(r.hist) : '—', r.after ? money(r.after) : '—', money(r.total), total ? Math.round(r.total / total * 100) + '%' : '—']), foot: ['Total', money(cat.histTotal), money(cat.afterTotal), money(total), '100%'], empty: 'Nenhuma despesa no período.',
      raw: cat.rows.map(r => [r.cat, { v: r.hist, t: 'money' }, { v: r.after, t: 'money' }, { v: r.total, t: 'money' }, { v: total ? Math.round(r.total / total * 1000) / 10 : 0, t: 'n' }]), rawHead: ['Categoria', 'Até o corte (resumo)', 'Lançamentos', 'Total', '%'] });
    if (txs.length) m.sections.push({ type: 'table', title: 'Maiores despesas lançadas', head: ['Data', 'Descrição', 'Categoria', 'Valor'], widths: [14, 46, 20, 20], align: ['left', 'left', 'left', 'right'], rows: txs.slice(0, 12).map(t => [fd(t.date), t.description || '—', C.categoryGroup(t.category), money(C.num(t.amount), t.currency)]),
      raw: txs.map(t => [{ v: C.dateOnly(t.date), t: 'date' }, t.description || '', C.categoryGroup(t.category), { v: C.num(t.amount), t: 'money' }]), rawHead: ['Data', 'Descrição', 'Categoria', 'Valor'] });
    m.sections.push({ type: 'notes', items: cat.notes.concat(['Transferências entre contas e pagamentos de fatura não são despesas e ficam de fora. Compras no crédito entram como despesa na data da compra.']) });
    m.formats = ['pdf', 'png', 'xlsx', 'csv']; m.file = 'despesas_por_categoria_' + start.replace(/^0000.*/, 'inicio') + '_' + end.replace(/^9999.*/, 'hoje');
    return m;
  }

  // ---------- PDF ----------
  const TEAL = '#0B6E69', INK = '#14202E', GRAY = '#6B7686', LIGHT = '#F2F5F7', LINE = '#DDE3E8';
  function renderPdf(m) {
    const pdf = new P.PDF(); const W = pdf.W, H = pdf.H, M = 36, CW = W - 2 * M, BOTTOM = H - 46;
    let y;
    const newPage = (first) => {
      pdf.addPage();
      if (first) {
        pdf.rect(M, M, CW, 74, { fill: TEAL, r: 10 });
        pdf.text(m.title, M + 16, M + 30, { size: 18, bold: true, color: '#FFFFFF', maxWidth: CW - 170 });
        if (m.subtitle) pdf.text(m.subtitle, M + 16, M + 50, { size: 10.5, color: '#D7F0EE', maxWidth: CW - 170 });
        pdf.text('REGISTRO PESSOAL', M + CW - 14, M + 28, { size: 8, bold: true, color: '#FFFFFF', align: 'right' });
        pdf.text('não é documento bancário', M + CW - 14, M + 40, { size: 7.5, color: '#D7F0EE', align: 'right' });
        pdf.text('Cofre Financeiro Familiar', M + CW - 14, M + 60, { size: 7.5, color: '#D7F0EE', align: 'right' });
        y = M + 92;
        const half = CW / 2;
        m.meta.forEach((kv, i) => {
          const col = i % 2, x = M + col * half;
          if (col === 0 && i) y += 15;
          pdf.text(kv[0], x, y, { size: 7.5, color: GRAY });
          pdf.text(kv[1], x + 92, y, { size: 8.5, bold: true, color: INK, maxWidth: half - 100 });
        });
        y += 20;
      } else {
        pdf.text(m.title, M, M + 10, { size: 9, bold: true, color: TEAL });
        pdf.text(m.subtitle || '', M + CW, M + 10, { size: 8, color: GRAY, align: 'right' });
        pdf.line(M, M + 16, M + CW, M + 16, { color: LINE });
        y = M + 32;
      }
    };
    const ensure = h => { if (y + h > BOTTOM) newPage(false); };
    newPage(true);
    for (const s of m.sections) {
      if (s.type === 'kpis') {
        const n = Math.min(4, s.items.length), gap = 8, w = (CW - gap * (n - 1)) / n;
        for (let i = 0; i < s.items.length; i += n) {
          ensure(58);
          s.items.slice(i, i + n).forEach((it, j) => {
            const x = M + j * (w + gap);
            pdf.rect(x, y, w, 50, { fill: LIGHT, r: 6 });
            pdf.text(it.label, x + 9, y + 15, { size: 7.5, color: GRAY, maxWidth: w - 18 });
            const long = pdf.width(it.value, 12.5, true) > w - 18;
            pdf.text(it.value, x + 9, y + 32, { size: long ? 9 : 12.5, bold: true, color: it.value.startsWith('Saldo histórico') ? '#A15C07' : INK, maxWidth: w - 18 });
            if (it.sub) pdf.text(it.sub, x + 9, y + 44, { size: 6.8, color: GRAY, maxWidth: w - 18 });
          });
          y += 58;
        }
        y += 6;
      } else if (s.type === 'bars') {
        ensure(30 + Math.min(s.items.length, 3) * 16);
        pdf.text(s.title, M, y + 8, { size: 11, bold: true, color: INK }); y += 20;
        const max = Math.max(...s.items.map(i => i.value), 1), lw = 150, vw = 110, bw = CW - lw - vw - 10;
        for (const it of s.items) {
          ensure(16);
          pdf.text(it.label, M, y + 9, { size: 8.5, color: INK, maxWidth: lw - 6 });
          pdf.rect(M + lw, y + 1, bw, 10, { fill: LIGHT, r: 3 });
          if (it.value > 0) pdf.rect(M + lw, y + 1, Math.max(3, bw * it.value / max), 10, { fill: TEAL, r: 3 });
          pdf.text(it.display, M + CW, y + 9, { size: 8.5, bold: true, color: INK, align: 'right' });
          y += 16;
        }
        if (s.total) { pdf.text('Total: ' + s.total, M + CW, y + 9, { size: 8.5, bold: true, color: TEAL, align: 'right' }); y += 14; }
        y += 10;
      } else if (s.type === 'table') {
        const ws = s.widths || s.head.map(() => 1), sum = ws.reduce((a, b) => a + b, 0);
        const cw = ws.map(w => CW * w / sum);
        const al = s.align || s.head.map((h, i) => (/Valor|Saldo|Total|Limite|Utilizado|Disponível|%|Lançamentos|corte/.test(h) && i > 0) ? 'right' : 'left');
        const header = () => {
          pdf.rect(M, y, CW, 17, { fill: TEAL, r: 3 });
          let x = M; s.head.forEach((h, i) => { pdf.text(h, al[i] === 'right' ? x + cw[i] - 5 : x + 5, y + 11.5, { size: 7.5, bold: true, color: '#FFFFFF', align: al[i], maxWidth: cw[i] - 10 }); x += cw[i]; });
          y += 17;
        };
        ensure(40);
        pdf.text(s.title, M, y + 8, { size: 11, bold: true, color: INK }); y += 16;
        header();
        if (!s.rows.length) { pdf.text(s.empty || 'Sem registros.', M + 5, y + 12, { size: 8.5, color: GRAY }); y += 20; }
        s.rows.forEach((r, ri) => {
          if (y + 15 > BOTTOM) { newPage(false); header(); }
          if (ri % 2) pdf.rect(M, y, CW, 15, { fill: '#F7F9FA' });
          let x = M; r.forEach((c, i) => { pdf.text(c, al[i] === 'right' ? x + cw[i] - 5 : x + 5, y + 10.5, { size: 7.8, color: INK, align: al[i], maxWidth: cw[i] - 10 }); x += cw[i]; });
          y += 15;
        });
        if (s.foot) {
          ensure(18); pdf.line(M, y, M + CW, y, { color: TEAL, lw: 0.8 });
          let x = M; s.foot.forEach((c, i) => { if (c) pdf.text(c, al[i] === 'right' ? x + cw[i] - 5 : x + 5, y + 11, { size: 8, bold: true, color: INK, align: al[i], maxWidth: cw[i] - 10 }); x += cw[i]; });
          y += 16;
        }
        y += 14;
      } else if (s.type === 'notes') {
        ensure(24);
        pdf.text('Observações', M, y + 8, { size: 9.5, bold: true, color: INK }); y += 16;
        for (const it of s.items) {
          const lines = pdf.wrap(it, CW - 12, 8, false);
          ensure(lines.length * 11 + 2);
          pdf.text('•', M, y + 8, { size: 8, color: TEAL });
          lines.forEach(l => { pdf.text(l, M + 10, y + 8, { size: 8, color: GRAY }); y += 11; });
          y += 2;
        }
        y += 8;
      }
    }
    // rodapé com aviso e paginação
    const total = pdf.pages.length;
    const disc = pdf.wrap(DISCLAIMER, CW - 70, 6.8, false);
    pdf.pages.forEach((pg, i) => {
      pdf.cur = pg;
      pdf.line(M, H - 40, M + CW, H - 40, { color: LINE });
      disc.slice(0, 2).forEach((l, k) => pdf.text(l, M, H - 30 + k * 8.5, { size: 6.8, color: GRAY }));
      pdf.text(`Página ${i + 1} de ${total}`, M + CW, H - 30, { size: 7, color: GRAY, align: 'right' });
    });
    return pdf.output({ title: m.title + (m.subtitle ? ' - ' + m.subtitle : '') });
  }

  // ---------- Excel / CSV / JSON ----------
  function renderXlsx(m) {
    const resumo = [[{ v: m.title, bold: true }], [m.subtitle || ''], []];
    m.meta.forEach(kv => resumo.push([{ v: kv[0], bold: true }, kv[1]]));
    resumo.push([]);
    m.sections.filter(s => s.type === 'kpis').forEach(s => s.items.forEach(it => resumo.push([{ v: it.label, bold: true }, it.value, it.sub || ''])));
    resumo.push([]); resumo.push([DISCLAIMER]);
    const sheets = [{ name: 'Resumo', rows: resumo, colWidths: [34, 34, 28] }];
    const used = {};
    m.sections.filter(s => s.type === 'table' && s.raw).forEach(s => {
      let nm = s.title.replace(/\s*\(.*\)\s*$/, '').slice(0, 28); if (used[nm]) nm = nm.slice(0, 25) + ' ' + (++used[nm]); used[nm] = used[nm] || 1;
      sheets.push({ name: nm, freezeRow: 1, colWidths: s.rawHead.map(h => /Descri|Observ|Conta$|Motivo/.test(h) ? 36 : (h === 'ID' ? 30 : 15)), rows: [s.rawHead.map(h => ({ v: h, header: true }))].concat(s.raw) });
    });
    return X.buildXlsx(sheets, { title: m.title });
  }
  function renderCsv(m) {
    const s = m.sections.find(x => x.type === 'table' && x.primary && x.raw) || m.sections.find(x => x.type === 'table' && x.raw);
    if (!s) return X.buildCsv([[m.title]]);
    return X.buildCsv([s.rawHead].concat(s.raw));
  }
  function renderJson(m) { return JSON.stringify(m.json || { documento: m.title, aviso: DISCLAIMER, gerado_em: m.generatedAt, secoes: m.sections }, null, 2); }

  // ---------- PNG (navegador) ----------
  function renderPng(m) {
    const Wd = 1080, PAD = 56, CW = Wd - PAD * 2;
    const font = (w, s) => `${w} ${s}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif`;
    const draw = (ctx, real) => {
      let y = 0;
      const rr = (x, yy, w, h, r, fill) => { if (!real) return; ctx.beginPath(); ctx.moveTo(x + r, yy); ctx.arcTo(x + w, yy, x + w, yy + h, r); ctx.arcTo(x + w, yy + h, x, yy + h, r); ctx.arcTo(x, yy + h, x, yy, r); ctx.arcTo(x, yy, x + w, yy, r); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); };
      const tx = (s, x, yy, f, color, align, max) => { if (!real) return; ctx.font = f; ctx.fillStyle = color; ctx.textAlign = align || 'left'; let t = String(s); if (max) while (t.length > 1 && ctx.measureText(t).width > max) t = t.slice(0, -2) + '…'; ctx.fillText(t, x, yy); };
      if (real) { ctx.fillStyle = '#EEF2F4'; ctx.fillRect(0, 0, Wd, ctx.canvas.height); }
      // cabeçalho
      if (real) { const g = ctx.createLinearGradient(0, 0, Wd, 360); g.addColorStop(0, '#0A2E3B'); g.addColorStop(1, '#0B6E69'); ctx.fillStyle = g; ctx.fillRect(0, 0, Wd, 330); }
      tx('COFRE FINANCEIRO FAMILIAR', PAD, 86, font(700, 24), 'rgba(255,255,255,.75)');
      tx(m.title, PAD, 150, font(800, 54), '#FFFFFF', 'left', CW);
      tx(m.subtitle || '', PAD, 206, font(500, 32), 'rgba(255,255,255,.85)', 'left', CW);
      if (m.traffic) {
        const colors = { VERDE: '#16A34A', AMARELO: '#CA8A04', LARANJA: '#EA580C', VERMELHO: '#DC2626' };
        ctx.font = font(700, 26); const pw = ctx.measureText('Semáforo ' + m.traffic).width + 84;
        rr(PAD, 236, pw, 56, 28, colors[m.traffic] || '#888');
        if (real) { ctx.beginPath(); ctx.arc(PAD + 32, 264, 9, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); }
        tx('Semáforo ' + m.traffic, PAD + 54, 274, font(700, 26), '#FFFFFF');
      }
      y = 370;
      for (const s of m.sections) {
        if (s.type === 'kpis') {
          const cols = 2, gap = 20, w = (CW - gap) / cols, h = 150;
          s.items.forEach((it, i) => {
            const x = PAD + (i % cols) * (w + gap), yy = y + Math.floor(i / cols) * (h + gap);
            rr(x, yy, w, h, 28, '#FFFFFF');
            tx(it.label, x + 30, yy + 50, font(600, 26), '#6B7686', 'left', w - 60);
            const big = it.value.length > 16 ? 34 : 46;
            tx(it.value, x + 30, yy + 108, font(800, big), it.tone === 'accent' ? '#0B6E69' : '#14202E', 'left', w - 60);
            if (it.sub) tx(it.sub, x + 30, yy + 136, font(500, 21), '#8A94A6', 'left', w - 60);
          });
          y += Math.ceil(s.items.length / cols) * (h + gap) + 10;
        } else if (s.type === 'bars') {
          const items = s.items.slice(0, 8), h = 110 + items.length * 74 + (s.total ? 50 : 0);
          rr(PAD, y, CW, h, 28, '#FFFFFF');
          tx(s.title, PAD + 34, y + 64, font(750, 32), '#14202E', 'left', CW - 68);
          const max = Math.max(...items.map(i => i.value), 1);
          items.forEach((it, i) => {
            const yy = y + 110 + i * 74;
            tx(it.label, PAD + 34, yy + 4, font(600, 26), '#14202E', 'left', CW * 0.55);
            tx(it.display, PAD + CW - 34, yy + 4, font(750, 26), '#14202E', 'right');
            rr(PAD + 34, yy + 20, CW - 68, 18, 9, '#E8EEF1');
            rr(PAD + 34, yy + 20, Math.max(18, (CW - 68) * it.value / max), 18, 9, '#0B6E69');
          });
          if (s.total) tx('Total ' + s.total, PAD + CW - 34, y + h - 34, font(800, 28), '#0B6E69', 'right');
          y += h + 24;
        } else if (s.type === 'table') {
          const rows = s.rows.slice(0, 7), h = 110 + Math.max(1, rows.length) * 78;
          rr(PAD, y, CW, h, 28, '#FFFFFF');
          tx(s.title.replace(/\s*\(\d+\)$/, ''), PAD + 34, y + 64, font(750, 32), '#14202E', 'left', CW - 68);
          if (!rows.length) tx(s.empty || 'Sem registros.', PAD + 34, y + 130, font(500, 26), '#8A94A6');
          rows.forEach((r, i) => {
            const yy = y + 110 + i * 78;

    enc(u8) { u8 = u8 instanceof Uint8Array ? u8 : new Uint8Array(u8); let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); },
    dec(str) { const s = atob(str); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  };
  const hex = buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  const sha256 = async data => new Uint8Array(await subtle.digest('SHA-256', typeof data === 'string' ? enc.encode(data) : data));
  const EC = { name: 'ECDH', namedCurve: 'P-256' }, SIG = { name: 'ECDSA', namedCurve: 'P-256' };

  async function hkdfKey(raw, info, alg, usages) {
    const base = await subtle.importKey('raw', raw, 'HKDF', false, ['deriveKey']);
    return subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(32), info: enc.encode(info) }, base, alg, false, usages);
  }
  const AES = { name: 'AES-GCM', length: 256 };
  async function aesEncrypt(key, bytes, aad) {
    const iv = rnd(12);
    const ct = await subtle.encrypt(Object.assign({ name: 'AES-GCM', iv }, aad ? { additionalData: enc.encode(aad) } : {}), key, bytes);
    return { iv: b64.enc(iv), ct: b64.enc(new Uint8Array(ct)) };
  }
  async function aesDecrypt(key, box, aad) {
    const pt = await subtle.decrypt(Object.assign({ name: 'AES-GCM', iv: b64.dec(box.iv) }, aad ? { additionalData: enc.encode(aad) } : {}), key, b64.dec(box.ct));
    return new Uint8Array(pt);
  }

  // ---------- senha ----------
  // Sal fixo por e-mail (o login precisa dele antes de baixar qualquer coisa). 600 mil iterações.
  async function fromPassword(email, password, iterations) {
    const salt = await sha256('cofre-v1|' + String(email).trim().toLowerCase());
    const base = await subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iterations || PBKDF2_ITER }, base, 512));
    const authSecret = 'cv1.' + b64.enc(await sha256(bits.slice(0, 32))); // vai ao servidor no lugar da senha
    const kek = await subtle.importKey('raw', bits.slice(32), AES, false, ['encrypt', 'decrypt']);
    return { authSecret, kek, kdf: { alg: 'PBKDF2-SHA256', iterations: iterations || PBKDF2_ITER, salt: 'sha256(cofre-v1|email)' } };
  }

  const PREFIXO = new Map(PALAVRAS.map((p, i) => [p.slice(0, 4), i]));
  function newRecoveryWords() {
    const r = (root && root.crypto ? root.crypto : crypto).getRandomValues(new Uint16Array(12)); // 65536 é múltiplo de 2048: sem viés
    return Array.from(r, n => PALAVRAS[n & 2047]);
  }
  // Normaliza o que a pessoa digitou: minúsculas, sem acento, separa por espaço/vírgula/número.
  function parseWords(text) {
    const parts = String(text).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().split(/[^a-z]+/).filter(Boolean);
    if (parts.length !== 12) return { error: parts.length ? `Digite as 12 palavras (você digitou ${parts.length}).` : 'Digite as 12 palavras.' };
    const out = [], bad = [];
    for (const p of parts) { const i = PREFIXO.get(p.slice(0, 4)); if (i === undefined || p.length < 4 && PALAVRAS[i] !== p) bad.push(p); else out.push(PALAVRAS[i]); }
    if (bad.length) return { error: `Não reconheci: ${bad.join(', ')}. Confira a grafia.` };
    return { words: out };
  }
  // ---------- formato antigo da chave (52 caracteres em base32), aceito por compatibilidade ----------
  const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
  function newRecoveryCode() {
    const bytes = rnd(32); let bits = '', out = '';
    for (const b of bytes) bits += b.toString(2).padStart(8, '0');
    bits = bits.padEnd(Math.ceil(bits.length / 5) * 5, '0');
    for (let i = 0; i < bits.length; i += 5) out += B32[parseInt(bits.slice(i, i + 5), 2)];
    return out.match(/.{1,4}/g).join('-'); // 52 caracteres em 13 grupos
  }
  function recoveryBytes(code) {
    const s = String(code).toUpperCase().replace(/[\s-]/g, '').replace(/O/g, '0').replace(/[IL]/g, '1');
    if (s.length !== 52 || /[^0-9A-HJKMNP-TV-Z]/.test(s)) return null;
    let bits = ''; for (const ch of s) bits += B32.indexOf(ch).toString(2).padStart(5, '0');
    const out = new Uint8Array(32); for (let i = 0; i < 32; i++) out[i] = parseInt(bits.slice(i * 8, i * 8 + 8), 2);
    return out;
  }
  async function recoveryKek(input) {
    const old = recoveryBytes(input);
    if (old) return hkdfKey(old, 'cofre-recuperacao', AES, ['encrypt', 'decrypt']);
    const p = Array.isArray(input) ? { words: input } : parseWords(input);
    if (p.error) throw Object.assign(new Error(p.error), { friendly: true });
    return hkdfKey(await sha256('cofre-palavras|' + p.words.join(' ')), 'cofre-recuperacao', AES, ['encrypt', 'decrypt']);
  }

  // ---------- chaves da pessoa ----------
  async function newUserKeys() {
    return { enc: await subtle.generateKey(EC, true, ['deriveBits']), sign: await subtle.generateKey(SIG, true, ['sign', 'verify']) };
  }
  async function publicKeys(keys) {
    return { enc_public_key: JSON.stringify(await subtle.exportKey('jwk', keys.enc.publicKey)), sign_public_key: JSON.stringify(await subtle.exportKey('jwk', keys.sign.publicKey)) };
  }
  // Tranca as chaves privadas com uma chave (da senha ou da recuperação).
  async function lockPrivate(keys, kek) {
    const json = JSON.stringify({ v: 1, enc: await subtle.exportKey('jwk', keys.enc.privateKey), sign: await subtle.exportKey('jwk', keys.sign.privateKey) });
    return JSON.stringify(Object.assign({ v: 1 }, await aesEncrypt(kek, enc.encode(json), 'cofre-chaves-privadas')));
  }
  // Destranca. extractable=false para uso normal (o navegador não deixa exportar a chave depois).
  async function unlockPrivate(locked, kek, extractable) {
    let pt;
    try { pt = await aesDecrypt(kek, JSON.parse(locked), 'cofre-chaves-privadas'); }
    catch (e) { throw Object.assign(new Error('Senha ou chave de recuperação incorreta.'), { friendly: true }); }
    const j = JSON.parse(dec.decode(pt));
    return {
      encPrivate: await subtle.importKey('jwk', j.enc, EC, !!extractable, ['deriveBits']),
      signPrivate: await subtle.importKey('jwk', j.sign, SIG, !!extractable, ['sign'])
    };
  }
  // Recria o par completo a partir das privadas exportáveis (para retrancar com senha nova).
  async function relock(locked, oldKek, newKek) {
    const p = await unlockPrivate(locked, oldKek, true);
    const json = JSON.stringify({ v: 1, enc: await subtle.exportKey('jwk', p.encPrivate), sign: await subtle.exportKey('jwk', p.signPrivate) });
    return JSON.stringify(Object.assign({ v: 1 }, await aesEncrypt(newKek, enc.encode(json), 'cofre-chaves-privadas')));
  }

  // ---------- chave do cofre ----------
  const newVaultSecret = () => rnd(32);
  async function vaultKeys(secret) {
    return {
      data: await hkdfKey(secret, 'cofre-dados', AES, ['encrypt', 'decrypt']),
      rid: await hkdfKey(secret, 'cofre-rid', { name: 'HMAC', hash: 'SHA-256', length: 256 }, ['sign'])
    };
  }
  // Tranca a chave do cofre para um membro, usando só a chave PÚBLICA dele.
  async function lockForMember(secret, memberEncPublic, vaultId) {
    const pub = await subtle.importKey('jwk', JSON.parse(memberEncPublic), EC, false, []);
    const eph = await subtle.generateKey(EC, true, ['deriveBits']);
    const shared = new Uint8Array(await subtle.deriveBits({ name: 'ECDH', public: pub }, eph.privateKey, 256));
    const k = await hkdfKey(shared, 'cofre-chave-membro|' + vaultId, AES, ['encrypt']);
    const box = await aesEncrypt(k, secret, 'cofre-chave-do-cofre|' + vaultId);
    return JSON.stringify({ v: 1, epk: await subtle.exportKey('jwk', eph.publicKey), iv: box.iv, ct: box.ct });
  }
  async function unlockVaultSecret(locked, myEncPrivate, vaultId) {
    try {

    const cls = n === 'confirmado' || n === 'pago' ? 'ok' : (n === 'pendente' ? 'warn' : (/planejad|estimad|previst|provis/.test(n) ? 'plan' : ''));
    return `<span class="badge ${cls}">${esc(STATUS_LABEL[n] || humanize(st || 'sem status'))}</span>`;
  }

  // ---------- valores genéricos (nada fica escondido) ----------
  function fmtVal(v, key) {
    if (v === null || v === undefined) return '<span class="muted">não informado</span>';
    if (typeof v === 'boolean') return v ? 'Sim' : 'Não';
    if (typeof v === 'number') {
      if (/(_brl|^amount|balance|^value)/.test(key || '')) return M(v, /_eur$/.test(key) ? 'EUR' : 'BRL');
      if (/_eur$/.test(key || '')) return M(v, 'EUR');
      return esc(v.toLocaleString('pt-BR'));
    }
    if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) return fdate(v);
    if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(v)) return fdatetime(v);
    if (key === 'account_id' || key === 'to_account_id') return esc(accountName(v));
    return esc(v);
  }
  function renderValue(v, key, depth) {
    depth = depth || 0;
    if (Array.isArray(v)) {
      if (!v.length) return '<span class="muted">(vazio)</span>';
      if (v.every(x => typeof x !== 'object' || x === null)) return '<ul style="margin:0;padding-left:18px">' + v.map(x => `<li>${fmtVal(x)}</li>`).join('') + '</ul>';
      return v.map(x => `<div class="diff-item" style="box-shadow:none;border:1px solid var(--line)">${renderValue(x, key, depth + 1)}</div>`).join('');
    }
    if (v && typeof v === 'object') {
      return '<dl class="kv">' + Object.keys(v).map(k => `<dt>${esc(KEYL[k] || humanize(k))}</dt><dd>${typeof v[k] === 'object' && v[k] !== null ? renderValue(v[k], k, depth + 1) : fmtVal(v[k], k)}</dd>`).join('') + '</dl>';
    }
    return fmtVal(v, key);
  }

  // ---------- toasts e folhas ----------
  let toastTimer;
  function toast(msg, actionLabel, action, ms) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
    t.innerHTML = `<span>${esc(msg)}</span>` + (actionLabel ? `<button>${esc(actionLabel)}</button>` : '');
    if (actionLabel) t.querySelector('button').onclick = () => { t.remove(); action(); };
    document.body.appendChild(t);
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), ms || (actionLabel ? 5000 : 3000));
  }
  function openSheet(o) {
    const w = document.createElement('div'); w.className = 'sheet-wrap';
    w.innerHTML = `<div class="sheet ${o.full ? 'full' : ''}" role="dialog" aria-modal="true" aria-label="${esc(o.title)}">
      <div class="grabber"></div>
      <div class="sheet-head"><h2>${esc(o.title)}</h2><button class="icon-btn" data-close aria-label="Fechar">${ic('x')}</button></div>
      <div class="sheet-body"></div>${o.foot !== false ? '<div class="sheet-foot"></div>' : ''}</div>`;
    const sheet = {
      el: w, body: w.querySelector('.sheet-body'), foot: w.querySelector('.sheet-foot'),
      close() { w.remove(); S.sheets = S.sheets.filter(s => s !== sheet); if (o.onClose) o.onClose(); if (swPending) setTimeout(() => { if (swPending) swApply(); }, 400); }
    };
    w.addEventListener('click', e => {
      if (e.target === w && !o.sticky) sheet.close();
      if (e.target.closest('[data-close]')) sheet.close();
    });
    document.body.appendChild(w);
    S.sheets.push(sheet);
    if (o.body) sheet.body.innerHTML = o.body;
    if (o.footHtml && sheet.foot) sheet.foot.innerHTML = o.footHtml;
    return sheet;
  }
  function confirmDialog({ title, text, ok, danger, cancel, typeWord }) {
    return new Promise(resolve => {
      let done = false;
      const sh = openSheet({
        title, sticky: true,
        body: `<div style="padding:4px 2px 8px">${text}</div>` + (typeWord ? `<div class="field"><label>Para confirmar, digite <b>${esc(typeWord)}</b></label><input class="input" id="cw" autocomplete="off" autocapitalize="characters"></div>` : ''),
        footHtml: `<div class="btn-row"><button class="btn secondary" data-no>${esc(cancel || 'Cancelar')}</button><button class="btn ${danger ? 'danger' : ''}" data-yes ${typeWord ? 'disabled' : ''}>${esc(ok || 'Confirmar')}</button></div>`,
        onClose: () => { if (!done) resolve(false); }
      });
      if (typeWord) sh.body.querySelector('#cw').addEventListener('input', e => { sh.foot.querySelector('[data-yes]').disabled = e.target.value.trim().toUpperCase() !== typeWord; });
      sh.foot.querySelector('[data-no]').onclick = () => sh.close();
      sh.foot.querySelector('[data-yes]').onclick = () => { done = true; sh.close(); resolve(true); };
    });
  }
  function promptPassword({ title, text, confirm }) {
    return new Promise(resolve => {
      let done = false;
      const sh = openSheet({
        title, sticky: true,
        body: `${text ? `<div class="notice warn">${ic('alert')}<div class="ntext">${text}</div></div>` : ''}
          <div class="field"><label for="pw1">Senha</label><input class="input" id="pw1" type="password" autocomplete="new-password"></div>
          ${confirm ? '<div class="field"><label for="pw2">Repita a senha</label><input class="input" id="pw2" type="password" autocomplete="new-password"></div><p class="help">Mínimo de 10 caracteres. Use uma frase que você não vá esquecer.</p>' : ''}
          <div id="pwerr" class="small" style="color:var(--danger)"></div>`,
        footHtml: `<button class="btn" data-ok>Continuar</button>`,
        onClose: () => { if (!done) resolve(null); }
      });
      const f = sh.body.querySelector('#pw1'); setTimeout(() => f.focus(), 50);
      sh.foot.querySelector('[data-ok]').onclick = () => {
        const a = f.value, b = confirm ? sh.body.querySelector('#pw2').value : a;
        const err = sh.body.querySelector('#pwerr');

    });
  }

  // ---------- persistência ----------
  function logEvent(ds, type, description, extra) {
    if (!Array.isArray(ds.audit_log)) ds.audit_log = [];
    ds.audit_log.push(Object.assign({ event_id: 'evt-' + Date.now().toString(36) + '-' + rand(2), timestamp: nowIso(), type, description, origin: 'app' }, extra || {}));
  }
  function countsOf(ds) { const c = {}; for (const k of Object.keys(ds || {})) if (Array.isArray(ds[k])) c[k] = ds[k].length; return c; }
  function makeBackup(ds, reason) { return { created_at: nowIso(), reason, data: C.clone(ds), counts: countsOf(ds), exported_at: S.meta.last_export_at || null }; }
  async function commit(newDs, opts) {
    opts = opts || {};
    if (opts.audit) logEvent(newDs, opts.audit.type, opts.audit.description, opts.audit.extra);
    const meta = Object.assign({}, S.meta, opts.meta || {}, { last_modified_at: nowIso(), dirty: true });
    const backup = opts.backupReason && S.ds ? makeBackup(S.ds, opts.backupReason) : null;
    try { await DB.saveWithBackup(backup, newDs, meta); }
    catch (e) { showError('Não foi possível salvar', 'Nada foi alterado. Detalhe técnico: ' + esc(e && e.message)); throw e; }
    S.ds = newDs; S.meta = meta;
    render();
    if (syReady()) syLater();
    if (C.summarize(newDs).missingRates.length) fxRefresh(true);
    // No modo "só ver" o aviso tem prioridade: a alteração NÃO vai para o cofre compartilhado.
    if (syReady() && SY.state.role === 'viewer') toast('Você está no modo "só ver": esta alteração fica só neste aparelho e não vai para o cofre compartilhado', null, null, 6000);
    else if (opts.toast) toast(opts.toast, 'Exportar', () => go('mais', 'backup'));
  }
  async function saveMeta(patch) { S.meta = Object.assign({}, S.meta, patch); await DB.set('meta', S.meta); }

    const y = window.scrollY;

  function extDefaults() { const t = todayStr(); return { account: '', pkind: 'mes', month: t.slice(0, 7), year: t.slice(0, 4), start: C.dateOnly(S.ds.snapshot_date) || t, end: t, flow: 'todas', category: '', status: 'todos', text: '' }; }
  function extFilter() {

    else if (e.pkind === 'tudo') p = Reports.periodRange('tudo', todayStr());
    else p = Reports.periodRange('personalizado', e.start, e.end);
    return { account: e.account, start: p.start, end: p.end, label: p.label, flow: e.flow, category: e.category, status: e.status, text: e.text };
  }
  function monthsAvailable() {
    const ds = S.ds, set = new Set();

    (ds.transactions || []).forEach(x => { const d = C.dateOnly(x && x.date); if (d) set.add(d.slice(0, 7)); });
    Object.keys(ds).forEach(k => { if (/_summary$/.test(k) && ds[k] && ds[k].month) set.add(String(ds[k].month).slice(0, 7)); });
    if (ds.snapshot_date) set.add(ds.snapshot_date.slice(0, 7));

  // Valida um rascunho (formulário ou “Pergunte ao Cofre”). Retorna lista de problemas.
  function validateDraft(d) {
    const p = [];

  // Grava o lançamento uma única vez (com vínculos, comprovante e histórico).
  async function persistTx(existing, d, opts) {

    const rec = existing ? Object.assign({}, ds2.transactions.find(t => t.id === existing.id)) : { id: `tx-${d.date}-${slug(d.description || d.category || d.type)}-${rand(2)}`, created_at: now, created_in: 'app' };
    const prevObl = existing ? existing.obligation_id : null;
    const set = (k, v) => { if (v === '' || v === null || v === undefined || (Array.isArray(v) && !v.length)) delete rec[k]; else rec[k] = v; };
    rec.date = d.date; rec.type = d.type; rec.amount = C.round2(amt);
    rec.currency = isCreditId(d.account_id) ? 'BRL' : currencyForAccount(d.account_id);
    rec.status = d.status; rec.origin = d.origin || 'usuario';
    set('account_id', d.account_id); set('category', d.category); set('subcategory', (d.subcategory || '').trim());
    set('description', (d.description || '').trim()); set('notes', (d.notes || '').trim());

    set('obligation_id', d.type === 'despesa' || d.type === 'pagamento_fatura' ? d.obligation_id : '');

    if (d.category_auto) rec.category_source = 'automática (' + d.category_auto + ')'; else if (d.category && rec.category_source && !existing) delete rec.category_source;

      const o = (ds2.obligations || []).find(x => x.id === id);
      if (o && o.paid_transaction_id === rec.id) { o.status = o.status_before_payment || 'pendente'; delete o.paid_transaction_id; delete o.paid_at; delete o.status_before_payment; o.updated_at = now; }
    };
    if (prevObl && (prevObl !== rec.obligation_id || rec.status !== 'confirmado')) unlink(prevObl);
    if (rec.obligation_id && rec.status === 'confirmado') {
      const o = (ds2.obligations || []).find(x => x.id === rec.obligation_id);
      if (o && o.paid_transaction_id !== rec.id) { if (C.isObligationOpen(o)) o.status_before_payment = o.status; o.status = 'pago'; o.paid_transaction_id = rec.id; o.paid_at = rec.date; o.updated_at = now; }

          <div class="field"><label for="f-date">Data</label><input class="input" id="f-date" type="date" value="${esc(d.date)}"></div>
          <div class="field"><label for="f-status">Status</label><select class="input" id="f-status">${Object.entries(STATUS_LABEL).map(([k, l]) => `<option value="${k}" ${d.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        </div>

        <div class="field"><label for="f-acc">${ty === 'transferencia' || ty === 'pagamento_fatura' ? 'Sai da conta' : (ty === 'receita' || ty === 'emprestimo' ? 'Entra na conta' : 'Conta ou cartão')}</label>${accField}
          ${isCredit && ty === 'despesa' ? '<p class="help">Compra no crédito: aumenta a fatura e reduz o limite. <b>Não</b> desconta conta bancária agora.</p>' : ''}</div>

          ${d.to_account_id && toCur !== fromCur ? `<div class="field"><label for="f-amtto">Valor recebido no destino (${esc(toCur)})</label><input class="input num" id="f-amtto" inputmode="decimal" value="${esc(d.amount_to)}"></div>` : ''}` : ''}

        ${sameDay ? `<div class="notice warn">${ic('alert')}<div class="ntext"><b>Esta data é o dia do saldo de corte (${fdate(cutoff)}).</b> Este valor já estava no saldo de corte?</div></div>
          <label class="radio-card"><input type="radio" name="as" value="no" ${d.after_snapshot === true ? 'checked' : ''}><div><b>Não, aconteceu depois</b><div class="small muted">Será aplicado ao saldo agora.</div></div></label>
          <label class="radio-card"><input type="radio" name="as" value="yes" ${d.after_snapshot === false ? 'checked' : ''}><div><b>Sim, já estava no saldo de corte</b><div class="small muted">Fica registrado sem aplicar de novo.</div></div></label>` : ''}
        ${ty !== 'transferencia' ? `<div class="two">
          <div class="field"><label for="f-cat">Categoria</label><select class="input" id="f-cat"><option value="">—</option>${cats.map(c => `<option ${d.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>

        ${openObl.length && (ty === 'despesa' || ty === 'pagamento_fatura') ? `<div class="field"><label for="f-obl">É pagamento de uma conta a pagar?</label><select class="input" id="f-obl"><option value="">Não</option>${openObl.map(o => `<option value="${esc(o.id)}" ${d.obligation_id === o.id ? 'selected' : ''}>${esc(obligationTitle(o))} · ${esc(money(C.amountOf(o)))}</option>`).join('')}</select>

          <div class="field"><label for="f-tags">Etiquetas</label><input class="input" id="f-tags" value="${esc(d.tags)}" placeholder="separe por vírgula"></div>

        <div class="field"><label for="f-file">Comprovante (opcional)</label>
          ${e.receipt_id ? `<div class="small" style="margin-bottom:6px">📎 Já anexado · <button class="link" data-view-att="${esc(e.receipt_id)}">ver</button></div>` : ''}
          <input class="input" id="f-file" type="file" accept="image/*,application/pdf">
          <p class="help">Fica só neste aparelho e vai junto no backup ZIP completo.</p></div>
        ${existing ? `<button class="btn ghost" data-del style="color:var(--danger)">${ic('trash')} Excluir lançamento</button>` : ''}

      sh.foot.innerHTML = `<button class="btn" data-save>${ic('check')} Salvar</button>`;

    function readInputs() {
      const g = id => sh.body.querySelector('#' + id);
      const map = { 'f-amt': 'amount', 'f-date': 'date', 'f-status': 'status', 'f-acc': 'account_id', 'f-to': 'to_account_id', 'f-amtto': 'amount_to', 'f-desc': 'description', 'f-cat': 'category', 'f-sub': 'subcategory', 'f-obl': 'obligation_id', 'f-origin': 'origin', 'f-tags': 'tags', 'f-notes': 'notes' };
      for (const [id, k] of Object.entries(map)) { const el = g(id); if (el) d[k] = el.value; }
      const r = sh.body.querySelector('input[name="as"]:checked'); if (r) d.after_snapshot = r.value === 'no';
      const f = g('f-file'); if (f && f.files && f.files[0]) d.file = f.files[0];
    }
    function autoCategory() {
      if (d.catManual || d.type === 'transferencia') return;
      const r = Classify.classify(d.description);
      const sel = sh.body.querySelector('#f-cat'), hint = sh.body.querySelector('#cat-hint');
      if (r) { d.category = r.category; d.category_auto = r.keyword; } else if (d.category_auto) { d.category = ''; d.category_auto = null; }
      if (sel) sel.value = d.category || '';
      if (hint) hint.textContent = d.category_auto ? `Sugerida automaticamente pela palavra “${d.category_auto}”. Você pode trocar.` : '';
    }
    function bind() {
      const q = id => sh.body.querySelector('#' + id);
      q('f-type').onchange = () => { readInputs(); d.type = q('f-type').value; if (d.type === 'pagamento_fatura') { if (isCreditId(d.account_id) || !d.account_id) d.account_id = firstBank; if (!d.to_account_id) d.to_account_id = ((ds.credit_facilities || [])[0] || {}).id || ''; if (!d.catManual) d.category = 'Banco/Dívidas'; } else if (d.type !== 'despesa' && d.type !== 'provisao' && isCreditId(d.account_id)) d.account_id = firstBank; draw(); };
      ['f-status', 'f-acc', 'f-to', 'f-date'].forEach(id => { const el = q(id); if (el) el.onchange = () => { readInputs(); if (id === 'f-date' || id === 'f-acc') d.after_snapshot = null; draw(); }; });
      const desc = q('f-desc'); if (desc) desc.oninput = () => { d.description = desc.value; autoCategory(); };
      const cat = q('f-cat'); if (cat) cat.onchange = () => { d.category = cat.value; d.catManual = true; d.category_auto = null; const h = q('cat-hint'); if (h) h.textContent = 'Categoria escolhida por você.'; };
      const ob = q('f-obl'); if (ob) ob.onchange = () => {
        readInputs();
        const o = (ds.obligations || []).find(x => x.id === d.obligation_id);
        if (o && !d.amount) d.amount = String(C.openAmountOf(o)).replace('.', ',');
        if (o && !d.description) d.description = 'Pagamento ' + obligationTitle(o);
        if (o && !d.catManual) { d.category = guessCategory(o); d.catManual = true; }
        draw();
      };
      const del = sh.body.querySelector('[data-del]'); if (del) del.onclick = () => deleteTx(existing, sh);
      const va = sh.body.querySelector('[data-view-att]'); if (va) va.onclick = () => viewAttachment(va.dataset.viewAtt);
      sh.foot.querySelector('[data-save]').onclick = save;
    }
    async function save() {
      readInputs();
      const problems = validateDraft(d);
      if (problems.length) { err = problems.join('<br>'); draw(); sh.body.scrollTop = 0; return; }
      const dup = findDuplicate(d, existing);
      if (dup && !(await confirmDialog({ title: 'Possível duplicidade', text: `Já existe um lançamento igual: <b>${esc(dup.description || '')}</b>, ${esc(money(C.num(dup.amount)))} em ${fdate(dup.date)} na mesma conta.<br><br>É outro gasto de verdade?`, ok: 'Sim, salvar mesmo assim', cancel: 'Não, voltar' }))) return;
      if (!d.catManual && d.category_auto) d.category_auto = d.category_auto; else d.category_auto = null;
      sh.close();
      await persistTx(existing, d);
    }
    draw();
  }
  function cutoffFor(accId) {
    const a = (S.ds.accounts || []).find(x => x.id === accId);
    return C.dateOnly(a && a.snapshot_date) || C.dateOnly(S.ds.snapshot_date);
  }
  function currencyForAccount(id) {
    const a = (S.ds.accounts || []).find(x => x.id === id);
    return a && a.currency ? String(a.currency).toUpperCase() : 'BRL';
  }
  function guessCategory(o) {
    const n = C.norm((o.id || '') + ' ' + (o.notes || '') + ' ' + (o.name || o.description || ''));
    if (/emprest|cartao|reneg|facil|dm_|_dm|juros/.test(n)) return 'Banco/Dívidas';
    if (/aluguel|enel|agua|internet|chip|claro|imobil|advog/.test(n)) return 'Casa';
    if (/psn|icloud|stream|assinat/.test(n)) return 'Lazer/Assinaturas';
    if (/passaporte|espanha|viagem/.test(n)) return 'Viagem';
    if (/leite|mercado|aliment/.test(n)) return 'Alimentação/Compras';
    if (/saude|remed|medic/.test(n)) return 'Saúde/Emergências';
    if (/transport|uber|perua/.test(n)) return 'Transporte';
    return '';
  }
  async function deleteTx(t, sh) {
    if (!(await confirmDialog({ title: 'Excluir lançamento?', text: `<b>${esc(t.description || '')}</b> · ${esc(money(C.num(t.amount), t.currency))} em ${fdate(t.date)}.<br><br>O registro sai dos saldos, mas fica guardado em “Registros excluídos” e no histórico, para que uma importação futura não o recrie sem você perceber.`, ok: 'Excluir', danger: true }))) return;
    const ds2 = C.clone(S.ds); const now = nowIso();
    ds2.transactions = ds2.transactions.filter(x => x.id !== t.id);
    const o = (ds2.obligations || []).find(x => x.id === t.obligation_id && x.paid_transaction_id === t.id);
    if (o) { o.status = o.status_before_payment || 'pendente'; delete o.paid_transaction_id; delete o.paid_at; delete o.status_before_payment; o.updated_at = now; }
    if (!Array.isArray(ds2.deleted_records)) ds2.deleted_records = [];
    ds2.deleted_records.push({ id: 'del-' + Date.now().toString(36) + rand(2), collection: 'transactions', record_id: t.id, deleted_at: now, record: C.clone(t) });
    sh.close();
    await commit(ds2, { audit: { type: 'transaction-delete', description: `Excluído: ${t.description || t.id} ${money(C.num(t.amount), t.currency)}`, extra: { record_id: t.id } }, toast: 'Lançamento excluído' });
  }

  // ---------- comprovantes ----------
  async function storeAttachment(ds2, file, txId) {
    const buf = new Uint8Array(await file.arrayBuffer());
    const id = 'att-' + Date.now().toString(36) + rand(3);
    const sha = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', buf))).map(b => b.toString(16).padStart(2, '0')).join('');
    await DB.putFile({ id, name: file.name || 'comprovante', type: file.type || 'application/octet-stream', size: buf.length, blob: new Blob([buf], { type: file.type }), added_at: nowIso() });
    if (!Array.isArray(ds2.attachments_manifest)) ds2.attachments_manifest = [];
    ds2.attachments_manifest.push({ id, filename: file.name || 'comprovante', mime: file.type || '', size: buf.length, sha256: sha, transaction_id: txId, added_at: nowIso(), stored: 'somente neste aparelho' });
    return id;
  }
  async function viewAttachment(id) {
    const f = await DB.getFile(id);
    if (!f) { showError('Comprovante não encontrado', 'Este comprovante está listado nos dados, mas o arquivo não está neste aparelho. Ele só é restaurado importando um backup ZIP completo.'); return; }
    const url = URL.createObjectURL(f.blob);
    const isImg = /^image\//.test(f.type);
    openSheet({ title: f.name, full: true, body: isImg ? `<img src="${url}" alt="Comprovante" style="width:100%;border-radius:12px">` : `<p>Arquivo ${esc(f.type)} · ${(f.size / 1024).toFixed(0)} KB</p><a class="btn" href="${url}" target="_blank" rel="noopener">Abrir arquivo</a>`, foot: false, onClose: () => URL.revokeObjectURL(url) });
  }

  // ---------- CONTAS A PAGAR ----------
  function viewContas() {
    const ds = S.ds, today = todayStr(), sum = C.summarize(ds, today);
    let h = `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h1 class="page-title">Contas a pagar</h1><button class="btn" data-act="debt-new" style="width:auto;padding:10px 14px;margin:0;flex:none">${ic('plus')} Adicionar</button></div>
      <div class="stat-grid"><div class="stat"><div class="k">Pendente</div><div class="v">${M(sum.openPending, sum.mainCurrency)}</div><div class="s">em aberto</div></div><div class="stat"><div class="k">Planejado</div><div class="v">${M(sum.openPlanned, sum.mainCurrency)}</div><div class="s">ainda por vir</div></div></div>`;
    if (sum.openNoRate.length) h += `<div class="notice info">${ic('info')}<div class="ntext">Totais em ${esc(curName(sum.mainCurrency))}. Fora deles, por falta de cotação: ${sum.openNoRate.map(o => esc(obligationTitle(o)) + ' (' + esc(money(C.openAmountOf(o), C.currencyOf(o, ds))) + ')').join(', ')}. <button class="link" data-act="page" data-tab="mais" data-page="moedas">Informar cotação</button></div></div>`;
    if (sum.overdue.length) h += `<div class="notice danger">${ic('clock')}<div class="ntext"><b>Vencimento passado:</b> ${sum.overdue.map(o => esc(obligationTitle(o))).join(', ')}. Se já pagou, toque na conta e registre o pagamento.</div></div>`;
    const months = Object.keys(sum.byMonth).sort((a, b) => a === 'sem-data' ? 1 : b === 'sem-data' ? -1 : a.localeCompare(b));
    if (!months.length) h += `<div class="card empty"><div class="e-ico">✅</div>Nenhuma conta em aberto.<button class="btn secondary" data-act="debt-new" style="margin-top:12px">${ic('plus')} Adicionar conta ou dívida</button></div>`;
    for (const m of months) {
      const g = sum.byMonth[m];
      const items = g.items.slice().sort((a, b) => String(a.due_date || '9').localeCompare(String(b.due_date || '9')));
      h += `<div class="section-title"><span>${m === 'sem-data' ? 'Sem vencimento definido' : monthLabel(m)}</span><span class="tiny muted">${g.pendente ? 'pend. ' + esc(money(g.pendente)) : ''}${g.pendente && (g.planejado + g.outros) ? ' · ' : ''}${g.planejado + g.outros ? 'plan. ' + esc(money(g.planejado + g.outros)) : ''}</span></div>
        <div class="card"><div class="rows">${items.map(o => obligationRow(o, today)).join('')}</div></div>`;
    }
    const closed = (ds.obligations || []).filter(o => o && !C.isObligationOpen(o));
    if (closed.length) h += `<details class="card fold"><summary>Pagas ou canceladas (${closed.length})</summary><div class="rows" style="margin-top:8px">${closed.map(o => obligationRow(o, today)).join('')}</div></details>`;
    const rec = Array.isArray(ds.planned_recurring) ? ds.planned_recurring : [];
    if (rec.length) h += `<details class="card fold"><summary>Recorrentes previstos (${rec.length})</summary><p class="small muted">Modelos de contas que se repetem. <b>Não</b> viram cobrança automaticamente, para evitar duplicidade com as contas acima.</p><div class="rows">${rec.map(r => `<div class="row-item"><div class="ico">${catIcon(guessCategory(r), '🔁')}</div><div class="main"><div class="t">${esc(r.name || humanize(r.id))}</div><div class="s">${esc(r.due || '')}</div></div><div class="amt forecast">${M(C.amountOf(r))}</div></div>`).join('')}</div></details>`;
    return h;
  }
  function openObligation(id) {
    const o = (S.ds.obligations || []).find(x => x.id === id);
    if (!o) return;
    const open = C.isObligationOpen(o);
    const paidTx = o.paid_transaction_id && (S.ds.transactions || []).find(t => t.id === o.paid_transaction_id);

      title: obligationTitle(o),
      body: `<div style="text-align:center;margin:4px 0 16px"><div class="big num" style="font-size:32px;font-weight:750">${M(C.amountOf(o), C.currencyOf(o, S.ds))}</div><div>${statusBadge(o.status)} ${o.due_date ? 'vence ' + fdate(o.due_date) : '<span class="muted">sem vencimento definido</span>'}</div></div>
        ${paidTx ? `<div class="notice ok">${ic('check')}<div class="ntext">Pago pelo lançamento <b>${esc(paidTx.description || paidTx.id)}</b> em ${fdate(paidTx.date)}.</div></div>` : ''}
        ${!paidTx && !open ? `<div class="notice info">${ic('info')}<div class="ntext">Marcada como ${esc(o.status)} sem lançamento vinculado: nada foi descontado do saldo por ela.</div></div>` : ''}
        <div class="card">${renderValue(o)}</div>`,
      footHtml: (open ? `<button class="btn" data-pay>${ic('check')} Registrar pagamento</button>` : '') + `<button class="btn secondary" data-edit>Editar</button>`
    });

      openTxWizard({ type: 'despesa', amount: C.openAmountOf(o), obligation_id: o.id, description: 'Pagamento ' + obligationTitle(o), category: guessCategory(o), catManual: true, account_id: '' });
    };

  // ---------- adicionar conta a pagar / dívida: uma pergunta por vez ----------
  // Cada etapa é uma pergunta curta com respostas rápidas para tocar. No fim, um resumo para confirmar.
  const p2d = n => String(n).padStart(2, '0');
  // Soma meses a uma data AAAA-MM-DD sem pular mês (31/01 + 1 mês = 28 ou 29/02).
  function addMonthsYmd(ymd, k) {
    const [y, m, d] = ymd.split('-').map(Number);
    const t = new Date(y, m - 1 + k, 1), last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
    return `${t.getFullYear()}-${p2d(t.getMonth() + 1)}-${p2d(Math.min(d, last))}`;
  }
  // Próxima data (a partir de hoje) com o dia do mês pedido.
  function nextDay(day, today) {
    const [y, m, d] = today.split('-').map(Number);
    const base = `${y}-${p2d(m)}-${p2d(day)}`;
    return d <= day ? addMonthsYmd(base, 0) : addMonthsYmd(base, 1);
  }
  const DEBT_KINDS = {
    conta: { label: 'Conta do mês', sub: 'luz, água, aluguel, internet, escola…', names: ['Aluguel', 'Luz', 'Água', 'Internet', 'Condomínio', 'Celular', 'Escola', 'Plano de saúde'] },
    parcelada: { label: 'Dívida parcelada', sub: 'empréstimo, financiamento, compra parcelada', names: ['Empréstimo', 'Financiamento do carro', 'Financiamento da casa', 'Compra parcelada', 'Acordo de dívida'] },
    unica: { label: 'Dívida única', sub: 'boleto avulso, imposto, dinheiro que deve a alguém', names: ['Boleto', 'IPVA', 'IPTU', 'Empréstimo de família', 'Conserto'] }
  };
  // Monta os registros que serão criados a partir das respostas (função pura; usada no resumo e ao salvar).
  function debtRecords(a, ds) {
    const now = nowIso(), cur = a.currency || C.mainCurrency(ds), group = 'grp-' + Date.now().toString(36) + rand(2);
    const slug = C.norm(a.name).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 24) || 'conta';
    const n = a.kind === 'parcelada' ? a.count : a.kind === 'conta' ? a.repeat : 1;
    const out = [];
    for (let i = 0; i < n; i++) {
      const due = a.due ? addMonthsYmd(a.due, i) : null;
      const rec = {
        id: `obl-${slug}-${due ? due.slice(0, 7) : 'sem-data'}-${rand(2)}`,
        description: a.kind === 'parcelada' ? `${a.name} · parcela ${i + 1}/${n}` : a.name,
        amount: C.round2(a.amount), currency: cur, due_date: due,
        status: a.kind === 'conta' && i > 0 ? 'planejado' : a.status,
        kind: a.kind, origin: 'usuario', created_at: now, updated_at: now
      };
      if (n > 1) Object.assign(rec, { group_id: group, installment_number: i + 1, installments_total: n });
      rec.category = guessCategory(Object.assign({ name: a.name }, rec)) || undefined;
      if (!rec.category) delete rec.category;
      out.push(rec);
    }
    return out;
  }
  // ================= PERGUNTAS POR ETAPA =================

  // Etapa: { id, when(a), q(a), help(a), type: 'choice'|'input'|'summary',
  //          options(a) → [{ v, label, sub, on }], input(a) → { kind, value, placeholder },
  //          quick(a) → [[valor, rótulo]], extra(a) → html, apply(a, valor, sheet) → mensagem de erro | undefined,
  //          body(a) → html (resumo), more → { label, act(a) } }
  function runWizard(o) {
    const a = o.a; let i = 0;
    const sh = openSheet({ title: o.title, sticky: true, body: '', footHtml: '' });
    const live = () => o.steps.filter(s => !s.when || s.when(a));
    const chip = (v, label, sub, on) => `<button class="radio-card" data-v="${esc(v)}" style="width:100%;text-align:left;cursor:pointer;${on ? 'border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)' : ''}"><div><b>${label}</b>${sub ? `<div class="small muted">${sub}</div>` : ''}</div></button>`;
    function draw() {
      const L = live(); if (i >= L.length) i = L.length - 1;
      const st = L[i], qs = L.filter(s => s.type !== 'summary'), n = qs.indexOf(st) + 1;
      // O total só aparece depois das perguntas que mudam o caminho (decides), para não "pular" no meio.
      const known = L.every((s, k) => !s.decides || k < i);
      const head = st.type === 'summary' ? 'Confira' : known ? `Pergunta ${n} de ${qs.length}` : `Pergunta ${n}`;
      const bar = !known ? '<div style="height:20px"></div>' : `<div style="display:flex;gap:4px;margin:0 0 16px">${qs.map((_, k) => `<div style="flex:1;height:4px;border-radius:2px;background:${k < n || st.type === 'summary' ? 'var(--accent)' : 'var(--line)'}"></div>`).join('')}</div>`;
      const help = st.help ? st.help(a) : '';
      let body = `${bar}<div class="tiny muted" style="font-weight:700;letter-spacing:.06em;text-transform:uppercase">${head}</div>
        <h2 style="font-size:22px;letter-spacing:-0.01em;margin:4px 0 6px">${st.q(a)}</h2>${help ? `<p class="small muted" style="margin:0 0 14px">${help}</p>` : '<div style="height:10px"></div>'}`;
      if (st.type === 'choice') body += st.options(a).map(x => chip(x.v, x.label, x.sub, x.on)).join('');
      if (st.type === 'input') {
        const inp = st.input(a);
        const attrs = inp.kind === 'money' ? 'class="input big num" inputmode="decimal"' : inp.kind === 'int' ? 'class="input big num" inputmode="numeric"' : inp.kind === 'date' ? 'class="input" type="date"' : 'class="input" style="font-size:18px" autocapitalize="sentences"';
        const field = `<input id="wz-in" ${attrs} autocomplete="off" placeholder="${esc(inp.placeholder || '')}" value="${esc(inp.value == null ? '' : inp.value)}">`;
        const quick = st.quick ? st.quick(a) : [];
        const qhtml = quick.length ? `<div class="chips ask-chips" style="flex-wrap:wrap;margin-top:10px">${quick.map(([v, l]) => `<button class="chip" data-q="${esc(v)}">${esc(l)}</button>`).join('')}</div>` : '';
        body += inp.kind === 'date' ? qhtml + `<div class="field" style="margin-top:14px"><label for="wz-in">${esc(inp.label || 'Ou escolha a data')}</label>${field}</div>` : field + qhtml;
      }
      if (st.type === 'summary') body += st.body(a);
      if (st.extra) body += st.extra(a);
      sh.body.innerHTML = body + '<div id="wz-err" class="small" style="color:var(--danger);margin-top:8px"></div>';
      const more = st.type === 'summary' && st.more ? `<button class="btn ghost" data-more style="margin-top:6px">${esc(st.more.label)}</button>` : '';
      sh.foot.innerHTML = `<div class="btn-row">${i > 0 ? '<button class="btn secondary" data-back>Voltar</button>' : ''}${st.type === 'choice' ? '' : `<button class="btn" data-next>${st.type === 'summary' ? ic('check') + ' ' + esc(o.finishLabel || 'Salvar') : 'Continuar'}</button>`}</div>${more}`;
      const inp = sh.body.querySelector('#wz-in');
      if (inp && inp.type !== 'date') setTimeout(() => inp.focus(), 60);
      if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); next(inp.value); } });
      if (st.onDraw) st.onDraw(a, sh);
      sh.body.querySelectorAll('[data-v]').forEach(b => b.onclick = () => next(b.dataset.v));
      sh.body.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { if (inp) inp.value = b.dataset.q; next(b.dataset.q); });
      const bk = sh.foot.querySelector('[data-back]'); if (bk) bk.onclick = () => { i--; draw(); };
      const nx = sh.foot.querySelector('[data-next]'); if (nx) nx.onclick = () => next(inp ? inp.value : undefined);
      const mo = sh.foot.querySelector('[data-more]'); if (mo) mo.onclick = () => { sh.close(); st.more.act(a); };
    }
    let busy = false;
    async function next(v) {
      if (busy) return;
      const st = live()[i];

      if (msg) { sh.body.querySelector('#wz-err').textContent = msg; return; }
      if (st.type === 'summary') { busy = true; try { if ((await o.finish(a)) !== false) sh.close(); } finally { busy = false; } return; }

    }

  }

  function addDaysYmd(ymd, k) { const [y, m, d] = ymd.split('-').map(Number); const t = new Date(y, m - 1, d + k); return `${t.getFullYear()}-${p2d(t.getMonth() + 1)}-${p2d(t.getDate())}`; }
  const wzMoney = (v, cur) => { const n = C.num(v); return n > 0 ? C.round2(n) : null; };
  const isReserveAcc = acc => /protegid|espanha|reserva/.test(C.norm(acc && acc.status));

    });
    if (opts.cards) for (const cf of S.ds.credit_facilities || []) if (cf && cf.id) out.push({ v: cf.id, label: esc(cf.name || cf.id), sub: 'cartão de crédito · vai para a fatura', on: selected === cf.id });
    return out;
  }
  const frequentDescriptions = (type, n) => {
    const cnt = {};

  };
  const uniq = arr => [...new Set(arr.filter(Boolean))];

  // ---------- novo lançamento ----------

    const draft = () => ({ type: a.type, amount: String(a.amount), date: a.date, status: a.date > today ? 'planejado' : 'confirmado', account_id: a.account_id, to_account_id: a.to_account_id,

    const kinds = [['despesa', 'Gastei', 'compra, conta paga, saída de dinheiro'], ['receita', 'Recebi', 'salário, venda, reembolso'], ['transferencia', 'Transferi entre minhas contas', 'não é gasto nem receita'],
      hasCards ? ['pagamento_fatura', 'Paguei a fatura do cartão', 'tira da conta e abate a fatura'] : null, ['guardar', 'Guardei dinheiro', 'mandar para uma reserva'],
      preset ? null : ['comprovante', 'Tenho o comprovante', 'o app lê a foto, o print ou o PDF e preenche para você']].filter(Boolean);
    const rc = a.fromReceipt, rcHelp = (txt) => rc && rc !== 'manual' ? `<span class="badge ok">lido do comprovante</span> ${txt}` : '';
    runWizard({ title: preset && preset.obligation_id ? 'Registrar pagamento' : 'Novo lançamento', a, finishLabel: 'Salvar lançamento', steps: [
      { id: 'type', decides: true, when: () => !(preset && preset.type) || !!rc, type: 'choice', q: () => rc ? 'O que é este comprovante?' : 'O que aconteceu?', help: a => rc && a.type ? rcHelp('Parece que você ' + (a.type === 'receita' ? 'recebeu' : 'pagou') + '. Confirme ou troque.') : rc ? 'O comprovante fica anexado ao lançamento.' : '', options: () => kinds.map(([v, l, s]) => ({ v, label: l, sub: s, on: a.type === v })),
        apply: (a, v) => { if (v === 'guardar') { setTimeout(() => openSaveWizard(), 50); S.sheets.slice(-1)[0].close(); return 'abrindo'; } if (v === 'comprovante') { S.sheets.slice(-1)[0].close(); setTimeout(() => openReceiptReader(), 50); return 'abrindo'; } if (rc && v !== 'despesa') { a.category = ''; a.category_auto = null; } if (a.type !== v && !rc) { a.category = ''; a.description = ''; a.to_account_id = ''; } a.type = v; } },

      { id: 'desc', when: a => (a.type === 'despesa' || a.type === 'receita') && !(preset && preset.obligation_id), type: 'input', q: a => a.type === 'despesa' ? 'Com o quê?' : 'De onde veio?', help: a => a.receipt && a.receipt.description && a.description === a.receipt.description.slice(0, 80) ? rcHelp('Nome que está no comprovante. Pode trocar por algo que você reconheça, ex.: Mercado.') : 'Escreva do seu jeito. A categoria é sugerida pelo que você escrever.',
        input: a => ({ kind: 'text', value: a.description, placeholder: a.type === 'despesa' ? 'ex.: Mercado' : 'ex.: Salário' }),
        quick: a => uniq(frequentDescriptions(a.type, 8)).map(x => [x, x]), // só o que a própria pessoa já lançou

      { id: 'cat', when: a => a.type === 'despesa' && !(preset && preset.obligation_id), type: 'choice', q: () => 'Qual categoria?', help: a => a.category_auto === 'leitura do comprovante' ? 'Sugerida pela leitura do comprovante. Toque para confirmar ou trocar.' : a.category_auto ? `Sugeri pela palavra “${esc(a.category_auto)}”. Toque para confirmar ou trocar.` : 'Escolha a que mais combina.',
