        ${ty === 'pagamento_fatura' ? `<div class="field"><label for="f-to">Cartão pago</label><select class="input" id="f-to">${creditOptions(d.to_account_id)}</select></div>` : ''}
        ${sameDay ? `<div class="notice warn">${ic('alert')}<div class="ntext"><b>Esta data é o dia do saldo de corte (${fdate(cutoff)}).</b> Este valor já estava no saldo de corte?</div></div>
          <label class="radio-card"><input type="radio" name="as" value="no" ${d.after_snapshot === true ? 'checked' : ''}><div><b>Não, aconteceu depois</b><div class="small muted">Será aplicado ao saldo agora.</div></div></label>
          <label class="radio-card"><input type="radio" name="as" value="yes" ${d.after_snapshot === false ? 'checked' : ''}><div><b>Sim, já estava no saldo de corte</b><div class="small muted">Fica registrado sem aplicar de novo.</div></div></label>` : ''}
        ${ty !== 'transferencia' ? `<div class="two">
          <div class="field"><label for="f-cat">Categoria</label><select class="input" id="f-cat"><option value="">—</option>${cats.map(c => `<option ${d.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
          <div class="field"><label for="f-sub">Subcategoria</label><input class="input" id="f-sub" value="${esc(d.subcategory)}"></div></div>
          <p class="help" id="cat-hint" style="margin-top:-6px">${d.category_auto && !d.catManual ? `Sugerida automaticamente pela palavra “${esc(d.category_auto)}”. Você pode trocar.` : ''}</p>` : ''}
        ${openObl.length && (ty === 'despesa' || ty === 'pagamento_fatura') ? `<div class="field"><label for="f-obl">É pagamento de uma conta a pagar?</label><select class="input" id="f-obl"><option value="">Não</option>${openObl.map(o => `<option value="${esc(o.id)}" ${d.obligation_id === o.id ? 'selected' : ''}>${esc(obligationTitle(o))} · ${esc(money(C.amountOf(o)))}</option>`).join('')}</select>
          <p class="help">Vincular evita contar a mesma dívida duas vezes. Confirmado, a conta é marcada como paga.</p></div>` : ''}
        <div class="two">
          <div class="field"><label for="f-origin">Origem</label><select class="input" id="f-origin">${Object.entries(ORIGIN_LABEL).map(([k, l]) => `<option value="${k}" ${d.origin === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
          <div class="field"><label for="f-tags">Etiquetas</label><input class="input" id="f-tags" value="${esc(d.tags)}" placeholder="separe por vírgula"></div>
        </div>
        <div class="field"><label for="f-notes">Observação</label><textarea class="input" id="f-notes" rows="2">${esc(d.notes)}</textarea></div>
        <div class="field"><label for="f-file">Comprovante (opcional)</label>
          ${e.receipt_id ? `<div class="small" style="margin-bottom:6px">📎 Já anexado · <button class="link" data-view-att="${esc(e.receipt_id)}">ver</button></div>` : ''}
          <input class="input" id="f-file" type="file" accept="image/*,application/pdf">
          <p class="help">Fica só neste aparelho e vai junto no backup ZIP completo.</p></div>
        ${existing ? `<button class="btn ghost" data-del style="color:var(--danger)">${ic('trash')} Excluir lançamento</button>` : ''}
        <p class="tiny muted">${existing ? 'ID: ' + esc(existing.id) : ''}</p>`;
      sh.foot.innerHTML = `<button class="btn" data-save>${ic('check')} Salvar</button>`;
      bind();
    }
    function readInputs() {
      const g = id => sh.body.querySelector('#' + id);
      const map = { 'f-amt': 'amount', 'f-date': 'date', 'f-status': 'status', 'f-acc': 'account_id', 'f-to': 'to_account_id', 'f-amtto': 'amount_to', 'f-desc': 'description', 'f-cat': 'category', 'f-sub': 'subcategory', 'f-obl': 'obligation_id', 'f-origin': 'origin', 'f-tags': 'tags', 'f-notes': 'notes' };
      for (const [id, k] of Object.entries(map)) { const el = g(id); if (el) d[k] = el.value; }
      const r = sh.body.querySelector('input[name="as"]:checked'); if (r) d.after_snapshot = r.value === 'no';
      const f = g('f-file'); if (f && f.files && f.files[0]) d.file = f.files[0];
    }
    function autoCategory() {
      if (d.catManual || d.type === 'transferencia') return;
      const r = Classify.classify(d.description);
      const sel = sh.body.querySelector('#f-cat'), hint = sh.body.querySelector('#cat-hint');
      if (r) { d.category = r.category; d.category_auto = r.keyword; } else if (d.category_auto) { d.category = ''; d.category_auto = null; }
      if (sel) sel.value = d.category || '';
      if (hint) hint.textContent = d.category_auto ? `Sugerida automaticamente pela palavra “${d.category_auto}”. Você pode trocar.` : '';
    }
    function bind() {
      const q = id => sh.body.querySelector('#' + id);
      q('f-type').onchange = () => { readInputs(); d.type = q('f-type').value; if (d.type === 'pagamento_fatura') { if (isCreditId(d.account_id) || !d.account_id) d.account_id = firstBank; if (!d.to_account_id) d.to_account_id = ((ds.credit_facilities || [])[0] || {}).id || ''; if (!d.catManual) d.category = 'Banco/Dívidas'; } else if (d.type !== 'despesa' && d.type !== 'provisao' && isCreditId(d.account_id)) d.account_id = firstBank; draw(); };
      ['f-status', 'f-acc', 'f-to', 'f-date'].forEach(id => { const el = q(id); if (el) el.onchange = () => { readInputs(); if (id === 'f-date' || id === 'f-acc') d.after_snapshot = null; draw(); }; });
      const desc = q('f-desc'); if (desc) desc.oninput = () => { d.description = desc.value; autoCategory(); };
      const cat = q('f-cat'); if (cat) cat.onchange = () => { d.category = cat.value; d.catManual = true; d.category_auto = null; const h = q('cat-hint'); if (h) h.textContent = 'Categoria escolhida por você.'; };
      const ob = q('f-obl'); if (ob) ob.onchange = () => {
        readInputs();
        const o = (ds.obligations || []).find(x => x.id === d.obligation_id);
        if (o && !d.amount) d.amount = String(C.amountOf(o)).replace('.', ',');
        if (o && !d.description) d.description = 'Pagamento ' + obligationTitle(o);
        if (o && !d.catManual) { d.category = guessCategory(o); d.catManual = true; }
        draw();
      };
      const del = sh.body.querySelector('[data-del]'); if (del) del.onclick = () => deleteTx(existing, sh);
      const va = sh.body.querySelector('[data-view-att]'); if (va) va.onclick = () => viewAttachment(va.dataset.viewAtt);
      sh.foot.querySelector('[data-save]').onclick = save;
    }
    async function save() {
      readInputs();
      const problems = validateDraft(d);
      if (problems.length) { err = problems.join('<br>'); draw(); sh.body.scrollTop = 0; return; }
      const dup = findDuplicate(d, existing);
      if (dup && !(await confirmDialog({ title: 'Possível duplicidade', text: `Já existe um lançamento igual: <b>${esc(dup.description || '')}</b>, ${esc(money(C.num(dup.amount)))} em ${fdate(dup.date)} na mesma conta.<br><br>É outro gasto de verdade?`, ok: 'Sim, salvar mesmo assim', cancel: 'Não, voltar' }))) return;
      if (!d.catManual && d.category_auto) d.category_auto = d.category_auto; else d.category_auto = null;
      sh.close();
      await persistTx(existing, d);
    }
    draw();
  }
  function cutoffFor(accId) {
    const a = (S.ds.accounts || []).find(x => x.id === accId);
    return C.dateOnly(a && a.snapshot_date) || C.dateOnly(S.ds.snapshot_date);
  }
  function currencyForAccount(id) {
    const a = (S.ds.accounts || []).find(x => x.id === id);
    return a && a.currency ? String(a.currency).toUpperCase() : 'BRL';
  }
  function guessCategory(o) {
    const n = C.norm((o.id || '') + ' ' + (o.notes || '') + ' ' + (o.name || o.description || ''));
    if (/emprest|cartao|reneg|facil|dm_|_dm|juros/.test(n)) return 'Banco/Dívidas';
    if (/aluguel|enel|agua|internet|chip|claro|imobil|advog/.test(n)) return 'Casa';
    if (/psn|icloud|stream|assinat/.test(n)) return 'Lazer/Assinaturas';
    if (/passaporte|espanha|viagem/.test(n)) return 'Viagem/Espanha';
    if (/leite|mercado|aliment/.test(n)) return 'Alimentação/Compras';
    if (/saude|remed|medic/.test(n)) return 'Saúde/Emergências';
    if (/transport|uber|perua/.test(n)) return 'Transporte';
    return '';
  }
  async function deleteTx(t, sh) {
    if (!(await confirmDialog({ title: 'Excluir lançamento?', text: `<b>${esc(t.description || '')}</b> · ${esc(money(C.num(t.amount), t.currency))} em ${fdate(t.date)}.<br><br>O registro sai dos saldos, mas fica guardado em “Registros excluídos” e no histórico, para que uma importação futura não o recrie sem você perceber.`, ok: 'Excluir', danger: true }))) return;
    const ds2 = C.clone(S.ds); const now = nowIso();
    ds2.transactions = ds2.transactions.filter(x => x.id !== t.id);
    const o = (ds2.obligations || []).find(x => x.id === t.obligation_id && x.paid_transaction_id === t.id);
    if (o) { o.status = o.status_before_payment || 'pendente'; delete o.paid_transaction_id; delete o.paid_at; delete o.status_before_payment; o.updated_at = now; }
    if (!Array.isArray(ds2.deleted_records)) ds2.deleted_records = [];
    ds2.deleted_records.push({ id: 'del-' + Date.now().toString(36) + rand(2), collection: 'transactions', record_id: t.id, deleted_at: now, record: C.clone(t) });
    sh.close();
    await commit(ds2, { audit: { type: 'transaction-delete', description: `Excluído: ${t.description || t.id} ${money(C.num(t.amount), t.currency)}`, extra: { record_id: t.id } }, toast: 'Lançamento excluído' });
  }

  // ---------- comprovantes ----------
  async function storeAttachment(ds2, file, txId) {
    const buf = new Uint8Array(await file.arrayBuffer());
    const id = 'att-' + Date.now().toString(36) + rand(3);
    const sha = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', buf))).map(b => b.toString(16).padStart(2, '0')).join('');
    await DB.putFile({ id, name: file.name || 'comprovante', type: file.type || 'application/octet-stream', size: buf.length, blob: new Blob([buf], { type: file.type }), added_at: nowIso() });
    if (!Array.isArray(ds2.attachments_manifest)) ds2.attachments_manifest = [];
    ds2.attachments_manifest.push({ id, filename: file.name || 'comprovante', mime: file.type || '', size: buf.length, sha256: sha, transaction_id: txId, added_at: nowIso(), stored: 'somente neste aparelho' });
    return id;
  }
  async function viewAttachment(id) {
    const f = await DB.getFile(id);
    if (!f) { showError('Comprovante não encontrado', 'Este comprovante está listado nos dados, mas o arquivo não está neste aparelho. Ele só é restaurado importando um backup ZIP completo.'); return; }
    const url = URL.createObjectURL(f.blob);
    const isImg = /^image\//.test(f.type);
    openSheet({ title: f.name, full: true, body: isImg ? `<img src="${url}" alt="Comprovante" style="width:100%;border-radius:12px">` : `<p>Arquivo ${esc(f.type)} · ${(f.size / 1024).toFixed(0)} KB</p><a class="btn" href="${url}" target="_blank" rel="noopener">Abrir arquivo</a>`, foot: false, onClose: () => URL.revokeObjectURL(url) });
  }

  // ---------- CONTAS A PAGAR ----------
  function viewContas() {
    const ds = S.ds, today = todayStr(), sum = C.summarize(ds, today);
    let h = `<h1 class="page-title">Contas a pagar</h1>
      <div class="stat-grid"><div class="stat"><div class="k">Pendente</div><div class="v">${M(sum.openPending)}</div><div class="s">em aberto</div></div><div class="stat"><div class="k">Planejado</div><div class="v">${M(sum.openPlanned)}</div><div class="s">ainda por vir</div></div></div>`;
    if (sum.overdue.length) h += `<div class="notice danger">${ic('clock')}<div class="ntext"><b>Vencimento passado:</b> ${sum.overdue.map(o => esc(obligationTitle(o))).join(', ')}. Se já pagou, toque na conta e registre o pagamento.</div></div>`;
    const months = Object.keys(sum.byMonth).sort((a, b) => a === 'sem-data' ? 1 : b === 'sem-data' ? -1 : a.localeCompare(b));
    if (!months.length) h += `<div class="card empty"><div class="e-ico">✅</div>Nenhuma conta em aberto.</div>`;
    for (const m of months) {
      const g = sum.byMonth[m];
      const items = g.items.slice().sort((a, b) => String(a.due_date || '9').localeCompare(String(b.due_date || '9')));
      h += `<div class="section-title"><span>${m === 'sem-data' ? 'Sem vencimento definido' : monthLabel(m)}</span><span class="tiny muted">${g.pendente ? 'pend. ' + esc(money(g.pendente)) : ''}${g.pendente && (g.planejado + g.outros) ? ' · ' : ''}${g.planejado + g.outros ? 'plan. ' + esc(money(g.planejado + g.outros)) : ''}</span></div>
        <div class="card"><div class="rows">${items.map(o => obligationRow(o, today)).join('')}</div></div>`;
    }
    const closed = (ds.obligations || []).filter(o => o && !C.isObligationOpen(o));
    if (closed.length) h += `<details class="card fold"><summary>Pagas ou canceladas (${closed.length})</summary><div class="rows" style="margin-top:8px">${closed.map(o => obligationRow(o, today)).join('')}</div></details>`;
    const rec = Array.isArray(ds.planned_recurring) ? ds.planned_recurring : [];
    if (rec.length) h += `<details class="card fold"><summary>Recorrentes previstos (${rec.length})</summary><p class="small muted">Modelos de contas que se repetem. <b>Não</b> viram cobrança automaticamente, para evitar duplicidade com as contas acima.</p><div class="rows">${rec.map(r => `<div class="row-item"><div class="ico">${catIcon(guessCategory(r), '🔁')}</div><div class="main"><div class="t">${esc(r.name || humanize(r.id))}</div><div class="s">${esc(r.due || '')}</div></div><div class="amt forecast">${M(C.amountOf(r))}</div></div>`).join('')}</div></details>`;
    return h;
  }
  function openObligation(id) {
    const o = (S.ds.obligations || []).find(x => x.id === id);
    if (!o) return;
    const open = C.isObligationOpen(o);
    const paidTx = o.paid_transaction_id && (S.ds.transactions || []).find(t => t.id === o.paid_transaction_id);
    const sh = openSheet({
      title: obligationTitle(o),
      body: `<div style="text-align:center;margin:4px 0 16px"><div class="big num" style="font-size:32px;font-weight:750">${M(C.amountOf(o), C.currencyOf(o, S.ds))}</div><div>${statusBadge(o.status)} ${o.due_date ? 'vence ' + fdate(o.due_date) : '<span class="muted">sem vencimento definido</span>'}</div></div>
        ${paidTx ? `<div class="notice ok">${ic('check')}<div class="ntext">Pago pelo lançamento <b>${esc(paidTx.description || paidTx.id)}</b> em ${fdate(paidTx.date)}.</div></div>` : ''}
        ${!paidTx && !open ? `<div class="notice info">${ic('info')}<div class="ntext">Marcada como ${esc(o.status)} sem lançamento vinculado: nada foi descontado do saldo por ela.</div></div>` : ''}
        <div class="card">${renderValue(o)}</div>`,
      footHtml: (open ? `<button class="btn" data-pay>${ic('check')} Registrar pagamento</button>` : '') + `<button class="btn secondary" data-edit>Editar</button>`
    });
    const pay = sh.foot.querySelector('[data-pay]');
    if (pay) pay.onclick = () => {
      sh.close();
      const acc = (S.ds.accounts || []).find(a => a.id === 'nubank_debito') || (S.ds.accounts || [])[0] || {};
      openTxForm(null, { type: 'despesa', amount: String(C.amountOf(o)).replace('.', ','), obligation_id: o.id, description: 'Pagamento ' + obligationTitle(o), category: guessCategory(o), status: 'confirmado', account_id: acc.id || '' });
    };
    sh.foot.querySelector('[data-edit]').onclick = () => { sh.close(); editObligation(o); };
  }
  function editObligation(o) {
    const sts = ['pendente', 'planejado', 'pago', 'cancelado']; if (o.status && !sts.includes(o.status)) sts.unshift(o.status);
    const sh = openSheet({
      title: 'Editar conta a pagar', sticky: true,
      body: `<div class="field"><label>Valor (R$)</label><input class="input num" id="o-amt" inputmode="decimal" value="${esc(String(C.amountOf(o)).replace('.', ','))}"></div>
        <div class="field"><label>Vencimento</label><input class="input" id="o-due" type="date" value="${esc(o.due_date || '')}"><p class="help">Deixe vazio se a data não for conhecida.</p></div>
        <div class="field"><label>Status</label><select class="input" id="o-st">${sts.map(s => `<option value="${esc(s)}" ${o.status === s ? 'selected' : ''}>${esc(humanize(s))}</option>`).join('')}</select>
        <p class="help">Para quitar, prefira “Registrar pagamento”: assim o valor sai do saldo certo e fica vinculado.</p></div>
        <div class="field"><label>Observação</label><textarea class="input" id="o-notes" rows="3">${esc(o.notes || '')}</textarea></div>`,
      footHtml: `<button class="btn" data-save>Salvar</button>`
    });
    sh.foot.querySelector('[data-save]').onclick = async () => {
      const g = id => sh.body.querySelector(id).value;
      const amt = C.num(g('#o-amt'));
      if (isNaN(amt) || amt < 0) { toast('Valor inválido'); return; }
      const ds2 = C.clone(S.ds); const rec = ds2.obligations.find(x => x.id === o.id);
      const before = C.clone(rec); const field = 'amount' in rec || !('amount_brl' in rec) ? 'amount' : 'amount_brl';
      rec[field] = C.round2(amt); rec.due_date = g('#o-due') || null; rec.status = g('#o-st');
      if (g('#o-notes').trim()) rec.notes = g('#o-notes').trim(); else delete rec.notes;
      const changed = Object.keys(rec).filter(k => C.stable(rec[k]) !== C.stable(before[k]));
      if (!changed.length) { sh.close(); return; }
      rec.updated_at = nowIso();
      sh.close();
      await commit(ds2, { audit: { type: 'obligation-update', description: `${obligationTitle(rec)}: ${changed.map(k => (KEYL[k] || k) + ' ' + JSON.stringify(before[k] ?? null) + ' → ' + JSON.stringify(rec[k] ?? null)).join('; ')}`, extra: { record_id: rec.id } }, toast: 'Conta atualizada' });
    };
  }

  // ---------- AGENDA ----------
  function eventsIndex(ds, ym) {
    const ev = {};
    const add = (d, e) => { if (!d) return; (ev[d] = ev[d] || []).push(e); };
    (ds.obligations || []).forEach(o => { if (o && o.due_date && C.isObligationOpen(o)) add(o.due_date, { kind: 'due', title: obligationTitle(o), amount: C.amountOf(o), status: o.status, act: 'obligation', id: o.id }); });
    (ds.income_forecasts || []).forEach(r => {
      if (!r) return;
      if (r.date) add(C.dateOnly(r.date), { kind: 'inc', title: humanize(r.id), amount: C.amountOf(r), status: r.status, act: 'raw', key: 'income_forecasts', id: r.id });
      else if (r.expected_day && ym && /mensal/.test(C.norm(r.frequency))) add(`${ym}-${p2(r.expected_day)}`, { kind: 'inc', title: humanize(r.id) + ' (mensal)', amount: C.amountOf(r), status: r.status, act: 'raw', key: 'income_forecasts', id: r.id });
    });
    (ds.transactions || []).forEach(t => { if (t && t.date) add(C.dateOnly(t.date), { kind: 'tx', title: t.description || TYPE_LABEL[C.txType(t)] || 'Lançamento', amount: C.num(t.amount), status: t.status, act: 'tx-edit', id: t.id, cur: t.currency }); });
    return ev;
  }
  function viewAgenda() {
    const a = S.agenda;
    if (!a.month) a.month = todayStr().slice(0, 7);
    let h = `<h1 class="page-title">Agenda</h1><div class="seg"><button class="${a.view === 'cal' ? 'on' : ''}" data-act="agenda-view" data-v="cal">Calendário</button><button class="${a.view === 'time' ? 'on' : ''}" data-act="agenda-view" data-v="time">Linha do tempo</button></div>`;
    return h + (a.view === 'cal' ? calendarView() : timelineView());
  }
  function eventRow(e) {
    const color = e.kind === 'due' ? 'var(--danger)' : (e.kind === 'inc' ? 'var(--pos)' : 'var(--info)');
    return `<button class="row-item" data-act="${e.act}" data-id="${esc(e.id)}" ${e.key ? `data-key="${esc(e.key)}"` : ''}><div class="ico" style="color:${color}">${e.kind === 'due' ? '📌' : (e.kind === 'inc' ? '💼' : '🧾')}</div>
      <div class="main"><div class="t">${esc(e.title)}</div><div class="s">${e.kind === 'due' ? 'Vencimento' : (e.kind === 'inc' ? 'Receita prevista' : 'Lançamento')} ${statusBadge(e.status)}</div></div><div class="amt ${e.kind === 'tx' && C.norm(e.status) === 'confirmado' ? '' : 'forecast'}">${M(e.amount, e.cur)}</div></button>`;
  }
  function calendarView() {
    const a = S.agenda, [y, m] = a.month.split('-').map(Number);
    const ev = eventsIndex(S.ds, a.month);
    const first = new Date(y, m - 1, 1), start = first.getDay();
    const days = new Date(y, m, 0).getDate(), today = todayStr();
    let h = `<div class="card"><div class="cal-head"><button class="icon-btn" data-act="cal-nav" data-d="-1" aria-label="Mês anterior">${ic('left')}</button><b>${(s => s.charAt(0).toUpperCase() + s.slice(1))(monthLabel(a.month))}</b><button class="icon-btn" data-act="cal-nav" data-d="1" aria-label="Próximo mês">${ic('right')}</button></div><div class="cal">`;
    ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].forEach(d => { h += `<div class="dow">${d}</div>`; });
    for (let i = 0; i < start; i++) h += `<div></div>`;
    for (let d = 1; d <= days; d++) {
      const ds = `${a.month}-${p2(d)}`, e = ev[ds] || [];
      const kinds = Array.from(new Set(e.map(x => x.kind)));
      h += `<button class="day ${ds === today ? 'today' : ''} ${a.sel === ds ? 'sel' : ''}" data-act="cal-day" data-d="${ds}" aria-label="${d} ${e.length ? e.length + ' itens' : ''}"><span>${d}</span><span class="dots">${kinds.map(k => `<i class="dot ${k}"></i>`).join('')}</span></button>`;
    }

  // ---------- IMPORTAÇÃO ----------
  function pickFile() {
    return new Promise(resolve => {
      const inp = document.createElement('input'); inp.type = 'file'; inp.style.display = 'none';
      inp.onchange = () => { resolve(inp.files && inp.files[0]); inp.remove(); };
      document.body.appendChild(inp); inp.click();
    });
  }
  function parseJsonLenient(text) {
    text = text.replace(/^﻿/, '').trim();
    try { return JSON.parse(text); } catch (e1) {
      const m = text.match(/```(?:json)?\s*([\s\S]*?)```/);
      if (m) { try { return JSON.parse(m[1]); } catch (e2) { /* segue */ } }
      const pos = /position (\d+)/.exec(e1.message);
      const err = new Error('O arquivo não é um JSON válido' + (pos ? ' (problema perto do caractere ' + pos[1] + ')' : '') + '. Se veio do ChatGPT, peça para ele gerar o arquivo .json de novo, completo e sem cortes.');
      err.friendly = true; throw err;
    }
  }
  async function startImport() {
    const file = await pickFile();
    if (!file) return;
    try {
      const buf = new Uint8Array(await file.arrayBuffer());
      let text, zipFiles = [];
      if (Zip.isZip(buf)) {
        const entries = await Zip.readZip(buf);
        const js = entries.filter(e => /\.json$/i.test(e.name));
        const j = js.find(e => !e.name.includes('/')) || js[0];
        if (!j) throw Object.assign(new Error('O ZIP não contém um arquivo .json de backup.'), { friendly: true });
        text = new TextDecoder().decode(j.data);
        zipFiles = entries.filter(e => e !== j && /^comprovantes\//.test(e.name));
      } else text = new TextDecoder().decode(buf);
      let obj = parseJsonLenient(text);
      if (C.isEncrypted(obj)) {
        const pw = await promptPassword({ title: 'Backup criptografado', text: 'Digite a senha usada ao exportar este backup.' });
        if (!pw) return;
        try { obj = parseJsonLenient(await C.decryptText(obj, pw)); }
        catch (e) { if (e.friendly) throw e; throw Object.assign(new Error('Senha incorreta ou arquivo danificado.'), { friendly: true }); }
      }
      const prep = C.prepare(obj);
      if (prep.fatal) throw Object.assign(new Error(prep.fatal), { friendly: true });
      const v = C.validate(prep.data);
      const integ = await C.checkIntegrityField(prep.data);
      showImportPreview({ file, raw: obj, prep, v, integ, zipFiles });
    } catch (e) {
      showError('Não foi possível ler o arquivo', esc(e.friendly ? e.message : 'Erro inesperado: ' + (e && e.message)));
    }
  }
  function describeRecord(key, it) {

    const parts = [];
    if (!isNaN(amt)) parts.push(money(amt, C.currencyOf(it, S.ds)));
    const d = it.date || it.due_date || it.timestamp; if (d) parts.push(C.dateOnly(d) ? fdate(d) : esc(d));
    if (it.status) parts.push(String(it.status));
    if (it.account_id) parts.push(accountName(it.account_id));
    return `<b>${esc(title)}</b><div class="small muted">${esc(parts.join(' · '))}</div>`;
  }
  function shortVal(v, key) {
    if (v === undefined) return '<i>(ausente)</i>';

            <div style="min-width:0;flex:1"><span class="badge ok">novo</span> ${a.suspectOf ? `<span class="badge warn">parece repetido de “${esc(a.suspectOf)}”</span>` : ''} ${a.wasDeleted ? '<span class="badge danger">foi excluído no app</span>' : ''}<div style="margin-top:6px">${describeRecord(key, a.item)}</div>

  // ---------- EXPORTAÇÃO ----------
  async function shareOrDownload(blob, filename) {
    const file = new File([blob], filename, { type: blob.type || 'application/octet-stream' });
    if (navigator.canShare && navigator.share) {
      let can = false; try { can = navigator.canShare({ files: [file] }); } catch (e) { can = false; }
      if (can) {
        try { await navigator.share({ files: [file], title: filename }); return 'shared'; }
        catch (e) { if (e.name === 'AbortError') return 'cancelled'; if (e.name === 'NotAllowedError') return 'needs-tap'; }
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; a.rel = 'noopener';

  async function deliver(blob, filename, onDone) {

      const sh = openSheet({ title: 'Arquivo pronto', body: `<p>O arquivo <b>${esc(filename)}</b> está pronto. Toque abaixo e escolha <b>Salvar em Arquivos</b>.</p>`, footHtml: `<button class="btn" data-go>${ic('down')} Salvar / compartilhar</button>` });
      sh.foot.querySelector('[data-go]').onclick = async () => { sh.close(); const r2 = await shareOrDownload(blob, filename); if (r2 !== 'cancelled' && r2 !== 'needs-tap') onDone(r2); };

  async function doExport(kind, srcDs, label) {
    const ds = srcDs || S.ds;
    const att = (ds.attachments_manifest || []).length;
    if (kind === 'json' && att && !srcDs) {
      const zip = await confirmDialog({ title: 'Comprovantes não vão no JSON', text: `Você tem ${att} comprovante(s) guardado(s) neste aparelho. O <b>JSON</b> leva só a lista deles, não as imagens.<br><br>Para um backup completo, use o <b>ZIP</b>. Para mandar ao ChatGPT, o JSON é o ideal.`, ok: 'Exportar ZIP completo', cancel: 'Só o JSON' });
      if (zip) kind = 'zip';
    }
    let text;
    try { text = JSON.stringify(await C.buildExport(ds, nowIso(), srcDs ? {} : { base: S.meta.export_base, previousExportAt: S.meta.last_export_at || S.meta.last_import_file_exported_at }), null, 2); }
    catch (e) { showError('Falha ao exportar', esc(e.message)); return; }
    const base = `cofre-financeiro_${stamp()}${label ? '_' + label : ''}`;
    let blob, name;
    if (kind === 'enc') {
      const pw = await promptPassword({ title: 'Senha do backup', confirm: true, text: '<b>Se você esquecer esta senha, o backup não poderá ser aberto por ninguém.</b> Não há recuperação. Anote num lugar seguro.' });
      if (!pw) return;
      toast('Criptografando…');
      blob = new Blob([await C.encryptText(text, pw)], { type: 'application/json' }); name = base + '_criptografado.json';
    } else if (kind === 'zip') {
      const files = [{ name: base + '.json', data: text }];
      const stored = await DB.listFiles();
      for (const m of ds.attachments_manifest || []) {
        const f = stored.find(x => x.id === m.id);
        if (f) files.push({ name: `comprovantes/${m.id}__${(m.filename || 'arquivo').replace(/[\\/:*?"<>|]/g, '_')}`, data: new Uint8Array(await f.blob.arrayBuffer()) });
      }
      blob = new Blob([Zip.createZip(files)], { type: 'application/zip' }); name = base + '_completo.zip';
    } else { blob = new Blob([text], { type: 'application/json' }); name = base + '.json'; }
    await deliver(blob, name, async () => {
      if (!srcDs) { await saveMeta({ last_export_at: nowIso(), last_export_name: name, dirty: false, export_base: C.makeBase(ds), base_source: 'exportação' }); render(); }
      toast(srcDs ? 'Cópia exportada' : 'Backup exportado. Guarde em dois lugares.');
    });
  }

  // ---------- restauração e integridade ----------
  async function restoreBackup(id) {

    if (!(await confirmDialog({ title: 'Restaurar esta cópia?', text: `Os dados voltarão ao estado de <b>${fdatetime(b.created_at)}</b> (${esc(b.reason || '')}).<br><br>Os dados atuais serão guardados antes numa nova cópia automática, então dá para desfazer.`, ok: 'Restaurar' }))) return;
    const ds2 = C.clone(b.data);
    await commit(ds2, { audit: { type: 'restore', description: `Restaurada cópia automática de ${fdatetime(b.created_at)} (${b.reason || ''})` }, backupReason: 'Antes de restaurar a cópia de ' + fdatetime(b.created_at), toast: 'Cópia restaurada' });

  async function integrityCheck() {
    const out = [];
    const ok = (t) => out.push(['ok', t]), warn = (t) => out.push(['warn', t]), bad = (t) => out.push(['bad', t]);
    const ds = S.ds;
    const v = C.validate(ds);
    v.errors.length ? v.errors.forEach(bad) : ok('Estrutura dos dados válida, sem IDs repetidos.');
    v.warnings.forEach(warn);
    try {
      const stored = await DB.get('current');
      C.stable(stored) === C.stable(ds) ? ok('O que está gravado no aparelho é idêntico ao que aparece na tela.') : bad('Diferença entre a tela e o armazenamento. Feche e abra o app.');
    } catch (e) { bad('Não foi possível ler o armazenamento: ' + e.message); }
    const txIds = new Set((ds.transactions || []).map(t => t.id));
    (ds.obligations || []).forEach(o => { if (o.paid_transaction_id && !txIds.has(o.paid_transaction_id)) warn(`Conta “${obligationTitle(o)}” aponta para um lançamento que não existe (${o.paid_transaction_id}).`); });
    const oblIds = new Set((ds.obligations || []).map(o => o.id));
    (ds.transactions || []).forEach(t => { if (t.obligation_id && !oblIds.has(t.obligation_id)) warn(`Lançamento “${t.description || t.id}” aponta para conta a pagar inexistente.`); });
    const files = await DB.listFiles();
    const man = ds.attachments_manifest || [];
    const missing = man.filter(m => !files.find(f => f.id === m.id));
    missing.length ? warn(`${missing.length} comprovante(s) listados mas sem arquivo neste aparelho (restaure com o ZIP completo).`) : ok(`Comprovantes: ${man.length} listado(s), todos presentes.`);
    const bal = C.computeBalances(ds);
    ok(`Saldos recalculados para ${bal.length} contas (${bal.filter(b => b.unknown).length} com saldo desconhecido).`);
    const backups = await DB.listBackups();
    ok(`${backups.length} cópia(s) automática(s) no aparelho.`);
    S.meta.last_export_at ? (S.meta.dirty ? warn('Há alterações ainda não exportadas.') : ok('Último backup externo está em dia.')) : warn('Nenhum backup externo foi exportado ainda.');
    openSheet({
      title: 'Verificação de integridade',
      body: `<div class="card"><div class="rows">${out.map(([k, t]) => `<div class="row-item"><div class="ico" style="color:${k === 'ok' ? 'var(--pos)' : (k === 'warn' ? 'var(--warn)' : 'var(--danger)')}">${ic(k === 'ok' ? 'check' : 'alert')}</div><div class="main"><div class="t" style="white-space:normal;font-weight:500">${esc(t)}</div></div></div>`).join('')}</div></div>`,
      footHtml: '<button class="btn secondary" data-close>Fechar</button>'
    });
  }

  // ---------- PIN ----------
  async function pinHash(pin, saltB64, iter) {
    const salt = saltB64 ? C.b64.dec(saltB64) : crypto.getRandomValues(new Uint8Array(16));
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, 256);
    return { salt: C.b64.enc(salt), hash: C.b64.enc(new Uint8Array(bits)), iter };
  }

    pd.busy = true;
    try {
      const rec = await persistTx(null, d, { via: 'Pergunte ao Cofre', toast: false });
      const b = C.computeBalances(S.ds).find(x => x.id === rec.account_id);
      const cr = C.computeCredit(S.ds).find(x => x.id === rec.account_id);
      pd.done = true;
      pd.doneText = `${TYPE_LABEL[rec.type]} de ${money(rec.amount, rec.currency)} em ${accountName(rec.account_id)} (${STATUS_LABEL[rec.status]}).` + (rec.status !== 'confirmado' ? ' Não altera saldo.' : (b && b.balance !== null ? ` Novo saldo: ${money(b.balance, b.currency)}.` : (cr ? ` Disponível no cartão: ${money(cr.available)}.` : '')));
      refreshDraft(pid);
      toast('Lançamento salvo', 'Exportar', () => doExport('json'));
    } finally { pd.busy = false; }
  }

  // ---------- DOCUMENTOS ----------
  const DOC_INFO = {
    statement: ['Extrato de conta', 'Movimentações com saldo inicial e final de uma conta ou de todas.', '🧾'],
    monthly: ['Relatório financeiro mensal', 'Resumo do mês: categorias, saldos, contas e lançamentos.', '📊'],
    family: ['Resumo familiar para compartilhar', 'Imagem bonita para o WhatsApp, com o essencial.', '👨‍👩‍👧'],
    debts: ['Dívidas e vencimentos', 'Contas em aberto, cartão e recorrentes.', '📌'],
    categories: ['Despesas por categoria', 'Quanto foi para cada categoria no período.', '🏷️'],
    history: ['Histórico completo', 'Todos os lançamentos, histórico anterior e alterações.', '🗂️']
  };
  const FORMAT_LABEL = { pdf: 'PDF', png: 'Imagem PNG', xlsx: 'Excel', csv: 'CSV', json: 'JSON' };
  const FORMAT_MIME = { pdf: 'application/pdf', png: 'image/png', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', csv: 'text/csv', json: 'application/json' };
  function buildModel(kind, params) {
    const B = Docs.BUILDERS, ds = S.ds;
    if (kind === 'statement') return B.statement(ds, params);
    if (kind === 'monthly') return B.monthly(ds, params.month);
    if (kind === 'family') return B.family(ds, params.month);
    if (kind === 'debts') return B.debts(ds);
    if (kind === 'categories') return B.categories(ds, params.start, params.end, params.label);
    return B.history(ds);
  }
  async function makeDoc(kind, params, format) {
    const m = buildModel(kind, params || {});
    if (!m.formats.includes(format)) format = m.formats[0];
    let data;
    if (format === 'pdf') data = Docs.renderPdf(m);
    else if (format === 'xlsx') data = Docs.renderXlsx(m);
    else if (format === 'csv') data = Docs.renderCsv(m);
    else if (format === 'json') data = Docs.renderJson(m);
    else data = await Docs.renderPng(m);
    const blob = data instanceof Blob ? data : new Blob([data], { type: FORMAT_MIME[format] });
    return { blob, name: m.file + '.' + format, model: m, format };
  }
  function pageDocs() {
    return backBar('Mais', 'mais') + `<h1 class="page-title">Gerar documento</h1><p class="small muted">Tudo é gerado no próprio aparelho, sem internet. Cada documento se identifica como registro financeiro pessoal, não documento bancário oficial.</p>
      <div class="card"><div class="rows">${Object.entries(DOC_INFO).map(([k, [t, d, e]]) => {
        const fm = { statement: ['pdf', 'xlsx', 'csv', 'json'], monthly: ['pdf', 'png', 'xlsx', 'csv'], family: ['png', 'pdf'], debts: ['pdf', 'png', 'xlsx', 'csv'], categories: ['pdf', 'png', 'xlsx', 'csv'], history: ['pdf', 'xlsx', 'csv', 'json'] }[k];
        return `<button class="row-item" data-act="doc-open-sheet" data-k="${k}"><div class="ico">${e}</div><div class="main"><div class="t">${esc(t)}</div><div class="s" style="white-space:normal">${esc(d)}</div><div style="margin-top:4px">${fm.map(f => `<span class="badge">${FORMAT_LABEL[f]}</span>`).join(' ')}</div></div>${ic('right', 'chev')}</button>`;
      }).join('')}</div></div>`;
  }
  function openDocSheet(kind, preset) {
    const t = todayStr(); const [title, desc] = DOC_INFO[kind];
    const st = Object.assign({ account: '', pkind: 'mes', month: t.slice(0, 7), year: t.slice(0, 4), start: C.dateOnly(S.ds.snapshot_date) || t, end: t }, preset || {});
    if (preset && preset.start && preset.end && !preset.month) { st.pkind = 'personalizado'; }
    if (preset && preset.label && /^(janeiro|fevereiro|março|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro) de \d{4}$/.test(preset.label)) { st.pkind = 'mes'; st.month = preset.start.slice(0, 7); }
    const sh = openSheet({ title, full: false, sticky: true });
    const needsPeriod = kind === 'statement' || kind === 'categories', needsMonth = kind === 'monthly' || kind === 'family';
    function params() {
      if (needsMonth) return { month: st.month };
      let p;
      if (st.pkind === 'mes') p = Reports.periodRange('mes', st.month + '-01');
      else if (st.pkind === 'ano') p = Reports.periodRange('ano', st.year + '-01-01');
      else if (st.pkind === 'tudo') p = Reports.periodRange('tudo', t);
      else p = Reports.periodRange('personalizado', st.start, st.end);
      return Object.assign({}, preset || {}, { account: st.account, start: p.start, end: p.end, label: p.label });
    }
    function draw() {
      const fm = buildModel(kind, params()).formats;
      sh.body.innerHTML = `<p class="small muted">${esc(desc)}</p>
        ${kind === 'statement' ? `<div class="field"><label>Conta</label><select class="input" id="d-acc"><option value="">Todas as contas</option>${allAccountOptions(st.account)}</select></div>` : ''}
        ${needsMonth ? `<div class="field"><label>Mês</label><select class="input" id="d-month">${monthsAvailable().map(m => `<option value="${m}" ${st.month === m ? 'selected' : ''}>${monthLabel(m)}</option>`).join('')}</select></div>` : ''}
        ${needsPeriod ? `<div class="seg">${[['mes', 'Mês'], ['ano', 'Ano'], ['personalizado', 'Período'], ['tudo', 'Tudo']].map(([k, l]) => `<button class="${st.pkind === k ? 'on' : ''}" data-pk="${k}">${l}</button>`).join('')}</div>
          ${st.pkind === 'mes' ? `<select class="input" id="d-month" style="margin-bottom:12px">${monthsAvailable().map(m => `<option value="${m}" ${st.month === m ? 'selected' : ''}>${monthLabel(m)}</option>`).join('')}</select>` : ''}
          ${st.pkind === 'ano' ? `<select class="input" id="d-year" style="margin-bottom:12px">${Array.from(new Set(monthsAvailable().map(m => m.slice(0, 4)))).map(y => `<option ${st.year === y ? 'selected' : ''}>${y}</option>`).join('')}</select>` : ''}
          ${st.pkind === 'personalizado' ? `<div class="two" style="margin-bottom:12px"><input class="input" type="date" id="d-start" value="${esc(st.start)}"><input class="input" type="date" id="d-end" value="${esc(st.end)}"></div>` : ''}` : ''}
        <div class="lbl" style="margin-top:4px">Formato</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${fm.map(f => `<button class="btn ${f === fm[0] ? '' : 'secondary'}" data-fmt="${f}">${ic(f === 'png' ? 'image' : 'down')} ${FORMAT_LABEL[f]}</button>`).join('')}</div>
        <p class="help" style="margin-top:10px">PDF para guardar ou imprimir · Imagem para o WhatsApp · Excel e CSV para planilhas · JSON para o ChatGPT.</p>`;
      const g = id => sh.body.querySelector(id);
      if (g('#d-acc')) g('#d-acc').onchange = e => { st.account = e.target.value; };
      if (g('#d-month')) g('#d-month').onchange = e => { st.month = e.target.value; };
      if (g('#d-year')) g('#d-year').onchange = e => { st.year = e.target.value; };
      if (g('#d-start')) g('#d-start').onchange = e => { st.start = e.target.value; };
      if (g('#d-end')) g('#d-end').onchange = e => { st.end = e.target.value; };
      sh.body.querySelectorAll('[data-pk]').forEach(b => b.onclick = () => { st.pkind = b.dataset.pk; draw(); });
      sh.body.querySelectorAll('[data-fmt]').forEach(b => b.onclick = async () => {
        b.disabled = true; const old = b.innerHTML; b.textContent = 'Gerando…';
        try { const res = await makeDoc(kind, params(), b.dataset.fmt); sh.close(); readyDoc(res); }
        catch (e) { b.disabled = false; b.innerHTML = old; showError('Não foi possível gerar', esc(e.message)); }
      });
    }
    draw();
  }
  function readyDoc(res) {
    const url = URL.createObjectURL(res.blob);
    const m = res.model;
    const sh = openSheet({ title: 'Documento pronto', full: res.format === 'png',
      body: `<div class="card"><b>${esc(m.title)}</b><div class="small muted">${esc(m.subtitle || '')}</div><div class="tiny muted" style="margin-top:4px">${esc(res.name)} · ${(res.blob.size / 1024).toFixed(0)} KB</div></div>
        ${res.format === 'png' ? `<img src="${url}" alt="Prévia da imagem" style="width:100%;border-radius:14px;box-shadow:var(--shadow)">` : ''}
        ${res.format === 'pdf' ? `<div class="notice info">${ic('info')}<div class="ntext">Toque em <b>Abrir</b> para ver o PDF, ou em <b>Salvar / compartilhar</b> para mandar para Arquivos, WhatsApp, e-mail ou impressão.</div></div>` : ''}
        <p class="tiny muted">${esc(Docs.DISCLAIMER)}</p>`,
      footHtml: `<button class="btn" data-save>${ic('down')} Salvar / compartilhar</button>${res.format === 'pdf' || res.format === 'png' ? '<button class="btn secondary" data-open>Abrir</button>' : ''}`,
      onClose: () => setTimeout(() => URL.revokeObjectURL(url), 60000) });
    sh.foot.querySelector('[data-save]').onclick = () => deliver(res.blob, res.name, () => toast('Documento salvo'));
    const op = sh.foot.querySelector('[data-open]'); if (op) op.onclick = () => { window.open(url, '_blank', 'noopener'); };
  }

  // ---------- RELATÓRIOS ----------
  function pageRelatorios() {
    const t = todayStr(); const r = S.rep = S.rep || { kind: 'mes', ref: t, start: C.dateOnly(S.ds.snapshot_date) || t, end: t };
    const p = r.kind === 'personalizado' ? Reports.periodRange('personalizado', r.start, r.end) : Reports.periodRange(r.kind, r.ref);
    const ds = S.ds, txs = Reports.filterTx(ds, { start: p.start, end: p.end }), tot = Reports.totals(ds, txs);
    const c = tot.confirmed.BRL || { in: 0, out: 0 }, f = tot.forecast.BRL || { in: 0, out: 0 }, eur = tot.confirmed.EUR;
    const cat = Docs.categoryRows(ds, p.start, p.end);
    const ob = Reports.obligationsIn(ds, p.start, p.end);
    const max = Math.max(1, ...cat.rows.map(x => x.total));
    let h = backBar('Mais', 'mais') + `<h1 class="page-title">Relatórios</h1>
      <div class="seg">${[['dia', 'Dia'], ['semana', 'Semana'], ['mes', 'Mês'], ['ano', 'Ano'], ['personalizado', 'Período']].map(([k, l]) => `<button class="${r.kind === k ? 'on' : ''}" data-act="rep-kind" data-v="${k}">${l}</button>`).join('')}</div>
      ${r.kind === 'personalizado' ? `<div class="two" style="margin-bottom:12px"><input class="input" type="date" data-change="rep" data-k="start" value="${esc(r.start)}"><input class="input" type="date" data-change="rep" data-k="end" value="${esc(r.end)}"></div>`
        : `<div class="cal-head card" style="padding:10px"><button class="icon-btn" data-act="rep-nav" data-d="-1" aria-label="Anterior">${ic('left')}</button><b>${esc(p.label.charAt(0).toUpperCase() + p.label.slice(1))}</b><button class="icon-btn" data-act="rep-nav" data-d="1" aria-label="Próximo">${ic('right')}</button></div>`}
      <div class="stat-grid">
        <div class="stat"><div class="k">Entradas confirmadas</div><div class="v" style="color:var(--pos)">${M(c.in)}</div>${tot.loans ? `<div class="s">inclui ${esc(money(tot.loans))} de empréstimo</div>` : ''}</div>
        <div class="stat"><div class="k">Despesas confirmadas</div><div class="v">${M(c.out)}</div>${tot.credit ? `<div class="s">${esc(money(tot.credit))} no crédito</div>` : ''}</div>
        <div class="stat"><div class="k">Previsto · entradas</div><div class="v" style="color:var(--ink-3)">${M(f.in)}</div><div class="s">não aplicado</div></div>
        <div class="stat"><div class="k">Previsto · saídas</div><div class="v" style="color:var(--ink-3)">${M(f.out)}</div><div class="s">não aplicado</div></div>
      </div>
      ${eur && (eur.in || eur.out) ? `<p class="small muted">Em euros: +${M(eur.in, 'EUR')} / −${M(eur.out, 'EUR')} (separado dos reais).</p>` : ''}
      ${tot.internal ? `<p class="small muted">${M(tot.internal)} em transferências entre contas e pagamentos de fatura — fora dos totais.</p>` : ''}
      <div class="section-title"><span>Despesas por categoria</span><span class="tiny muted">${esc(money(C.round2(cat.histTotal + cat.afterTotal)))}</span></div>
      <div class="card">${cat.rows.length ? cat.rows.map(x => `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${catIcon(x.cat, '•')} ${esc(x.cat)}</span><b class="money">${esc(money(x.total))}</b></div><div class="progress"><div style="width:${x.total / max * 100}%"></div></div>${x.hist && x.after ? `<div class="tiny muted">resumo ${esc(money(x.hist))} + lançamentos ${esc(money(x.after))}</div>` : (x.hist ? '<div class="tiny muted">do resumo histórico</div>' : '')}</div>`).join('') : '<div class="muted small">Nenhuma despesa no período.</div>'}
      ${cat.notes.map(n => `<div class="tiny muted" style="margin-top:6px">${esc(n)}</div>`).join('')}</div>
      <div class="section-title"><span>Contas do período</span></div>
      <div class="card"><dl class="kv"><dt>Pagas</dt><dd>${ob.paid.length} · ${M(ob.paid.reduce((s, o) => s + (C.amountOf(o) || 0), 0))}</dd><dt>Em aberto</dt><dd>${ob.open.length} · ${M(ob.open.reduce((s, o) => s + (C.amountOf(o) || 0), 0))}</dd><dt>Sem data (todas)</dt><dd>${ob.undated.length}</dd></dl></div>
      ${Object.keys(tot.byAccount).length ? `<div class="section-title"><span>Despesas por conta</span></div><div class="card"><dl class="kv">${Object.entries(tot.byAccount).map(([k, v]) => `<dt>${esc(accountName(k))}</dt><dd>${M(C.round2(v))}</dd>`).join('')}</dl></div>` : ''}
      <button class="btn" data-act="rep-doc">${ic('down')} Gerar documento deste período</button>
      <p class="tiny muted" style="margin-top:10px">Os totais atualizam na hora a cada lançamento. Antes da data de corte (${fdate(ds.snapshot_date)}) só existem os resumos informados no backup.</p>`;
    return h;
  }

  // ---------- eventos ----------
  const TABS = { inicio: viewInicio, extrato: viewExtrato, pergunte: viewPergunte, contas: viewContas, mais: viewMais };
  const PAGES = { backup: pageBackup, planejamento: pagePlanejamento, conciliacao: pageConciliacao, auditoria: pageAuditoria, dados: pageDados, seguranca: pageSeguranca, sobre: pageSobre,
    docs: pageDocs, relatorios: pageRelatorios, agenda: () => backBar('Mais', 'mais') + viewAgenda() };
  const ACTIONS = {
    tab: el => go(el.dataset.tab),
    page: el => go(el.dataset.tab, el.dataset.page),
    import: () => startImport(),
    export: el => doExport(el.dataset.kind),
    integrity: () => integrityCheck(),
    'tx-new': () => openTxForm(null),
    'tx-edit': el => openTxDetail(el.dataset.id),
    card: el => openCard(el.dataset.id),
    'ext-set': el => { S.ext = S.ext || extDefaults(); S.ext[el.dataset.k] = el.dataset.v; render(); },
    'ext-download': () => downloadStatement(),
    'ask-suggest': el => handleAsk(el.dataset.q),
    'ask-confirm': el => askConfirm(el.dataset.pid, el.dataset.snap),
    'ask-edit': el => { const pd = S.pending[el.dataset.pid]; if (!pd) return; pd.cancelled = true; refreshDraft(el.dataset.pid); openTxForm(null, Object.assign({}, pd.draft, { amount: pd.draft.amount ? String(pd.draft.amount).replace('.', ',') : '' })); },
    'ask-cancel': el => { const pd = S.pending[el.dataset.pid]; if (pd && !pd.done) { pd.cancelled = true; refreshDraft(el.dataset.pid); } },
    'ask-acc': el => { const pd = S.pending[el.dataset.pid]; if (!pd) return; pd.draft.account_id = el.dataset.acc; refreshDraft(el.dataset.pid); },
    'ask-action': el => { const x = JSON.parse(el.dataset.x); if (x.act === 'statement') { const p = x.params; S.ext = Object.assign(extDefaults(), { pkind: 'personalizado', start: p.start, end: p.end, category: p.category || '', text: p.text || '' }); go('extrato'); } else if (x.act === 'doc') openDocSheet(x.params.doc, x.params); },
    'doc-save': el => { const r = (S.docs || {})[el.dataset.id]; if (r) deliver(r.blob, r.name, () => toast('Documento salvo')); },
    'doc-open': el => { const r = (S.docs || {})[el.dataset.id]; if (r) window.open(URL.createObjectURL(r.blob), '_blank', 'noopener'); },
    'doc-open-sheet': el => openDocSheet(el.dataset.k),
    'rep-kind': el => { S.rep.kind = el.dataset.v; render(); },
    'rep-nav': el => { const r = S.rep, d = Number(el.dataset.d); const base = new Date(r.ref + 'T12:00:00');
      if (r.kind === 'dia') base.setDate(base.getDate() + d); else if (r.kind === 'semana') base.setDate(base.getDate() + 7 * d); else if (r.kind === 'mes') base.setMonth(base.getMonth() + d, 1); else base.setFullYear(base.getFullYear() + d);
      r.ref = `${base.getFullYear()}-${p2(base.getMonth() + 1)}-${p2(base.getDate())}`; render(); },
    'rep-doc': () => { const r = S.rep; const p = r.kind === 'personalizado' ? Reports.periodRange('personalizado', r.start, r.end) : Reports.periodRange(r.kind, r.ref); if (r.kind === 'mes') openDocSheet('monthly', { month: p.month }); else openDocSheet('categories', { start: p.start, end: p.end, label: p.label }); },
    obligation: el => openObligation(el.dataset.id),
    account: el => openAccount(el.dataset.id),
    raw: el => openRaw(el.dataset.key, el.dataset.id),
    light: () => editLight(),
    filter: el => { S.filters[el.dataset.k] = el.dataset.v; render(); },
    'agenda-view': el => { S.agenda.view = el.dataset.v; render(); },
    'cal-nav': el => { const [y, m] = S.agenda.month.split('-').map(Number); const d = new Date(y, m - 1 + Number(el.dataset.d), 1); S.agenda.month = `${d.getFullYear()}-${p2(d.getMonth() + 1)}`; S.agenda.sel = null; render(); },
    'cal-day': el => { S.agenda.sel = S.agenda.sel === el.dataset.d ? null : el.dataset.d; render(); },
    'toggle-hide': async () => { await saveMeta({ hide_values: !S.meta.hide_values }); render(); },
    'backup-restore': el => restoreBackup(el.dataset.id),
    'backup-export': async el => { const b = await DB.getBackup(Number(el.dataset.id)); if (b) doExport('json', b.data, 'copia-' + b.created_at.slice(0, 16).replace(/[^0-9]/g, '')); },
    'pin-set': () => setPin(),
    'pin-remove': () => removePin(),
    wipe: () => wipe(false)
  };
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const sheet = el.closest('.sheet-wrap');
    if (sheet && ['tx-edit', 'obligation', 'raw'].includes(el.dataset.act)) { const s = S.sheets.find(x => x.el === sheet); if (s) s.close(); }
    const fn = ACTIONS[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('change', e => {
    const el = e.target.closest('[data-change]');
    if (el && el.dataset.change === 'filter') { S.filters[el.dataset.k] = el.value; render(); }
    if (el && el.dataset.change === 'ext') { S.ext = S.ext || extDefaults(); S.ext[el.dataset.k] = el.value; render(); }
    if (el && el.dataset.change === 'rep') { S.rep[el.dataset.k] = el.value; render(); }
  });
  let searchTimer;
  document.addEventListener('input', e => {
    if (e.target && e.target.id === 'ext-search') { S.ext.text = e.target.value; clearTimeout(searchTimer); searchTimer = setTimeout(() => { const r = document.getElementById('ext-results'); if (r) r.innerHTML = renderExtResults(); }, 150); }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) S.hiddenAt = Date.now();
    else if (S.meta.pin && S.ds && S.hiddenAt && Date.now() - S.hiddenAt > AUTOLOCK_MS) { S.locked = true; S.sheets.slice().forEach(s => s.close()); render(); }
  });
  window.addEventListener('online', () => { if (!S.page && S.tab === 'inicio') render(); });
  window.addEventListener('offline', () => { if (!S.page && S.tab === 'inicio') render(); });

  // ---------- inicialização ----------
  async function init() {
    try {
      S.ds = (await DB.get('current')) || null;
      S.meta = (await DB.get('meta')) || {};
    } catch (e) {
      app.innerHTML = `<div class="notice danger" style="margin-top:40px">${ic('alert')}<div class="ntext"><b>Não foi possível abrir o armazenamento local.</b> No iPhone, verifique se não está em navegação privada. Detalhe: ${esc(e.message)}</div></div>`;
      return;
    }
    if (S.meta.pin && S.ds) S.locked = true;
    render();
    try { if (navigator.storage && navigator.storage.persist) S.persisted = await navigator.storage.persist(); } catch (e) { /* sem suporte */ }
    await storageInfo();
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (window.__userUpdate && !refreshing) { refreshing = true; location.reload(); } });
      navigator.serviceWorker.register('sw.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing; if (!nw) return;
          nw.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('Nova versão do app disponível', 'Atualizar', () => { window.__userUpdate = true; nw.postMessage('skipWaiting'); }, 15000);
          });
        });
      }).catch(() => { /* sem service worker: app funciona, mas não offline */ });
    }
  }
  window.__cofre = { S, C }; // para depuração
  init();
})();

</script>
</body>
</html>
