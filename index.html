      const st = C.norm(b.status);
      const badge = b.unknown ? '<span class="badge warn">saldo desconhecido</span>' : (b.protected ? `<span class="badge gold">${esc(ACCOUNT_STATUS[st] || humanize(b.status))}</span>` : `<span class="badge">${esc(ACCOUNT_STATUS[st] || humanize(b.status))}</span>`);
      const sub = b.unknown ? 'Valor não informado' : (b.txCount ? `${b.movements >= 0 ? '+' : '−'}${money(Math.abs(b.movements), b.currency)} desde o corte` : `corte ${fdate(b.cutoff).slice(0, 5)}`);
      h += `<button class="row-item" data-act="account" data-id="${esc(b.id)}"><div class="ico">${b.currency === 'EUR' ? '€' : (b.protected ? '🔒' : '🏦')}</div>
        <div class="main"><div class="t">${esc(b.name)}</div><div class="s">${badge} <span class="${S.meta.hide_values ? 'money' : ''}">${esc(sub)}</span></div></div>
        <div class="amt">${b.balance === null ? '<span class="muted">—</span>' : M(b.balance, b.currency)}</div></button>`;
    }
    h += `</div></div>`;

    // crédito
    if (sum.credit.length || ds.cashback) {
      h += `<div class="section-title"><span>Crédito e cashback</span><span class="tiny muted">não é dinheiro em caixa</span></div><div class="card"><div class="rows">`;
      for (const cf of sum.credit) {
        const raw = cf.raw;
        h += `<button class="row-item" data-act="raw" data-key="credit_facilities" data-id="${esc(cf.id)}"><div class="ico">💳</div><div class="main"><div class="t">${esc(cf.name === cf.id ? humanize(cf.id) : cf.name)}</div>
          <div class="s">Limite ${money(cf.limit)} · disponível estimado ${raw.notes ? '(não confirmado)' : ''}</div></div><div class="amt">${M(cf.available)}${cf.used ? `<div class="s">usado após corte ${money(cf.used)}</div>` : ''}</div></button>`;
      }
      if (ds.cashback && typeof ds.cashback === 'object') {
        const cb = ds.cashback;
        h += `<button class="row-item" data-act="raw" data-key="cashback"><div class="ico">🪙</div><div class="main"><div class="t">Cashback InfinitePay</div><div class="s">${cb.redeemed ? 'Resgatado' : 'Pendente · não somado ao saldo'}</div></div><div class="amt">${M(C.num(cb.infinitepay_accrued_brl))}</div></button>`;
      }
      h += `</div></div>`;
    }

    // vencimentos
    const next = sum.upcoming.slice(0, 4);
    h += `<div class="section-title"><span>Próximos vencimentos</span><button class="link" data-act="tab" data-tab="contas">Ver todos</button></div><div class="card">`;
    if (!next.length && !sum.overdue.length) h += `<div class="muted small">Nenhuma conta com data definida.</div>`;
    else h += `<div class="rows">${[...sum.overdue, ...next].map(o => obligationRow(o, today)).join('')}</div>`;
    const undated = sum.openObligations.filter(o => !o.due_date).length;
    if (undated) h += `<div class="small muted" style="margin-top:8px">+ ${undated} conta(s) sem data de vencimento definida.</div>`;
    h += `</div>`;

    h += `<div class="stat-grid">
      <div class="stat"><div class="k">A pagar · pendente</div><div class="v">${M(sum.openPending)}</div><div class="s">já devido / em aberto</div></div>
      <div class="stat"><div class="k">A pagar · planejado</div><div class="v">${M(sum.openPlanned)}</div><div class="s">previsto, ainda não devido</div></div>
    </div>`;

    // receitas previstas
    const inc = (ds.income_forecasts || []).filter(x => x && typeof x === 'object');
    if (inc.length) {
      h += `<div class="section-title"><span>Receitas previstas</span><span class="tiny muted">não somadas ao saldo</span></div><div class="card"><div class="rows">`;
      h += inc.slice(0, 5).map(r => `<button class="row-item" data-act="raw" data-key="income_forecasts" data-id="${esc(r.id)}"><div class="ico">💼</div><div class="main"><div class="t">${esc(r.name || humanize(r.id))}</div><div class="s">${statusBadge(r.status)} ${esc(incomeWhen(r))}</div></div><div class="amt forecast">${M(C.amountOf(r))}</div></button>`).join('');
      h += `</div>${inc.length > 5 ? `<button class="link" style="margin-top:8px" data-act="page" data-tab="mais" data-page="planejamento">Ver todas (${inc.length})</button>` : ''}</div>`;
    }

    // gráfico
    h += expensesChart(ds);

    // qualidade dos dados
    if (ds.source || (ds.reconciliation_notes || []).length) {
      h += `<div class="notice info">${ic('info')}<div class="ntext"><b>Qualidade dos dados:</b> ${esc(ds.source || 'ver notas')}. <button class="link" data-act="page" data-tab="mais" data-page="conciliacao">Ver notas de conciliação</button></div></div>`;
    }
    h += `<p class="tiny muted" style="text-align:center">${navigator.onLine ? 'Conectado' : '✈︎ Sem internet — funcionando offline'} · Último backup: ${lastExp ? fdatetime(lastExp) : 'nunca'}</p>`;
    return h;
  }
  function incomeWhen(r) {
    if (r.date) return fdate(r.date);
    if (r.expected_day) return 'todo dia ' + r.expected_day + (r.frequency ? ' (' + r.frequency + ')' : '');
    if (r.period) return monthLabel(r.period);
    return '';
  }
  function obligationRow(o, today) {
    const over = o.due_date && o.due_date < today && C.isObligationOpen(o);
    return `<button class="row-item" data-act="obligation" data-id="${esc(o.id)}"><div class="ico">${catIcon(guessCategory(o), '📄')}</div>
      <div class="main"><div class="t">${esc(obligationTitle(o))}</div><div class="s">${statusBadge(o.status)} ${o.due_date ? (over ? '<b style="color:var(--danger)">venceu ' + fdate(o.due_date) + '</b>' : 'vence ' + fdate(o.due_date)) : 'sem vencimento definido'}</div></div>
      <div class="amt ${/planejad/.test(C.norm(o.status)) ? 'forecast' : ''}">${M(C.amountOf(o), C.currencyOf(o, S.ds))}</div></button>`;
  }
  function expensesChart(ds) {
    const data = C.monthlyExpenses(ds).slice(-6);
    if (!data.length) return '';
    const max = Math.max(...data.map(d => d.confirmed + d.historical), 1);
    let h = `<div class="section-title"><span>Despesas por mês</span></div><div class="card"><div class="bars" role="img" aria-label="Gráfico de despesas por mês">`;
    for (const d of data) {
      const tot = d.confirmed + d.historical;
      h += `<div class="bar-col"><div class="bv money">${esc(money(tot).replace(/\s/g, ' ').replace(',00', ''))}</div>
        ${d.historical ? `<div class="bar hist" style="height:${Math.max(3, d.historical / max * 100)}%" title="resumo histórico"></div>` : ''}
        ${d.confirmed ? `<div class="bar" style="height:${Math.max(3, d.confirmed / max * 100)}%"></div>` : ''}
        <div class="bl">${monthLabel(d.month, true)}</div></div>`;
    }
    h += `</div><div class="tiny muted" style="margin-top:10px;display:flex;gap:14px;flex-wrap:wrap"><span><span class="dot" style="display:inline-block;background:var(--accent)"></span> lançamentos confirmados</span><span><span class="dot" style="display:inline-block;border:1.5px solid var(--ink-3)"></span> resumo histórico (informativo)</span></div></div>`;
    return h;
  }

  // ---------- LANÇAMENTOS ----------
  function viewLancamentos() {
    const ds = S.ds, f = S.filters;
    let txs = (ds.transactions || []).filter(t => t && typeof t === 'object');
    const months = Array.from(new Set(txs.map(t => (C.dateOnly(t.date) || '').slice(0, 7)).filter(Boolean))).sort().reverse();
    if (f.status === 'confirmados') txs = txs.filter(t => C.txStatus(t) === 'confirmado');
    if (f.status === 'previstos') txs = txs.filter(t => C.txStatus(t) !== 'confirmado');
    if (f.account) txs = txs.filter(t => t.account_id === f.account || t.to_account_id === f.account);
    if (f.month) txs = txs.filter(t => String(t.date || '').startsWith(f.month));
    txs.sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.created_at || '').localeCompare(String(a.created_at || '')));
    let out = 0, inn = 0;
    txs.forEach(t => { if (C.txStatus(t) !== 'confirmado') return; const ty = C.txType(t); if (ty === 'despesa') out += C.num(t.amount) || 0; if (ty === 'receita') inn += C.num(t.amount) || 0; });

    let h = `<h1 class="page-title">Lançamentos</h1>
      <div class="chips" role="group" aria-label="Filtrar por status">
        ${[['todos', 'Todos'], ['confirmados', 'Confirmados'], ['previstos', 'Previstos']].map(([k, l]) => `<button class="chip ${f.status === k ? 'on' : ''}" data-act="filter" data-k="status" data-v="${k}">${l}</button>`).join('')}
      </div>
      <div class="two" style="margin-bottom:12px">
        <select class="input" data-change="filter" data-k="account" aria-label="Conta"><option value="">Todas as contas</option>${allAccountOptions(f.account)}</select>
        <select class="input" data-change="filter" data-k="month" aria-label="Mês"><option value="">Todos os meses</option>${months.map(m => `<option value="${m}" ${f.month === m ? 'selected' : ''}>${monthLabel(m)}</option>`).join('')}</select>
      </div>`;
    if (txs.length) h += `<div class="stat-grid"><div class="stat"><div class="k">Saídas confirmadas</div><div class="v">${M(out)}</div></div><div class="stat"><div class="k">Entradas confirmadas</div><div class="v" style="color:var(--pos)">${M(inn)}</div></div></div>`;
    if (!txs.length) {
      h += `<div class="card empty"><div class="e-ico">🧾</div><div><b>Nenhum lançamento ${(ds.transactions || []).length ? 'com esses filtros' : 'depois do corte de ' + fdate(ds.snapshot_date)}</b></div>
        <div class="small" style="margin-top:6px">Gastos e receitas anteriores ao corte já estão dentro do saldo de corte e aparecem abaixo, só para consulta.</div></div>`;
    } else {
      let lastDate = null;
      h += `<div class="card" style="padding-top:6px"><div class="rows">`;
      for (const t of txs) {
        const d = C.dateOnly(t.date);
        if (d !== lastDate) { h += `<div class="tiny muted" style="padding:10px 0 2px;font-weight:650">${fdate(d)}</div>`; lastDate = d; }
        h += txRow(t);
      }
      h += `</div></div>`;
    }
    h += historicalSection(ds);
    return h;
  }
  function txRow(t) {
    const ty = C.txType(t), st = C.txStatus(t);
    const amt = C.num(t.amount), cur = t.currency || 'BRL';
    const conf = st === 'confirmado';
    const sign = ty === 'despesa' ? '−' : (ty === 'receita' ? '+' : '');
    const cls = !conf ? 'forecast' : (ty === 'receita' ? 'pos' : 'neg');
    const where = ty === 'transferencia' ? `${accountName(t.account_id)} → ${accountName(t.to_account_id)}` : accountName(t.account_id);
    return `<button class="row-item" data-act="tx-edit" data-id="${esc(t.id)}"><div class="ico">${ty === 'transferencia' ? '⇄' : (ty === 'receita' ? '💰' : catIcon(t.category, '•'))}</div>
      <div class="main"><div class="t">${esc(t.description || t.category || TYPE_LABEL[ty] || 'Lançamento')}</div>
      <div class="s">${!conf ? statusBadge(t.status) + ' ' : ''}${ty === 'provisao' ? '<span class="badge plan">provisão</span> ' : ''}${esc(where)}${t.receipt_id ? ' · 📎' : ''}</div></div>
      <div class="amt ${cls}"><span class="money">${sign}${esc(money(Math.abs(amt), cur))}</span></div></button>`;
  }
  function historicalSection(ds) {
    const rides = Array.isArray(ds.ride_history) ? ds.ride_history : [];
    const known = Array.isArray(ds.known_paid_october) ? ds.known_paid_october : [];
    if (!rides.length && !known.length) return '';
    let h = `<details class="card fold"><summary>Histórico já incluído no saldo de corte</summary>
      <p class="small muted">Somente consulta. Estes valores já estão refletidos no saldo de ${fdate(ds.snapshot_date)} e <b>não</b> são descontados de novo.</p>`;
    if (known.length) {
      const tot = C.round2(known.reduce((s, x) => s + (C.amountOf(x) || 0), 0));
      h += `<div class="lbl" style="margin-top:12px">Pagos conhecidos de outubro (${known.length}) · ${M(tot)}</div><div class="rows">` + known.map(k => `<div class="row-item"><div class="ico">${catIcon(k.description, '✓')}</div><div class="main"><div class="t">${esc(k.description || '')}</div>${k.paid_by ? `<div class="s">pago por ${esc(k.paid_by)}</div>` : ''}</div><div class="amt muted">${M(C.amountOf(k))}</div></div>`).join('') + `</div>`;
    }
    if (rides.length) {
      h += `<div class="lbl" style="margin-top:14px">Corridas (${rides.length})</div><div class="rows">` + rides.map(r => `<div class="row-item"><div class="ico">🛵</div><div class="main"><div class="t">${esc(humanize(r.mode || 'corrida'))}${r.reason ? ' · ' + esc(r.reason) : ''}</div><div class="s">${fdate(r.date)}${r.typical === false ? ' · atípica' : ''}</div></div><div class="amt muted">${M(C.amountOf(r))}</div></div>`).join('') + `</div>`;
    }
    return h + `</details>`;
  }
  function allAccountOptions(sel) {
    const acc = (S.ds.accounts || []).map(a => `<option value="${esc(a.id)}" ${sel === a.id ? 'selected' : ''}>${esc(a.name || a.id)} (${esc(a.currency || 'BRL')})</option>`).join('');
    const cr = (S.ds.credit_facilities || []).map(c => `<option value="${esc(c.id)}" ${sel === c.id ? 'selected' : ''}>${esc(accountName(c.id))}</option>`).join('');
    return `<optgroup label="Contas">${acc}</optgroup>` + (cr ? `<optgroup label="Crédito (não é saldo)">${cr}</optgroup>` : '');
  }

  // ---------- formulário de lançamento ----------
  function openTxForm(existing, preset) {
    const ds = S.ds;
    const e = existing || {};
    const d = Object.assign({
      type: C.txType(e) || 'despesa', amount: e.amount != null ? String(e.amount).replace('.', ',') : '', date: C.dateOnly(e.date) || todayStr(),
      account_id: e.account_id || ((ds.accounts || [])[0] || {}).id || '', to_account_id: e.to_account_id || '', amount_to: e.amount_to != null ? String(e.amount_to).replace('.', ',') : '',
      category: e.category || '', subcategory: e.subcategory || '', description: e.description || '', status: C.txStatus(e) || 'confirmado',
      origin: e.origin || 'usuario', notes: e.notes || '', tags: Array.isArray(e.tags) ? e.tags.join(', ') : (e.tags || ''), obligation_id: e.obligation_id || '',
      after_snapshot: e.after_snapshot === true ? true : (existing && C.dateOnly(e.date) ? (e.after_snapshot === false ? false : null) : null), file: null
    }, preset || {});
    if (existing && d.after_snapshot === null && cutoffFor(d.account_id) === d.date) d.after_snapshot = e.after_snapshot === true;
    const sh = openSheet({ title: existing ? 'Editar lançamento' : 'Novo lançamento', full: true, sticky: true });
    let err = '';
    function draw() {
      const cats = C.CATEGORIES.slice(); if (d.category && !cats.includes(d.category)) cats.unshift(d.category);
      const cutoff = cutoffFor(d.account_id);
      const sameDay = d.date && cutoff && d.date === cutoff && d.status === 'confirmado' && d.type !== 'provisao';
      const isCredit = (ds.credit_facilities || []).some(c => c.id === d.account_id);
      const openObl = (ds.obligations || []).filter(o => C.isObligationOpen(o) || o.id === d.obligation_id);
      const fromCur = currencyForAccount(d.account_id), toCur = currencyForAccount(d.to_account_id);
      sh.body.innerHTML = `
        ${err ? `<div class="notice danger">${ic('alert')}<div class="ntext">${err}</div></div>` : ''}
        <div class="seg" role="group" aria-label="Tipo">${['despesa', 'receita', 'transferencia', 'provisao', 'ajuste'].map(t => `<button class="${d.type === t ? 'on' : ''}" data-ty="${t}">${{ despesa: 'Despesa', receita: 'Receita', transferencia: 'Transf.', provisao: 'Provisão', ajuste: 'Ajuste' }[t]}</button>`).join('')}</div>
        <div class="field"><label for="f-amt">Valor ${d.type === 'ajuste' ? '(negativo para reduzir)' : ''} · ${esc(fromCur)}</label><input class="input big num" id="f-amt" inputmode="decimal" placeholder="0,00" value="${esc(d.amount)}" autocomplete="off"></div>
        <div class="two">
          <div class="field"><label for="f-date">Data</label><input class="input" id="f-date" type="date" value="${esc(d.date)}"></div>
          <div class="field"><label for="f-status">Status</label><select class="input" id="f-status">${Object.entries(STATUS_LABEL).map(([k, l]) => `<option value="${k}" ${d.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        </div>
        ${d.status !== 'confirmado' ? `<p class="help" style="margin-top:-6px">Somente lançamentos <b>confirmados</b> mexem no saldo. ${STATUS_LABEL[d.status]} fica registrado como previsão.</p>` : ''}
        ${d.type === 'provisao' ? `<p class="help">Provisão é dinheiro separado para um fim. Não altera saldo em caixa.</p>` : ''}
        <div class="field"><label for="f-acc">${d.type === 'transferencia' ? 'Sai de' : (d.type === 'receita' ? 'Entra em' : 'Conta / meio de pagamento')}</label><select class="input" id="f-acc">${allAccountOptions(d.account_id)}</select>
          ${isCredit ? '<p class="help">Compra no crédito: reduz o limite disponível, <b>não</b> o saldo em conta. Vira dívida na fatura.</p>' : ''}</div>
        ${d.type === 'transferencia' ? `<div class="field"><label for="f-to">Vai para</label><select class="input" id="f-to"><option value="">Escolha…</option>${allAccountOptions(d.to_account_id)}</select><p class="help">Transferência entre contas suas não é receita nem despesa.</p></div>
          ${d.to_account_id && toCur !== fromCur ? `<div class="field"><label for="f-amtto">Valor recebido no destino (${esc(toCur)})</label><input class="input num" id="f-amtto" inputmode="decimal" value="${esc(d.amount_to)}"></div>` : ''}` : ''}
        ${sameDay ? `<div class="notice warn">${ic('alert')}<div class="ntext"><b>Esta data é o dia do saldo de corte (${fdate(cutoff)}).</b> Este valor já estava descontado no saldo de corte?</div></div>
          <label class="radio-card"><input type="radio" name="as" value="no" ${d.after_snapshot === true ? 'checked' : ''}><div><b>Não, aconteceu depois</b><div class="small muted">Será descontado do saldo agora.</div></div></label>
          <label class="radio-card"><input type="radio" name="as" value="yes" ${d.after_snapshot === false ? 'checked' : ''}><div><b>Sim, já estava no saldo de corte</b><div class="small muted">Fica registrado, sem descontar de novo.</div></div></label>` : ''}
        <div class="field"><label for="f-desc">Descrição</label><input class="input" id="f-desc" value="${esc(d.description)}" placeholder="Ex.: Uber Moto ida"></div>
        <div class="two">
          <div class="field"><label for="f-cat">Categoria</label><select class="input" id="f-cat"><option value="">—</option>${cats.map(c => `<option ${d.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
          <div class="field"><label for="f-sub">Subcategoria</label><input class="input" id="f-sub" value="${esc(d.subcategory)}"></div>
        </div>
        ${openObl.length && d.type !== 'receita' ? `<div class="field"><label for="f-obl">Pagamento de uma conta a pagar?</label><select class="input" id="f-obl"><option value="">Não</option>${openObl.map(o => `<option value="${esc(o.id)}" ${d.obligation_id === o.id ? 'selected' : ''}>${esc(obligationTitle(o))} · ${esc(money(C.amountOf(o)))}</option>`).join('')}</select>
          <p class="help">Vincular evita contar a mesma dívida duas vezes. Se o lançamento estiver confirmado, a conta é marcada como paga.</p></div>` : ''}
        <div class="two">
          <div class="field"><label for="f-origin">Origem</label><select class="input" id="f-origin">${Object.entries(ORIGIN_LABEL).map(([k, l]) => `<option value="${k}" ${d.origin === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
          <div class="field"><label for="f-tags">Etiquetas</label><input class="input" id="f-tags" value="${esc(d.tags)}" placeholder="separe por vírgula"></div>
        </div>
        <div class="field"><label for="f-notes">Observação</label><textarea class="input" id="f-notes" rows="2">${esc(d.notes)}</textarea></div>
        <div class="field"><label for="f-file">Comprovante (opcional)</label>
          ${e.receipt_id ? `<div class="small" style="margin-bottom:6px">📎 Já anexado · <button class="link" data-view-att="${esc(e.receipt_id)}">ver</button></div>` : ''}
          <input class="input" id="f-file" type="file" accept="image/*,application/pdf">
          <p class="help">Fica só neste aparelho. Só sai no backup ZIP completo.</p></div>
        ${existing ? `<button class="btn ghost" data-del style="color:var(--danger)">${ic('trash')} Excluir lançamento</button>` : ''}
        <p class="tiny muted">${existing ? 'ID: ' + esc(existing.id) : ''}</p>`;
      sh.foot.innerHTML = `<button class="btn" data-save>${ic('check')} Salvar</button>`;
      bind();
    }
    function readInputs() {
      const g = id => sh.body.querySelector('#' + id);
      const map = { 'f-amt': 'amount', 'f-date': 'date', 'f-status': 'status', 'f-acc': 'account_id', 'f-to': 'to_account_id', 'f-amtto': 'amount_to', 'f-desc': 'description', 'f-cat': 'category', 'f-sub': 'subcategory', 'f-obl': 'obligation_id', 'f-origin': 'origin', 'f-tags': 'tags', 'f-notes': 'notes' };
      for (const [id, k] of Object.entries(map)) { const el = g(id); if (el) d[k] = el.value; }
      const r = sh.body.querySelector('input[name="as"]:checked'); if (r) d.after_snapshot = r.value === 'no';
      const f = g('f-file'); if (f && f.files && f.files[0]) d.file = f.files[0];
    }
    function bind() {
      sh.body.querySelectorAll('[data-ty]').forEach(b => b.onclick = () => { readInputs(); d.type = b.dataset.ty; draw(); });
      ['f-status', 'f-acc', 'f-to', 'f-date'].forEach(id => { const el = sh.body.querySelector('#' + id); if (el) el.onchange = () => { readInputs(); if (id === 'f-date' || id === 'f-acc') d.after_snapshot = null; draw(); }; });
      const ob = sh.body.querySelector('#f-obl'); if (ob) ob.onchange = () => {
        readInputs();
        const o = (ds.obligations || []).find(x => x.id === d.obligation_id);
        if (o && !d.amount) d.amount = String(C.amountOf(o)).replace('.', ',');
        if (o && !d.description) d.description = 'Pagamento ' + obligationTitle(o);
        if (o && !d.category) d.category = guessCategory(o);
        draw();
      };
      const del = sh.body.querySelector('[data-del]'); if (del) del.onclick = () => deleteTx(existing, sh);
      const va = sh.body.querySelector('[data-view-att]'); if (va) va.onclick = () => viewAttachment(va.dataset.viewAtt);
      sh.foot.querySelector('[data-save]').onclick = save;
    }
    async function save() {
      readInputs();
      const amt = C.num(d.amount);
      const cutoff = cutoffFor(d.account_id);
      const problems = [];
      if (isNaN(amt) || (d.type !== 'ajuste' && amt <= 0) || amt === 0) problems.push('Informe um valor válido (ex.: 12,50).');
      if (!C.dateOnly(d.date)) problems.push('Informe a data.');
      if (d.type !== 'provisao' && !d.account_id) problems.push('Escolha a conta.');
      if (d.type === 'transferencia' && (!d.to_account_id || d.to_account_id === d.account_id)) problems.push('Escolha uma conta de destino diferente da origem.');
      const sameDay = d.date === cutoff && d.status === 'confirmado' && d.type !== 'provisao';
      if (sameDay && d.after_snapshot === null) problems.push('Responda se este valor já estava no saldo de corte.');
      if (problems.length) { err = problems.join('<br>'); draw(); sh.body.scrollTop = 0; return; }
      const others = (ds.transactions || []).filter(t => !existing || t.id !== existing.id);
      const dup = others.find(t => C.dateOnly(t.date) === d.date && C.round2(C.num(t.amount)) === C.round2(amt) && t.account_id === d.account_id && C.txType(t) === d.type);
      if (dup && !(await confirmDialog({ title: 'Possível duplicidade', text: `Já existe um lançamento igual: <b>${esc(dup.description || '')}</b>, ${esc(money(C.num(dup.amount)))} em ${fdate(dup.date)} na mesma conta.<br><br>É outro gasto de verdade?`, ok: 'Sim, salvar mesmo assim', cancel: 'Não, voltar' }))) return;

      const ds2 = C.clone(ds);
      const now = nowIso();
      let rec = existing ? Object.assign({}, ds2.transactions.find(t => t.id === existing.id)) : { id: `tx-${d.date}-${slug(d.description || d.category || d.type)}-${rand(2)}`, created_at: now };
      const prevObl = existing ? existing.obligation_id : null;
      const set = (k, v) => { if (v === '' || v === null || v === undefined || (Array.isArray(v) && !v.length)) delete rec[k]; else rec[k] = v; };
      rec.date = d.date; rec.type = d.type; rec.amount = C.round2(amt); rec.currency = currencyForAccount(d.account_id);
      rec.status = d.status; rec.origin = d.origin;
      set('account_id', d.account_id); set('category', d.category); set('subcategory', d.subcategory.trim());
      set('description', d.description.trim()); set('notes', d.notes.trim());
      set('tags', d.tags.split(',').map(s => s.trim()).filter(Boolean));
      set('to_account_id', d.type === 'transferencia' ? d.to_account_id : '');
      const at = C.num(d.amount_to); set('amount_to', d.type === 'transferencia' && !isNaN(at) && currencyForAccount(d.to_account_id) !== rec.currency ? C.round2(at) : '');
      set('obligation_id', d.type !== 'receita' ? d.obligation_id : '');
      if (sameDay) rec.after_snapshot = d.after_snapshot === true; else delete rec.after_snapshot;
      rec.updated_at = now;
      if (d.file) rec.receipt_id = await storeAttachment(ds2, d.file, rec.id);

      // vínculo com contas a pagar
      const unlink = id => {
        const o = (ds2.obligations || []).find(x => x.id === id);
        if (o && o.paid_transaction_id === rec.id) { o.status = o.status_before_payment || 'pendente'; delete o.paid_transaction_id; delete o.paid_at; delete o.status_before_payment; o.updated_at = now; }
      };
      if (prevObl && (prevObl !== rec.obligation_id || rec.status !== 'confirmado')) unlink(prevObl);
      if (rec.obligation_id && rec.status === 'confirmado') {
        const o = (ds2.obligations || []).find(x => x.id === rec.obligation_id);
        if (o && o.paid_transaction_id !== rec.id) { if (C.isObligationOpen(o)) o.status_before_payment = o.status; o.status = 'pago'; o.paid_transaction_id = rec.id; o.paid_at = rec.date; o.updated_at = now; }
      }
      if (existing) ds2.transactions[ds2.transactions.findIndex(t => t.id === existing.id)] = rec; else ds2.transactions.push(rec);
      sh.close();
      await commit(ds2, {
        audit: { type: existing ? 'transaction-update' : 'transaction-create', description: `${TYPE_LABEL[rec.type]} ${money(rec.amount, rec.currency)} · ${rec.description || rec.category || ''} (${STATUS_LABEL[rec.status]})`, extra: { record_id: rec.id } },
        toast: existing ? 'Lançamento atualizado' : 'Lançamento salvo'
      });
    }
    draw();
  }
  function cutoffFor(accId) {
    const a = (S.ds.accounts || []).find(x => x.id === accId);
    return C.dateOnly(a && a.snapshot_date) || C.dateOnly(S.ds.snapshot_date);
  }
  function currencyForAccount(id) {
    const a = (S.ds.accounts || []).find(x => x.id === id);
    return a && a.currency ? String(a.currency).toUpperCase() : 'BRL';
  }
  function guessCategory(o) {
    const n = C.norm((o.id || '') + ' ' + (o.notes || '') + ' ' + (o.name || o.description || ''));
    if (/emprest|cartao|reneg|facil|dm_|_dm|juros/.test(n)) return 'Banco/Dívidas';
    if (/aluguel|enel|agua|internet|chip|claro|imobil|advog/.test(n)) return 'Casa';
    if (/psn|icloud|stream|assinat/.test(n)) return 'Lazer/Assinaturas';
    if (/passaporte|espanha|viagem/.test(n)) return 'Viagem/Espanha';
    if (/leite|mercado|aliment/.test(n)) return 'Alimentação/Compras';
    if (/saude|remed|medic/.test(n)) return 'Saúde/Emergências';
    if (/transport|uber|perua/.test(n)) return 'Transporte';
    return '';
  }
  async function deleteTx(t, sh) {
    if (!(await confirmDialog({ title: 'Excluir lançamento?', text: `<b>${esc(t.description || '')}</b> · ${esc(money(C.num(t.amount), t.currency))} em ${fdate(t.date)}.<br><br>O registro sai dos saldos, mas fica guardado em “Registros excluídos” e no histórico, para que uma importação futura não o recrie sem você perceber.`, ok: 'Excluir', danger: true }))) return;
    const ds2 = C.clone(S.ds); const now = nowIso();
    ds2.transactions = ds2.transactions.filter(x => x.id !== t.id);
    const o = (ds2.obligations || []).find(x => x.id === t.obligation_id && x.paid_transaction_id === t.id);
    if (o) { o.status = o.status_before_payment || 'pendente'; delete o.paid_transaction_id; delete o.paid_at; delete o.status_before_payment; o.updated_at = now; }
    if (!Array.isArray(ds2.deleted_records)) ds2.deleted_records = [];
    ds2.deleted_records.push({ id: 'del-' + Date.now().toString(36) + rand(2), collection: 'transactions', record_id: t.id, deleted_at: now, record: C.clone(t) });
    sh.close();
    await commit(ds2, { audit: { type: 'transaction-delete', description: `Excluído: ${t.description || t.id} ${money(C.num(t.amount), t.currency)}`, extra: { record_id: t.id } }, toast: 'Lançamento excluído' });
  }

  // ---------- comprovantes ----------
  async function storeAttachment(ds2, file, txId) {
    const buf = new Uint8Array(await file.arrayBuffer());
    const id = 'att-' + Date.now().toString(36) + rand(3);
    const sha = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', buf))).map(b => b.toString(16).padStart(2, '0')).join('');
    await DB.putFile({ id, name: file.name || 'comprovante', type: file.type || 'application/octet-stream', size: buf.length, blob: new Blob([buf], { type: file.type }), added_at: nowIso() });
    if (!Array.isArray(ds2.attachments_manifest)) ds2.attachments_manifest = [];
    ds2.attachments_manifest.push({ id, filename: file.name || 'comprovante', mime: file.type || '', size: buf.length, sha256: sha, transaction_id: txId, added_at: nowIso(), stored: 'somente neste aparelho' });
    return id;
  }
  async function viewAttachment(id) {
    const f = await DB.getFile(id);
    if (!f) { showError('Comprovante não encontrado', 'Este comprovante está listado nos dados, mas o arquivo não está neste aparelho. Ele só é restaurado importando um backup ZIP completo.'); return; }
    const url = URL.createObjectURL(f.blob);
    const isImg = /^image\//.test(f.type);
    openSheet({ title: f.name, full: true, body: isImg ? `<img src="${url}" alt="Comprovante" style="width:100%;border-radius:12px">` : `<p>Arquivo ${esc(f.type)} · ${(f.size / 1024).toFixed(0)} KB</p><a class="btn" href="${url}" target="_blank" rel="noopener">Abrir arquivo</a>`, foot: false, onClose: () => URL.revokeObjectURL(url) });
  }

  // ---------- CONTAS A PAGAR ----------
  function viewContas() {
    const ds = S.ds, today = todayStr(), sum = C.summarize(ds, today);
    let h = `<h1 class="page-title">Contas a pagar</h1>
      <div class="stat-grid"><div class="stat"><div class="k">Pendente</div><div class="v">${M(sum.openPending)}</div><div class="s">em aberto</div></div><div class="stat"><div class="k">Planejado</div><div class="v">${M(sum.openPlanned)}</div><div class="s">ainda por vir</div></div></div>`;
    if (sum.overdue.length) h += `<div class="notice danger">${ic('clock')}<div class="ntext"><b>Vencimento passado:</b> ${sum.overdue.map(o => esc(obligationTitle(o))).join(', ')}. Se já pagou, toque na conta e registre o pagamento.</div></div>`;
    const months = Object.keys(sum.byMonth).sort((a, b) => a === 'sem-data' ? 1 : b === 'sem-data' ? -1 : a.localeCompare(b));
    if (!months.length) h += `<div class="card empty"><div class="e-ico">✅</div>Nenhuma conta em aberto.</div>`;
    for (const m of months) {
      const g = sum.byMonth[m];
      const items = g.items.slice().sort((a, b) => String(a.due_date || '9').localeCompare(String(b.due_date || '9')));
      h += `<div class="section-title"><span>${m === 'sem-data' ? 'Sem vencimento definido' : monthLabel(m)}</span><span class="tiny muted">${g.pendente ? 'pend. ' + esc(money(g.pendente)) : ''}${g.pendente && (g.planejado + g.outros) ? ' · ' : ''}${g.planejado + g.outros ? 'plan. ' + esc(money(g.planejado + g.outros)) : ''}</span></div>
        <div class="card"><div class="rows">${items.map(o => obligationRow(o, today)).join('')}</div></div>`;
    }
    const closed = (ds.obligations || []).filter(o => o && !C.isObligationOpen(o));
    if (closed.length) h += `<details class="card fold"><summary>Pagas ou canceladas (${closed.length})</summary><div class="rows" style="margin-top:8px">${closed.map(o => obligationRow(o, today)).join('')}</div></details>`;
    const rec = Array.isArray(ds.planned_recurring) ? ds.planned_recurring : [];
    if (rec.length) h += `<details class="card fold"><summary>Recorrentes previstos (${rec.length})</summary><p class="small muted">Modelos de contas que se repetem. <b>Não</b> viram cobrança automaticamente, para evitar duplicidade com as contas acima.</p><div class="rows">${rec.map(r => `<div class="row-item"><div class="ico">${catIcon(guessCategory(r), '🔁')}</div><div class="main"><div class="t">${esc(r.name || humanize(r.id))}</div><div class="s">${esc(r.due || '')}</div></div><div class="amt forecast">${M(C.amountOf(r))}</div></div>`).join('')}</div></details>`;
    return h;
  }
  function openObligation(id) {
    const o = (S.ds.obligations || []).find(x => x.id === id);
    if (!o) return;
    const open = C.isObligationOpen(o);
    const paidTx = o.paid_transaction_id && (S.ds.transactions || []).find(t => t.id === o.paid_transaction_id);
    const sh = openSheet({
      title: obligationTitle(o),
      body: `<div style="text-align:center;margin:4px 0 16px"><div class="big num" style="font-size:32px;font-weight:750">${M(C.amountOf(o), C.currencyOf(o, S.ds))}</div><div>${statusBadge(o.status)} ${o.due_date ? 'vence ' + fdate(o.due_date) : '<span class="muted">sem vencimento definido</span>'}</div></div>
        ${paidTx ? `<div class="notice ok">${ic('check')}<div class="ntext">Pago pelo lançamento <b>${esc(paidTx.description || paidTx.id)}</b> em ${fdate(paidTx.date)}.</div></div>` : ''}
        ${!paidTx && !open ? `<div class="notice info">${ic('info')}<div class="ntext">Marcada como ${esc(o.status)} sem lançamento vinculado: nada foi descontado do saldo por ela.</div></div>` : ''}
        <div class="card">${renderValue(o)}</div>`,
      footHtml: (open ? `<button class="btn" data-pay>${ic('check')} Registrar pagamento</button>` : '') + `<button class="btn secondary" data-edit>Editar</button>`
    });
    const pay = sh.foot.querySelector('[data-pay]');
    if (pay) pay.onclick = () => {
      sh.close();
      const acc = (S.ds.accounts || []).find(a => a.id === 'nubank_debito') || (S.ds.accounts || [])[0] || {};
      openTxForm(null, { type: 'despesa', amount: String(C.amountOf(o)).replace('.', ','), obligation_id: o.id, description: 'Pagamento ' + obligationTitle(o), category: guessCategory(o), status: 'confirmado', account_id: acc.id || '' });
    };

  }
  function editObligation(o) {
    const sts = ['pendente', 'planejado', 'pago', 'cancelado']; if (o.status && !sts.includes(o.status)) sts.unshift(o.status);
    const sh = openSheet({
      title: 'Editar conta a pagar', sticky: true,
      body: `<div class="field"><label>Valor (R$)</label><input class="input num" id="o-amt" inputmode="decimal" value="${esc(String(C.amountOf(o)).replace('.', ','))}"></div>
        <div class="field"><label>Vencimento</label><input class="input" id="o-due" type="date" value="${esc(o.due_date || '')}"><p class="help">Deixe vazio se a data não for conhecida.</p></div>
        <div class="field"><label>Status</label><select class="input" id="o-st">${sts.map(s => `<option value="${esc(s)}" ${o.status === s ? 'selected' : ''}>${esc(humanize(s))}</option>`).join('')}</select>
        <p class="help">Para quitar, prefira “Registrar pagamento”: assim o valor sai do saldo certo e fica vinculado.</p></div>
        <div class="field"><label>Observação</label><textarea class="input" id="o-notes" rows="3">${esc(o.notes || '')}</textarea></div>`,
      footHtml: `<button class="btn" data-save>Salvar</button>`
    });
    sh.foot.querySelector('[data-save]').onclick = async () => {
      const g = id => sh.body.querySelector(id).value;
      const amt = C.num(g('#o-amt'));
      if (isNaN(amt) || amt < 0) { toast('Valor inválido'); return; }
      const ds2 = C.clone(S.ds); const rec = ds2.obligations.find(x => x.id === o.id);
      const before = C.clone(rec); const field = 'amount' in rec || !('amount_brl' in rec) ? 'amount' : 'amount_brl';
      rec[field] = C.round2(amt); rec.due_date = g('#o-due') || null; rec.status = g('#o-st');
      if (g('#o-notes').trim()) rec.notes = g('#o-notes').trim(); else delete rec.notes;
      const changed = Object.keys(rec).filter(k => C.stable(rec[k]) !== C.stable(before[k]));
      if (!changed.length) { sh.close(); return; }
      rec.updated_at = nowIso();
      sh.close();
      await commit(ds2, { audit: { type: 'obligation-update', description: `${obligationTitle(rec)}: ${changed.map(k => (KEYL[k] || k) + ' ' + JSON.stringify(before[k] ?? null) + ' → ' + JSON.stringify(rec[k] ?? null)).join('; ')}`, extra: { record_id: rec.id } }, toast: 'Conta atualizada' });
    };
  }

  // ---------- AGENDA ----------
  function eventsIndex(ds, ym) {
    const ev = {};
    const add = (d, e) => { if (!d) return; (ev[d] = ev[d] || []).push(e); };
    (ds.obligations || []).forEach(o => { if (o && o.due_date && C.isObligationOpen(o)) add(o.due_date, { kind: 'due', title: obligationTitle(o), amount: C.amountOf(o), status: o.status, act: 'obligation', id: o.id }); });
    (ds.income_forecasts || []).forEach(r => {
      if (!r) return;
      if (r.date) add(C.dateOnly(r.date), { kind: 'inc', title: humanize(r.id), amount: C.amountOf(r), status: r.status, act: 'raw', key: 'income_forecasts', id: r.id });
      else if (r.expected_day && ym && /mensal/.test(C.norm(r.frequency))) add(`${ym}-${p2(r.expected_day)}`, { kind: 'inc', title: humanize(r.id) + ' (mensal)', amount: C.amountOf(r), status: r.status, act: 'raw', key: 'income_forecasts', id: r.id });
    });
    (ds.transactions || []).forEach(t => { if (t && t.date) add(C.dateOnly(t.date), { kind: 'tx', title: t.description || TYPE_LABEL[C.txType(t)] || 'Lançamento', amount: C.num(t.amount), status: t.status, act: 'tx-edit', id: t.id, cur: t.currency }); });
    return ev;
  }
  function viewAgenda() {
    const a = S.agenda;
    if (!a.month) a.month = todayStr().slice(0, 7);
    let h = `<h1 class="page-title">Agenda</h1><div class="seg"><button class="${a.view === 'cal' ? 'on' : ''}" data-act="agenda-view" data-v="cal">Calendário</button><button class="${a.view === 'time' ? 'on' : ''}" data-act="agenda-view" data-v="time">Linha do tempo</button></div>`;
    return h + (a.view === 'cal' ? calendarView() : timelineView());
  }
  function eventRow(e) {
    const color = e.kind === 'due' ? 'var(--danger)' : (e.kind === 'inc' ? 'var(--pos)' : 'var(--info)');
    return `<button class="row-item" data-act="${e.act}" data-id="${esc(e.id)}" ${e.key ? `data-key="${esc(e.key)}"` : ''}><div class="ico" style="color:${color}">${e.kind === 'due' ? '📌' : (e.kind === 'inc' ? '💼' : '🧾')}</div>
      <div class="main"><div class="t">${esc(e.title)}</div><div class="s">${e.kind === 'due' ? 'Vencimento' : (e.kind === 'inc' ? 'Receita prevista' : 'Lançamento')} ${statusBadge(e.status)}</div></div><div class="amt ${e.kind === 'tx' && C.norm(e.status) === 'confirmado' ? '' : 'forecast'}">${M(e.amount, e.cur)}</div></button>`;
  }
  function calendarView() {
    const a = S.agenda, [y, m] = a.month.split('-').map(Number);
    const ev = eventsIndex(S.ds, a.month);
    const first = new Date(y, m - 1, 1), start = first.getDay();
    const days = new Date(y, m, 0).getDate(), today = todayStr();
    let h = `<div class="card"><div class="cal-head"><button class="icon-btn" data-act="cal-nav" data-d="-1" aria-label="Mês anterior">${ic('left')}</button><b>${(s => s.charAt(0).toUpperCase() + s.slice(1))(monthLabel(a.month))}</b><button class="icon-btn" data-act="cal-nav" data-d="1" aria-label="Próximo mês">${ic('right')}</button></div><div class="cal">`;
    ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].forEach(d => { h += `<div class="dow">${d}</div>`; });
    for (let i = 0; i < start; i++) h += `<div></div>`;
    for (let d = 1; d <= days; d++) {
      const ds = `${a.month}-${p2(d)}`, e = ev[ds] || [];
      const kinds = Array.from(new Set(e.map(x => x.kind)));
      h += `<button class="day ${ds === today ? 'today' : ''} ${a.sel === ds ? 'sel' : ''}" data-act="cal-day" data-d="${ds}" aria-label="${d} ${e.length ? e.length + ' itens' : ''}"><span>${d}</span><span class="dots">${kinds.map(k => `<i class="dot ${k}"></i>`).join('')}</span></button>`;
    }
    h += `</div><div class="tiny muted" style="display:flex;gap:12px;margin-top:10px;flex-wrap:wrap"><span><i class="dot due" style="display:inline-block"></i> vencimento</span><span><i class="dot inc" style="display:inline-block"></i> receita prevista</span><span><i class="dot tx" style="display:inline-block"></i> lançamento</span></div></div>`;
    const sel = a.sel && a.sel.startsWith(a.month) ? a.sel : null;
    if (sel) {
      const list = ev[sel] || [];
      h += `<div class="section-title"><span>${fdate(sel)}</span></div><div class="card">${list.length ? `<div class="rows">${list.map(eventRow).join('')}</div>` : '<div class="muted small">Nada neste dia.</div>'}</div>`;
    } else {
      const monthEv = Object.keys(ev).filter(k => k.startsWith(a.month)).sort();
      h += `<div class="section-title"><span>No mês</span></div><div class="card">${monthEv.length ? '<div class="rows">' + monthEv.map(k => `<div class="tiny muted" style="padding:8px 0 0;font-weight:650">${fdate(k)}</div>` + ev[k].map(eventRow).join('')).join('') + '</div>' : '<div class="muted small">Nenhum item com data neste mês.</div>'}</div>`;
    }
    return h;
  }
  function timelineView() {
    const ds = S.ds, today = todayStr();
    const ev = eventsIndex(ds, null);
    const future = Object.keys(ev).filter(k => k >= today).sort();
    const past = Object.keys(ev).filter(k => k < today).sort().reverse();
    let h = `<div class="section-title"><span>Próximos</span></div><div class="card">`;
    h += future.length ? '<div class="rows">' + future.map(k => `<div class="tiny muted" style="padding:8px 0 0;font-weight:650">${fdate(k)}${k === today ? ' · hoje' : ''}</div>` + ev[k].map(eventRow).join('')).join('') + '</div>' : '<div class="muted small">Nada com data à frente.</div>';
    h += `</div><div class="section-title"><span>Já passou</span></div><div class="card">`;
    const audit = (ds.audit_log || []).slice(-8).reverse();
    h += past.length ? '<div class="rows">' + past.map(k => `<div class="tiny muted" style="padding:8px 0 0;font-weight:650">${fdate(k)}</div>` + ev[k].map(eventRow).join('')).join('') + '</div>' : '<div class="muted small">Nenhum lançamento ou vencimento anterior a hoje.</div>';
    h += `</div><div class="section-title"><span>Alterações recentes</span><button class="link" data-act="page" data-tab="mais" data-page="auditoria">Ver tudo</button></div><div class="card"><div class="rows">${audit.map(auditRow).join('')}</div></div>`;
    return h;
  }
  function auditRow(e) {

  function parseJsonLenient(text) {
    text = text.replace(/^﻿/, '').trim();
    try { return JSON.parse(text); } catch (e1) {
      const m = text.match(/```(?:json)?\s*([\s\S]*?)```/);
      if (m) { try { return JSON.parse(m[1]); } catch (e2) { /* segue */ } }
      const pos = /position (\d+)/.exec(e1.message);
      const err = new Error('O arquivo não é um JSON válido' + (pos ? ' (problema perto do caractere ' + pos[1] + ')' : '') + '. Se veio do ChatGPT, peça para ele gerar o arquivo .json de novo, completo e sem cortes.');

  async function startImport() {

      if (Zip.isZip(buf)) {
        const entries = await Zip.readZip(buf);
        const js = entries.filter(e => /\.json$/i.test(e.name));
        const j = js.find(e => !e.name.includes('/')) || js[0];
        if (!j) throw Object.assign(new Error('O ZIP não contém um arquivo .json de backup.'), { friendly: true });
        text = new TextDecoder().decode(j.data);
        zipFiles = entries.filter(e => e !== j && /^comprovantes\//.test(e.name));
      } else text = new TextDecoder().decode(buf);
      let obj = parseJsonLenient(text);
      if (C.isEncrypted(obj)) {
        const pw = await promptPassword({ title: 'Backup criptografado', text: 'Digite a senha usada ao exportar este backup.' });
        if (!pw) return;
        try { obj = parseJsonLenient(await C.decryptText(obj, pw)); }
        catch (e) { if (e.friendly) throw e; throw Object.assign(new Error('Senha incorreta ou arquivo danificado.'), { friendly: true }); }
      }
      const prep = C.prepare(obj);
      if (prep.fatal) throw Object.assign(new Error(prep.fatal), { friendly: true });
      const v = C.validate(prep.data);
      const integ = await C.checkIntegrityField(prep.data);
      showImportPreview({ file, raw: obj, prep, v, integ, zipFiles });

  // ---------- EXPORTAÇÃO ----------
  async function shareOrDownload(blob, filename) {
    const file = new File([blob], filename, { type: blob.type || 'application/octet-stream' });
    if (navigator.canShare && navigator.share) {
      let can = false; try { can = navigator.canShare({ files: [file] }); } catch (e) { can = false; }
      if (can) {
        try { await navigator.share({ files: [file], title: filename }); return 'shared'; }
        catch (e) { if (e.name === 'AbortError') return 'cancelled'; if (e.name === 'NotAllowedError') return 'needs-tap'; }
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 120000);
    return 'downloaded';
  }
  async function deliver(blob, filename, onDone) {
    const r = await shareOrDownload(blob, filename);
    if (r === 'needs-tap') {
      const sh = openSheet({ title: 'Arquivo pronto', body: `<p>O arquivo <b>${esc(filename)}</b> está pronto. Toque abaixo e escolha <b>Salvar em Arquivos</b>.</p>`, footHtml: `<button class="btn" data-go>${ic('down')} Salvar / compartilhar</button>` });
      sh.foot.querySelector('[data-go]').onclick = async () => { sh.close(); const r2 = await shareOrDownload(blob, filename); if (r2 !== 'cancelled' && r2 !== 'needs-tap') onDone(r2); };
      return;
    }
    if (r !== 'cancelled') onDone(r);
    else toast('Exportação cancelada. Nada foi salvo.');
  }
  async function doExport(kind, srcDs, label) {
    const ds = srcDs || S.ds;
    const att = (ds.attachments_manifest || []).length;
    if (kind === 'json' && att && !srcDs) {
      const zip = await confirmDialog({ title: 'Comprovantes não vão no JSON', text: `Você tem ${att} comprovante(s) guardado(s) neste aparelho. O <b>JSON</b> leva só a lista deles, não as imagens.<br><br>Para um backup completo, use o <b>ZIP</b>. Para mandar ao ChatGPT, o JSON é o ideal.`, ok: 'Exportar ZIP completo', cancel: 'Só o JSON' });
      if (zip) kind = 'zip';
    }
    let text;
    try { text = JSON.stringify(await C.buildExport(ds, nowIso()), null, 2); }
    catch (e) { showError('Falha ao exportar', esc(e.message)); return; }
    const base = `cofre-financeiro_${stamp()}${label ? '_' + label : ''}`;
    let blob, name;
    if (kind === 'enc') {
      const pw = await promptPassword({ title: 'Senha do backup', confirm: true, text: '<b>Se você esquecer esta senha, o backup não poderá ser aberto por ninguém.</b> Não há recuperação. Anote num lugar seguro.' });
      if (!pw) return;
      toast('Criptografando…');
      blob = new Blob([await C.encryptText(text, pw)], { type: 'application/json' }); name = base + '_criptografado.json';
    } else if (kind === 'zip') {
      const files = [{ name: base + '.json', data: text }];
      const stored = await DB.listFiles();
      for (const m of ds.attachments_manifest || []) {
        const f = stored.find(x => x.id === m.id);
        if (f) files.push({ name: `comprovantes/${m.id}__${(m.filename || 'arquivo').replace(/[\\/:*?"<>|]/g, '_')}`, data: new Uint8Array(await f.blob.arrayBuffer()) });
      }
      blob = new Blob([Zip.createZip(files)], { type: 'application/zip' }); name = base + '_completo.zip';
    } else { blob = new Blob([text], { type: 'application/json' }); name = base + '.json'; }
    await deliver(blob, name, async () => {
      if (!srcDs) { await saveMeta({ last_export_at: nowIso(), last_export_name: name, dirty: false }); render(); }
      toast(srcDs ? 'Cópia exportada' : 'Backup exportado. Guarde em dois lugares.');
    });
  }

  // ---------- restauração e integridade ----------
  async function restoreBackup(id) {
    const b = await DB.getBackup(Number(id));
    if (!b) return;
    if (!(await confirmDialog({ title: 'Restaurar esta cópia?', text: `Os dados voltarão ao estado de <b>${fdatetime(b.created_at)}</b> (${esc(b.reason || '')}).<br><br>Os dados atuais serão guardados antes numa nova cópia automática, então dá para desfazer.`, ok: 'Restaurar' }))) return;
    const ds2 = C.clone(b.data);
    await commit(ds2, { audit: { type: 'restore', description: `Restaurada cópia automática de ${fdatetime(b.created_at)} (${b.reason || ''})` }, backupReason: 'Antes de restaurar a cópia de ' + fdatetime(b.created_at), toast: 'Cópia restaurada' });
    fillBackups();
  }
  async function integrityCheck() {
    const out = [];
    const ok = (t) => out.push(['ok', t]), warn = (t) => out.push(['warn', t]), bad = (t) => out.push(['bad', t]);
    const ds = S.ds;
    const v = C.validate(ds);
    v.errors.length ? v.errors.forEach(bad) : ok('Estrutura dos dados válida, sem IDs repetidos.');
    v.warnings.forEach(warn);
    try {
      const stored = await DB.get('current');
      C.stable(stored) === C.stable(ds) ? ok('O que está gravado no aparelho é idêntico ao que aparece na tela.') : bad('Diferença entre a tela e o armazenamento. Feche e abra o app.');
    } catch (e) { bad('Não foi possível ler o armazenamento: ' + e.message); }
    const txIds = new Set((ds.transactions || []).map(t => t.id));
    (ds.obligations || []).forEach(o => { if (o.paid_transaction_id && !txIds.has(o.paid_transaction_id)) warn(`Conta “${obligationTitle(o)}” aponta para um lançamento que não existe (${o.paid_transaction_id}).`); });
    const oblIds = new Set((ds.obligations || []).map(o => o.id));
    (ds.transactions || []).forEach(t => { if (t.obligation_id && !oblIds.has(t.obligation_id)) warn(`Lançamento “${t.description || t.id}” aponta para conta a pagar inexistente.`); });
    const files = await DB.listFiles();
    const man = ds.attachments_manifest || [];
    const missing = man.filter(m => !files.find(f => f.id === m.id));
    missing.length ? warn(`${missing.length} comprovante(s) listados mas sem arquivo neste aparelho (restaure com o ZIP completo).`) : ok(`Comprovantes: ${man.length} listado(s), todos presentes.`);
    const bal = C.computeBalances(ds);
    ok(`Saldos recalculados para ${bal.length} contas (${bal.filter(b => b.unknown).length} com saldo desconhecido).`);
    const backups = await DB.listBackups();
    ok(`${backups.length} cópia(s) automática(s) no aparelho.`);
    S.meta.last_export_at ? (S.meta.dirty ? warn('Há alterações ainda não exportadas.') : ok('Último backup externo está em dia.')) : warn('Nenhum backup externo foi exportado ainda.');
    openSheet({
      title: 'Verificação de integridade',
      body: `<div class="card"><div class="rows">${out.map(([k, t]) => `<div class="row-item"><div class="ico" style="color:${k === 'ok' ? 'var(--pos)' : (k === 'warn' ? 'var(--warn)' : 'var(--danger)')}">${ic(k === 'ok' ? 'check' : 'alert')}</div><div class="main"><div class="t" style="white-space:normal;font-weight:500">${esc(t)}</div></div></div>`).join('')}</div></div>`,
      footHtml: '<button class="btn secondary" data-close>Fechar</button>'
    });
  }

  // ---------- PIN ----------
  async function pinHash(pin, saltB64, iter) {
    const salt = saltB64 ? C.b64.dec(saltB64) : crypto.getRandomValues(new Uint8Array(16));
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, 256);
    return { salt: C.b64.enc(salt), hash: C.b64.enc(new Uint8Array(bits)), iter };
  }
  function setPin() {
    const sh = openSheet({
      title: S.meta.pin ? 'Trocar PIN' : 'Criar PIN', sticky: true,
      body: `<div class="field"><label>Novo PIN (4 a 6 números)</label><input class="input big num" id="p1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"></div>
        <div class="field"><label>Repita o PIN</label><input class="input big num" id="p2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"></div>
        <div id="perr" class="small" style="color:var(--danger)"></div>
        <p class="help">Se esquecer o PIN, a única saída é apagar os dados do app e restaurar um backup exportado.</p>`,
      footHtml: '<button class="btn" data-ok>Salvar PIN</button>'
    });
    sh.foot.querySelector('[data-ok]').onclick = async () => {
      const a = sh.body.querySelector('#p1').value, b = sh.body.querySelector('#p2').value, e = sh.body.querySelector('#perr');
      if (!/^\d{4,6}$/.test(a)) { e.textContent = 'Use de 4 a 6 números.'; return; }
      if (a !== b) { e.textContent = 'Os PINs não são iguais.'; return; }
      const h = await pinHash(a, null, 150000); h.length = a.length;
      await saveMeta({ pin: h }); sh.close(); render(); toast('PIN ativado');
    };
  }
  async function removePin() {
    if (!(await confirmDialog({ title: 'Desativar PIN?', text: 'O app abrirá sem pedir PIN.', ok: 'Desativar', danger: true }))) return;
    const m = Object.assign({}, S.meta); delete m.pin; S.meta = m; await DB.set('meta', m); render(); toast('PIN desativado');
  }
  let pinBuf = '';
  function renderLock() {
    let el = document.querySelector('.lock');
    if (!el) { el = document.createElement('div'); el.className = 'lock'; document.body.appendChild(el); }
    const len = (S.meta.pin && S.meta.pin.length) || 4;
    el.innerHTML = `<div style="width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.12);display:grid;place-items:center">${ic('lock')}</div><h2>Cofre bloqueado</h2><div style="opacity:.75;font-size:14px">Digite seu PIN</div>
      <div class="pin-dots">${Array.from({ length: len }, (_, i) => `<span class="${i < pinBuf.length ? 'f' : ''}"></span>`).join('')}</div>
      <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<button class="blank" data-forgot style="font-size:13px">Esqueci</button><button data-k="0">0</button><button class="blank" data-k="del" aria-label="Apagar">⌫</button></div>`;
    el.querySelectorAll('[data-k]').forEach(b => b.onclick = async () => {
      const k = b.dataset.k;
      if (k === 'del') pinBuf = pinBuf.slice(0, -1); else if (pinBuf.length < len) pinBuf += k;
      if (pinBuf.length === len) {
        const p = S.meta.pin, h = await pinHash(pinBuf, p.salt, p.iter);
        if (h.hash === p.hash) { pinBuf = ''; S.locked = false; el.remove(); render(); return; }
        pinBuf = ''; renderLock(); const dots = document.querySelector('.pin-dots'); if (dots) dots.classList.add('shake'); return;
      }
      renderLock();
    });
    el.querySelector('[data-forgot]').onclick = () => {
      S.locked = false; el.remove();
      wipe(true).then(okd => { if (!okd) { S.locked = true; render(); } });
    };
  }
  async function wipe(fromLock) {
    const okd = await confirmDialog({ title: fromLock ? 'Esqueceu o PIN?' : 'Apagar tudo?', text: (fromLock ? 'Sem o PIN, a única opção é <b>apagar os dados deste aparelho</b> e depois importar seu último backup exportado.<br><br>' : '') + 'Isso apaga dados, cópias automáticas e comprovantes deste aparelho. <b>Não dá para desfazer.</b>', ok: 'Apagar tudo', danger: true, typeWord: 'APAGAR' });
    if (!okd) return false;
    const backups = await DB.listBackups();
    for (const b of backups) await DB.deleteBackup(b.id);
    await DB.clearFiles();
    await DB.saveState(null, {});
    S.ds = null; S.meta = {}; S.locked = false; go('inicio');
    toast('Dados apagados deste aparelho');
    return true;
  }

  // ---------- eventos ----------
  const TABS = { inicio: viewInicio, lancamentos: viewLancamentos, contas: viewContas, agenda: viewAgenda, mais: viewMais };
  const PAGES = { backup: pageBackup, planejamento: pagePlanejamento, conciliacao: pageConciliacao, auditoria: pageAuditoria, dados: pageDados, seguranca: pageSeguranca, sobre: pageSobre };
  const ACTIONS = {
    tab: el => go(el.dataset.tab),
    page: el => go(el.dataset.tab, el.dataset.page),
    import: () => startImport(),
    export: el => doExport(el.dataset.kind),
    integrity: () => integrityCheck(),
    'tx-new': () => openTxForm(null),
    'tx-edit': el => { const t = (S.ds.transactions || []).find(x => x.id === el.dataset.id); if (t) openTxForm(t); },
    obligation: el => openObligation(el.dataset.id),
    account: el => openAccount(el.dataset.id),
    raw: el => openRaw(el.dataset.key, el.dataset.id),
    light: () => editLight(),
    filter: el => { S.filters[el.dataset.k] = el.dataset.v; render(); },
    'agenda-view': el => { S.agenda.view = el.dataset.v; render(); },
    'cal-nav': el => { const [y, m] = S.agenda.month.split('-').map(Number); const d = new Date(y, m - 1 + Number(el.dataset.d), 1); S.agenda.month = `${d.getFullYear()}-${p2(d.getMonth() + 1)}`; S.agenda.sel = null; render(); },
    'cal-day': el => { S.agenda.sel = S.agenda.sel === el.dataset.d ? null : el.dataset.d; render(); },
    'toggle-hide': async () => { await saveMeta({ hide_values: !S.meta.hide_values }); render(); },
    'backup-restore': el => restoreBackup(el.dataset.id),
    'backup-export': async el => { const b = await DB.getBackup(Number(el.dataset.id)); if (b) doExport('json', b.data, 'copia-' + b.created_at.slice(0, 16).replace(/[^0-9]/g, '')); },
    'pin-set': () => setPin(),
    'pin-remove': () => removePin(),
    wipe: () => wipe(false)
  };
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const sheet = el.closest('.sheet-wrap');
    if (sheet && ['tx-edit', 'obligation', 'raw'].includes(el.dataset.act)) { const s = S.sheets.find(x => x.el === sheet); if (s) s.close(); }
    const fn = ACTIONS[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('change', e => {
    const el = e.target.closest('[data-change]');
    if (el && el.dataset.change === 'filter') { S.filters[el.dataset.k] = el.value; render(); }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) S.hiddenAt = Date.now();
    else if (S.meta.pin && S.ds && S.hiddenAt && Date.now() - S.hiddenAt > AUTOLOCK_MS) { S.locked = true; S.sheets.slice().forEach(s => s.close()); render(); }
  });
  window.addEventListener('online', () => { if (!S.page && S.tab === 'inicio') render(); });
  window.addEventListener('offline', () => { if (!S.page && S.tab === 'inicio') render(); });

  // ---------- inicialização ----------
  async function init() {
    try {
      S.ds = (await DB.get('current')) || null;
      S.meta = (await DB.get('meta')) || {};
    } catch (e) {
      app.innerHTML = `<div class="notice danger" style="margin-top:40px">${ic('alert')}<div class="ntext"><b>Não foi possível abrir o armazenamento local.</b> No iPhone, verifique se não está em navegação privada. Detalhe: ${esc(e.message)}</div></div>`;
      return;
    }
    if (S.meta.pin && S.ds) S.locked = true;
    render();
    try { if (navigator.storage && navigator.storage.persist) S.persisted = await navigator.storage.persist(); } catch (e) { /* sem suporte */ }
    await storageInfo();
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (window.__userUpdate && !refreshing) { refreshing = true; location.reload(); } });
      navigator.serviceWorker.register('sw.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing; if (!nw) return;
          nw.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('Nova versão do app disponível', 'Atualizar', () => { window.__userUpdate = true; nw.postMessage('skipWaiting'); }, 15000);
          });
        });
      }).catch(() => { /* sem service worker: app funciona, mas não offline */ });
    }
  }
  window.__cofre = { S, C }; // para depuração
  init();
})();

</script>
