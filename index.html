        apply: (a, v) => { a.catManual = v !== a.category || a.catManual; a.category = v; if (a.catManual) a.category_auto = null; } },
      { id: 'acc', type: 'choice', q: a => ({ despesa: 'De onde saiu o dinheiro?', receita: 'Em qual conta entrou?', transferencia: 'De qual conta saiu?', pagamento_fatura: 'De qual conta saiu o pagamento?' })[a.type],
        options: a => { const o = accountOptions(() => true, a.account_id, { cards: a.type === 'despesa' }); return o.length ? o : [{ v: '__nova', label: 'Cadastrar uma conta', sub: 'você ainda não tem contas' }]; },
        apply: (a, v) => { if (v === '__nova') { S.sheets.slice(-1)[0].close(); setTimeout(() => openAccountWizard(), 50); return 'abrindo'; } a.account_id = v; a.after_snapshot = null; } },
      { id: 'to', when: a => a.type === 'transferencia' || a.type === 'pagamento_fatura', type: 'choice', q: a => a.type === 'transferencia' ? 'Para qual conta foi?' : 'Qual cartão você pagou?',
        options: a => a.type === 'transferencia' ? accountOptions(x => x.id !== a.account_id, a.to_account_id) : (ds.credit_facilities || []).map(c => ({ v: c.id, label: esc(c.name || c.id), on: a.to_account_id === c.id })),

  // ---------- leitor de comprovantes ----------

  function pageLeitor() {

  const toB64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s); };
  // Foto grande -> JPEG de até 1600 px (mais rápido e gasta menos da cota). O original continua anexado.
  async function shrinkImage(file) {
    try {
      const bmp = await createImageBitmap(file); const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      if (k === 1 && file.size < 1.5e6 && /jpe?g|png|webp/.test(file.type)) { bmp.close && bmp.close(); return { mime: file.type, base64: toB64(new Uint8Array(await file.arrayBuffer())) }; }
      const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
      cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height); bmp.close && bmp.close();
      const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85));
      return { mime: 'image/jpeg', base64: toB64(new Uint8Array(await blob.arrayBuffer())) };
    } catch (e) { return { mime: file.type || 'image/jpeg', base64: toB64(new Uint8Array(await file.arrayBuffer())) }; }
  }
  // Lê com a IA em uso. Se ela estiver sobrecarregada, tenta de novo e depois outros modelos da mesma empresa.
  async function iaRead(fileData, text, onStatus) {
    const act = iaActive(), p = act.provider;
    const models = [act.model].concat((act.list || []).filter(m => m !== act.model && !/pro|opus/.test(m) === !/pro|opus/.test(act.model))).slice(0, 3);
    let lastErr = null;
    for (let mi = 0; mi < models.length; mi++) {
      for (let tent = 0; tent < 2; tent++) {
        if (mi || tent) { if (onStatus) onStatus(`A IA está ocupada. Tentando de novo${mi ? ' com outro modelo' : ''}…`); await new Promise(r => setTimeout(r, 1200 + tent * 1500)); }
        const rq = Leitor.readRequest(p, act.key, models[mi], fileData, text, { categories: C.CATEGORIES, rules: act.rules });
        const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 60000);
        let res;
        try { res = await fetch(rq.url, Object.assign({ signal: ctl.signal }, rq.init)); }
        catch (e) { clearTimeout(timer); lastErr = new Error(e.name === 'AbortError' ? 'A IA demorou demais para responder.' : 'Não consegui falar com ' + Leitor.PROVIDERS[p].art + ' ' + Leitor.PROVIDERS[p].company + '. Confira a internet.'); continue; }
        clearTimeout(timer);
        let j = {}; try { j = await res.json(); } catch (e) { j = {}; }
        if (res.ok) {
          const out = Leitor.responseText(p, j);
          if (out.blocked && !out.text) throw new Error('A IA se recusou a ler esta imagem.');
          return Leitor.fromAi(out.text, C.CATEGORIES);
        }
        lastErr = new Error(Leitor.explainError(p, res.status, j));
        const transient = res.status >= 500 || res.status === 429 || res.status === 408;
        if (res.status === 404) break; // modelo não existe: vai para o próximo
        if (!transient) throw lastErr; // chave errada, sem crédito…: não adianta repetir
        if (res.status === 429 && /day|dia|daily|PerDay/i.test(JSON.stringify(j))) throw lastErr; // cota do dia acabou
      }
    }
    throw lastErr || new Error('A IA não respondeu.');
  }

  async function openReceiptReader() {
    await iaLoad();
    const file = await new Promise(resolve => {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*,application/pdf'; inp.style.display = 'none';
      inp.onchange = () => { resolve(inp.files && inp.files[0]); inp.remove(); };
      document.body.appendChild(inp); inp.click();
    });
    if (!file) return;
    if (file.size > 15e6) return showError('Arquivo grande demais', 'O comprovante tem mais de 15 MB. Tire um print da tela do comprovante e tente de novo.');
    const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
    const isImg = /^image\//.test(file.type) || /\.(jpe?g|png|webp|heic|heif)$/i.test(file.name || '');
    if (!isPdf && !isImg) return showError('Formato não aceito', 'Escolha uma foto, um print ou um PDF do comprovante.');
    let local = null, text = '';
    if (isPdf) {
      const sh = busySheet('Lendo o PDF aqui no aparelho…');
      try { const r = await Leitor.pdfText(new Uint8Array(await file.arrayBuffer())); text = r.text; if (r.encrypted) text = ''; local = Leitor.parseReceipt(text, { today: todayStr() }); }
      catch (e) { local = null; } finally { sh.close(); }
      if (local && local.complete) return receiptToWizard(local, file, 'aparelho');
    }
    // Não deu para ler tudo no aparelho: IA (se configurada) ou preencher à mão.
    if (!iaReady()) {
      const why = isPdf ? (text ? 'Li o PDF, mas não encontrei tudo (valor e data).' : 'Este PDF não tem texto (é uma imagem dentro do PDF).') : 'Foto e print precisam de uma IA para serem lidos.';
      const go2 = await confirmDialog({ title: isPdf ? 'Não consegui ler tudo' : 'Configurar a leitura de fotos', ok: 'Configurar IA', cancel: 'Preencher à mão',
        text: `${why}<br><br>Você pode configurar uma IA com a sua chave (o <b>Gemini tem plano grátis</b>) ou preencher à mão. Nos dois casos o comprovante fica anexado ao lançamento.` });
      if (go2) { S.sheets.slice().forEach(x => x.close()); go('mais', 'leitor'); return; }
      return receiptToWizard(local && (local.amount != null || local.date) ? local : null, file, local && (local.amount != null || local.date) ? 'aparelho' : null);
    }
    const pdfText = isPdf && text.length > 40 ? text : '';
    if (!(await iaConfirmSend(!!pdfText))) return receiptToWizard(local && (local.amount != null || local.date) ? local : null, file, local && (local.amount != null || local.date) ? 'aparelho' : null);
    const P = Leitor.PROVIDERS[iaActive().provider];
    const sh = busySheet(`<span id="ia-busy">Enviando para ${esc(P.name)}…</span><div class="small muted">Leva alguns segundos.</div>`);
    let r;
    try {
      // PDF com texto: manda só o texto (menos dados). Foto ou PDF sem texto: manda o arquivo.
      const data = pdfText ? null : isPdf ? { mime: 'application/pdf', base64: toB64(new Uint8Array(await file.arrayBuffer())) } : await shrinkImage(file);
      r = await iaRead(data, pdfText, t => { const el = document.getElementById('ia-busy'); if (el) el.textContent = t; });
    } catch (e) {
      // A IA falhou: segue direto para as perguntas, com o comprovante anexado (e o que o aparelho conseguiu ler).
      sh.close();
      const partial = local && (local.amount != null || local.date) ? local : null;
      receiptToWizard(partial, file, partial ? 'aparelho' : null);
      toast('A IA não conseguiu ler agora (' + e.message.replace(/<[^>]+>/g, '').slice(0, 140) + '). Preencha nas perguntas: o comprovante já está anexado.', null, null, 9000);
      return;
    }
    sh.close();
    if (r.notReceipt && r.amount == null) {
      const ok = await confirmDialog({ title: 'Não parece um comprovante', text: 'A IA não encontrou um comprovante nesta imagem. Quer preencher à mão mesmo assim?', ok: 'Preencher à mão', cancel: 'Cancelar' });
      if (!ok) return; return receiptToWizard(null, file, null);
    }
    receiptToWizard(r, file, P.name);
  }

        quick: () => [[inMonths(6), 'Em 6 meses'], [inMonths(12), 'Em 1 ano'], [inMonths(24), 'Em 2 anos'], ['', 'Sem prazo']], apply: (a, v) => { a.goalDate = /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : null; } },
      { id: 'amountTo', when: a => a.to && a.to !== '__nova' && destCur() !== curOf(a.from), type: 'input', q: a => `Quanto chegou em ${destCur()}?`, help: () => 'A reserva é em outra moeda. Preenchi pela cotação; ajuste para o valor que realmente chegou.',
        input: a => { const r1 = C.rateOf(ds, curOf(a.from)), r2 = C.rateOf(ds, destCur()); const g = a.amount_to || (r1 && r2 ? C.round2(a.amount * r1 / r2) : ''); return { kind: 'money', value: g ? String(g).replace('.', ',') : '' }; },
        apply: (a, v) => { const n = wzMoney(v); if (!n) return 'Digite o valor que chegou.'; a.amount_to = n; } },
      { id: 'date', type: 'input', q: () => 'Quando você guardou?', input: a => ({ kind: 'date', value: a.date }), quick: () => wzDays(today), apply: (a, v) => { if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return 'Escolha a data.'; a.date = v; } },
      { id: 'resumo', type: 'summary', q: () => 'Tudo certo?', body: a => {

            <div class="small muted" style="margin-top:4px">de <b>${esc(accountName(a.from))}</b> para <b>${esc(a.to === '__nova' ? a.newName + ' (nova reserva em ' + a.newInst + ')' : accountName(a.to))}</b> · ${fdate(a.date)}</div>

      const ds2 = C.clone(S.ds), now = nowIso();

        const sl = C.norm(a.newName).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 20) || 'reserva';
        toId = `acc-${sl}-${rand(2)}`;

        const acc = { id: toId, name: a.newName, institution: a.newInst, type: 'banco', currency: curOf(a.from), snapshot_balance: 0, snapshot_date: addDaysYmd(a.date, -1), status: 'reserva', origin: 'usuario', created_at: now, updated_at: now };

      }

        category: '', description: 'Guardado: ' + (a.to === '__nova' ? a.newName : accountName(toId)), origin: 'usuario', notes: '', tags: '', obligation_id: '', after_snapshot: null, file: null };
      if (needsSnapshotAnswer(d)) d.after_snapshot = true;
      const problems = validateDraft(d); if (problems.length) { showError('Falta algo', problems.join('<br>')); return false; }
      S.sheets.slice(-1)[0].close();
      await persistTx(null, d, { toast: false });
      toast(`${money(a.amount, curOf(a.from))} guardado em ${a.to === '__nova' ? a.newName : accountName(toId)}`);
    } });
  }

  function editObligation(o) {
    const sts = ['pendente', 'planejado', 'pago', 'cancelado']; if (o.status && !sts.includes(o.status)) sts.unshift(o.status);
    const sh = openSheet({
      title: 'Editar conta a pagar', sticky: true,
      body: `<div class="field"><label>Valor (R$)</label><input class="input num" id="o-amt" inputmode="decimal" value="${esc(String(C.amountOf(o)).replace('.', ','))}"></div>
        <div class="field"><label>Vencimento</label><input class="input" id="o-due" type="date" value="${esc(o.due_date || '')}"><p class="help">Deixe vazio se a data não for conhecida.</p></div>
        <div class="field"><label>Status</label><select class="input" id="o-st">${sts.map(s => `<option value="${esc(s)}" ${o.status === s ? 'selected' : ''}>${esc(humanize(s))}</option>`).join('')}</select>
        <p class="help">Para quitar, prefira “Registrar pagamento”: assim o valor sai do saldo certo e fica vinculado.</p></div>
        <div class="field"><label>Observação</label><textarea class="input" id="o-notes" rows="3">${esc(o.notes || '')}</textarea></div>`,
      footHtml: `<button class="btn" data-save>Salvar</button>`
    });
    sh.foot.querySelector('[data-save]').onclick = async () => {
      const g = id => sh.body.querySelector(id).value;
      const amt = C.num(g('#o-amt'));
      if (isNaN(amt) || amt < 0) { toast('Valor inválido'); return; }
      const ds2 = C.clone(S.ds); const rec = ds2.obligations.find(x => x.id === o.id);
      const before = C.clone(rec); const field = 'amount' in rec || !('amount_brl' in rec) ? 'amount' : 'amount_brl';
      rec[field] = C.round2(amt); rec.due_date = g('#o-due') || null; rec.status = g('#o-st');
      if (g('#o-notes').trim()) rec.notes = g('#o-notes').trim(); else delete rec.notes;
      const changed = Object.keys(rec).filter(k => C.stable(rec[k]) !== C.stable(before[k]));
      if (!changed.length) { sh.close(); return; }
      rec.updated_at = nowIso();
      sh.close();
      await commit(ds2, { audit: { type: 'obligation-update', description: `${obligationTitle(rec)}: ${changed.map(k => (KEYL[k] || k) + ' ' + JSON.stringify(before[k] ?? null) + ' → ' + JSON.stringify(rec[k] ?? null)).join('; ')}`, extra: { record_id: rec.id } }, toast: 'Conta atualizada' });
    };
  }

  // ---------- AGENDA ----------
  function eventsIndex(ds, ym) {
    const ev = {};
    const add = (d, e) => { if (!d) return; (ev[d] = ev[d] || []).push(e); };
    (ds.obligations || []).forEach(o => { if (o && o.due_date && C.isObligationOpen(o)) add(o.due_date, { kind: 'due', title: obligationTitle(o), amount: C.openAmountOf(o), status: o.status, act: 'obligation', id: o.id }); });
    (ds.income_forecasts || []).forEach(r => {
      if (!r) return;
      if (r.date) add(C.dateOnly(r.date), { kind: 'inc', title: humanize(r.id), amount: C.amountOf(r), status: r.status, act: 'raw', key: 'income_forecasts', id: r.id });
      else if (r.expected_day && ym && /mensal/.test(C.norm(r.frequency))) add(`${ym}-${p2(r.expected_day)}`, { kind: 'inc', title: humanize(r.id) + ' (mensal)', amount: C.amountOf(r), status: r.status, act: 'raw', key: 'income_forecasts', id: r.id });
    });
    (ds.transactions || []).forEach(t => { if (t && t.date) add(C.dateOnly(t.date), { kind: 'tx', title: t.description || TYPE_LABEL[C.txType(t)] || 'Lançamento', amount: C.num(t.amount), status: t.status, act: 'tx-edit', id: t.id, cur: t.currency }); });
    return ev;
  }
  function viewAgenda() {
    const a = S.agenda;
    if (!a.month) a.month = todayStr().slice(0, 7);
    let h = `<h1 class="page-title">Agenda</h1><div class="seg"><button class="${a.view === 'cal' ? 'on' : ''}" data-act="agenda-view" data-v="cal">Calendário</button><button class="${a.view === 'time' ? 'on' : ''}" data-act="agenda-view" data-v="time">Linha do tempo</button></div>`;
    return h + (a.view === 'cal' ? calendarView() : timelineView());
  }
  function eventRow(e) {
    const color = e.kind === 'due' ? 'var(--danger)' : (e.kind === 'inc' ? 'var(--pos)' : 'var(--info)');
    return `<button class="row-item" data-act="${e.act}" data-id="${esc(e.id)}" ${e.key ? `data-key="${esc(e.key)}"` : ''}><div class="ico" style="color:${color}">${e.kind === 'due' ? '📌' : (e.kind === 'inc' ? '💼' : '🧾')}</div>
      <div class="main"><div class="t">${esc(e.title)}</div><div class="s">${e.kind === 'due' ? 'Vencimento' : (e.kind === 'inc' ? 'Receita prevista' : 'Lançamento')} ${statusBadge(e.status)}</div></div><div class="amt ${e.kind === 'tx' && C.norm(e.status) === 'confirmado' ? '' : 'forecast'}">${M(e.amount, e.cur)}</div></button>`;
  }
  function calendarView() {
    const a = S.agenda, [y, m] = a.month.split('-').map(Number);
    const ev = eventsIndex(S.ds, a.month);
    const first = new Date(y, m - 1, 1), start = first.getDay();
    const days = new Date(y, m, 0).getDate(), today = todayStr();
    let h = `<div class="card"><div class="cal-head"><button class="icon-btn" data-act="cal-nav" data-d="-1" aria-label="Mês anterior">${ic('left')}</button><b>${(s => s.charAt(0).toUpperCase() + s.slice(1))(monthLabel(a.month))}</b><button class="icon-btn" data-act="cal-nav" data-d="1" aria-label="Próximo mês">${ic('right')}</button></div><div class="cal">`;
    ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].forEach(d => { h += `<div class="dow">${d}</div>`; });
    for (let i = 0; i < start; i++) h += `<div></div>`;
    for (let d = 1; d <= days; d++) {
      const ds = `${a.month}-${p2(d)}`, e = ev[ds] || [];
      const kinds = Array.from(new Set(e.map(x => x.kind)));
      h += `<button class="day ${ds === today ? 'today' : ''} ${a.sel === ds ? 'sel' : ''}" data-act="cal-day" data-d="${ds}" aria-label="${d} ${e.length ? e.length + ' itens' : ''}"><span>${d}</span><span class="dots">${kinds.map(k => `<i class="dot ${k}"></i>`).join('')}</span></button>`;
    }
    h += `</div><div class="tiny muted" style="display:flex;gap:12px;margin-top:10px;flex-wrap:wrap"><span><i class="dot due" style="display:inline-block"></i> vencimento</span><span><i class="dot inc" style="display:inline-block"></i> receita prevista</span><span><i class="dot tx" style="display:inline-block"></i> lançamento</span></div></div>`;
    const sel = a.sel && a.sel.startsWith(a.month) ? a.sel : null;
    if (sel) {
      const list = ev[sel] || [];

  function timelineView() {

    let h = `<div class="section-title"><span>Próximos</span></div><div class="card">`;
    h += future.length ? '<div class="rows">' + future.map(k => `<div class="tiny muted" style="padding:8px 0 0;font-weight:650">${fdate(k)}${k === today ? ' · hoje' : ''}</div>` + ev[k].map(eventRow).join('')).join('') + '</div>' : '<div class="muted small">Nada com data à frente.</div>';

  // ---------- IMPORTAÇÃO ----------
  function pickFile() {
    return new Promise(resolve => {
      const inp = document.createElement('input'); inp.type = 'file'; inp.style.display = 'none';
      inp.onchange = () => { resolve(inp.files && inp.files[0]); inp.remove(); };

  let lastRepairs = [];
  function parseJsonLenient(text) { const r = C.parseLenient(text); lastRepairs = r.repairs; return r.data; }

  // Importar colando o texto que o ChatGPT mostrou na conversa (sem precisar salvar arquivo).
  function startPasteImport() {
    const sh = openSheet({
      title: 'Colar resposta do ChatGPT',
      body: `<p class="small" style="margin-top:0">No ChatGPT, toque em <b>Copiar</b> no bloco do JSON (ou copie a resposta inteira) e cole aqui. O app encontra o JSON no meio do texto.</p>
        <textarea class="input" id="paste-json" rows="9" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Cole aqui…" style="font-family:ui-monospace,Menlo,monospace;font-size:13px"></textarea>
        <div id="paste-err" class="small" style="color:var(--danger)"></div>`,
      footHtml: `<div class="btn-row"><button class="btn secondary" data-clip>Colar da área de transferência</button><button class="btn" data-ok>Conferir</button></div>`
    });
    const ta = sh.body.querySelector('#paste-json');
    sh.foot.querySelector('[data-clip]').onclick = async () => { try { ta.value = await navigator.clipboard.readText(); } catch (e) { sh.body.querySelector('#paste-err').textContent = 'O navegador não deixou ler a área de transferência: toque e segure no campo e escolha Colar.'; } };
    sh.foot.querySelector('[data-ok]').onclick = async () => {
      const t = ta.value.trim();
      if (!t) { sh.body.querySelector('#paste-err').textContent = 'Cole o texto primeiro.'; return; }
      sh.close();
      const bytes = new TextEncoder().encode(t);
      await importFromBytes(bytes, { name: 'texto colado do ChatGPT', size: bytes.length });
    };
  }
  async function startImport() {
    const file = await pickFile();
    if (!file) return;
    let buf;
    try { buf = new Uint8Array(await file.arrayBuffer()); }
    catch (e) { showError('Não foi possível ler o arquivo', esc('Erro inesperado: ' + (e && e.message))); return; }
    await importFromBytes(buf, file);
  }
  /* Lê um backup (JSON, ZIP ou criptografado) e abre a prévia. `file` só precisa ter `name`. */
  async function importFromBytes(buf, file) {
    try {
      let text, zipFiles = [];
      if (Zip.isZip(buf)) {
        const entries = await Zip.readZip(buf);
        const js = entries.filter(e => /\.json$/i.test(e.name));
        const j = js.find(e => !e.name.includes('/')) || js[0];
        if (!j) throw Object.assign(new Error('O ZIP não contém um arquivo .json de backup.'), { friendly: true });
        text = new TextDecoder().decode(j.data);
        zipFiles = entries.filter(e => e !== j && /^comprovantes\//.test(e.name));
      } else text = new TextDecoder().decode(buf);
      let obj = parseJsonLenient(text);
      if (C.isEncrypted(obj)) {
        const pw = await promptPassword({ title: 'Backup criptografado', text: 'Digite a senha usada ao exportar este backup.' });
        if (!pw) return;
        try { obj = parseJsonLenient(await C.decryptText(obj, pw)); }
        catch (e) { if (e.friendly) throw e; throw Object.assign(new Error('Senha incorreta ou arquivo danificado.'), { friendly: true }); }
      }
      const prep = C.prepare(obj);
      if (prep.fatal) throw Object.assign(new Error(prep.fatal), { friendly: true });
      const v = C.validate(prep.data);
      const integ = await C.checkIntegrityField(prep.data);
      showImportPreview({ file, raw: obj, prep, v, integ, zipFiles, repairs: lastRepairs.slice() });
    } catch (e) {
      showError('Não foi possível ler o arquivo', esc(e.friendly ? e.message : 'Erro inesperado: ' + (e && e.message)));
    }
  }
  function describeRecord(key, it) {
    if (!it || typeof it !== 'object') return esc(String(it));
    const amt = C.amountOf(it);
    const title = it.description || it.name || (key === 'obligations' ? obligationTitle(it) : null) || humanize(C.idOf(it));

    if (it.status) parts.push(String(it.status));
    if (it.account_id) parts.push(accountName(it.account_id));
    return `<b>${esc(title)}</b><div class="small muted">${esc(parts.join(' · '))}</div>`;
  }

      const curCounts = S.ds ? countsOf(S.ds) : {};

  // ---------- EXPORTAÇÃO ----------
  async function shareOrDownload(blob, filename) {
    const file = new File([blob], filename, { type: blob.type || 'application/octet-stream' });
    if (navigator.canShare && navigator.share) {
      let can = false; try { can = navigator.canShare({ files: [file] }); } catch (e) { can = false; }
      if (can) {
        try { await navigator.share({ files: [file], title: filename }); return 'shared'; }
        catch (e) { if (e.name === 'AbortError') return 'cancelled'; if (e.name === 'NotAllowedError') return 'needs-tap'; }
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 120000);
    return 'downloaded';
  }
  async function deliver(blob, filename, onDone) {
    const r = await shareOrDownload(blob, filename);
    if (r === 'needs-tap') {
      const sh = openSheet({ title: 'Arquivo pronto', body: `<p>O arquivo <b>${esc(filename)}</b> está pronto. Toque abaixo e escolha <b>Salvar em Arquivos</b>.</p>`, footHtml: `<button class="btn" data-go>${ic('down')} Salvar / compartilhar</button>` });
      sh.foot.querySelector('[data-go]').onclick = async () => { sh.close(); const r2 = await shareOrDownload(blob, filename); if (r2 !== 'cancelled' && r2 !== 'needs-tap') onDone(r2); };
      return;
    }
    if (r !== 'cancelled') onDone(r);
    else toast('Exportação cancelada. Nada foi salvo.');
  }
  async function doExport(kind, srcDs, label) {
    const ds = srcDs || S.ds;
    const att = (ds.attachments_manifest || []).length;
    if (kind === 'json' && att && !srcDs) {
      const zip = await confirmDialog({ title: 'Comprovantes não vão no JSON', text: `Você tem ${att} comprovante(s) guardado(s) neste aparelho. O <b>JSON</b> leva só a lista deles, não as imagens.<br><br>Para um backup completo, use o <b>ZIP</b>. Para mandar ao ChatGPT, o JSON é o ideal.`, ok: 'Exportar ZIP completo', cancel: 'Só o JSON' });
      if (zip) kind = 'zip';
    }
    let text;
    try { text = JSON.stringify(await C.buildExport(ds, nowIso(), srcDs ? {} : { base: S.meta.export_base, previousExportAt: S.meta.last_export_at || S.meta.last_import_file_exported_at }), null, 2); }
    catch (e) { showError('Falha ao exportar', esc(e.message)); return; }

    if (kind === 'enc') {
      const pw = await promptPassword({ title: 'Senha do backup', confirm: true, text: '<b>Se você esquecer esta senha, o backup não poderá ser aberto por ninguém.</b> Não há recuperação. Anote num lugar seguro.' });
      if (!pw) return;
      toast('Criptografando…');
      blob = new Blob([await C.encryptText(text, pw)], { type: 'application/json' }); name = base + '_criptografado.json';
    } else if (kind === 'zip') {
      const files = [{ name: base + '.json', data: text }];
      const stored = await DB.listFiles();
      for (const m of ds.attachments_manifest || []) {
        const f = stored.find(x => x.id === m.id);
        if (f) files.push({ name: `comprovantes/${m.id}__${(m.filename || 'arquivo').replace(/[\\/:*?"<>|]/g, '_')}`, data: new Uint8Array(await f.blob.arrayBuffer()) });
      }
      blob = new Blob([Zip.createZip(files)], { type: 'application/zip' }); name = base + '_completo.zip';

    await deliver(blob, name, async () => {

  async function nToken() {
    const st = SY.state;
    if (!st || !st.session) throw nErr('Entre na sua conta para sincronizar.', { status: 401 });
    if (Date.now() > (st.session.expires_at - 60) * 1000) {
      try { st.session = sessOf(await nFetch('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: { refresh_token: st.session.refresh_token } })); await sySave(); }
      catch (e) { if (!e.offline) { st.session = null; await sySave(); throw nErr('Sua sessão expirou. Entre de novo para voltar a sincronizar.', { status: 401 }); } throw e; }
    }
    return st.session.access_token;
  }
  const rest = async (path, opts) => nFetch('/rest/v1/' + path, Object.assign({}, opts, { auth: await nToken() }));

  // Mostra as 12 palavras de recuperação, oferece copiar/salvar e confere 1 palavra sorteada.
  function showRecoveryWords(words) {
    return new Promise(resolve => {
      const k = 1 + Math.floor(Math.random() * 12);
      const texto = 'Cofre: palavras de recuperação (guarde em local seguro)\n' + words.map((w, i) => `${i + 1}. ${w}`).join('\n');
      let done = false;
      const sh = openSheet({
        title: 'Suas 12 palavras de recuperação', sticky: true,
        body: `<p class="small" style="margin-top:0">Se um dia você esquecer a senha, <b>só estas palavras</b> devolvem o acesso aos seus dados. Anote no papel ou salve no gerenciador de senhas. Elas aparecem só agora.</p>
          <div class="card" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px;font-size:15px;user-select:all">${words.map((w, i) => `<div><span class="tiny muted">${i + 1}.</span> <b>${esc(w)}</b></div>`).join('')}</div>
          <div class="btn-row" style="margin-bottom:14px"><button class="btn secondary" data-copy>Copiar</button><button class="btn secondary" data-save>Salvar arquivo</button></div>
          <div class="field"><label for="rw-k">Para conferir, digite a palavra nº ${k}</label><input class="input" id="rw-k" autocomplete="off" autocapitalize="none" spellcheck="false"></div>
          <div id="rw-err" class="small" style="color:var(--danger)"></div>`,
        footHtml: `<button class="btn" data-ok>Anotei, continuar</button>`,
        onClose: () => { if (!done) resolve(false); }
      });
      sh.body.querySelector('[data-copy]').onclick = async () => { try { await navigator.clipboard.writeText(texto); toast('Palavras copiadas: cole no seu gerenciador de senhas'); } catch (e) { toast('Não deu para copiar: anote à mão'); } };
      sh.body.querySelector('[data-save]').onclick = () => shareOrDownload(new Blob([texto], { type: 'text/plain' }), 'cofre-palavras-de-recuperacao.txt');
      sh.foot.querySelector('[data-ok]').onclick = () => {
        const p = Sigilo.parseWords(Array(12).fill(sh.body.querySelector('#rw-k').value).join(' '));
        if (p.error || p.words[0] !== words[k - 1]) { sh.body.querySelector('#rw-err').textContent = `Não confere com a palavra nº ${k}. Olhe de novo o que você anotou.`; return; }
        done = true; sh.close(); resolve(true);
      };
    });
  }

  // Preferências que sobrevivem a sair/entrar: cofre escolhido e pedido de entrada em andamento, por usuário.
  async function syPref() { try { return (await DB.get('sync_pref')) || {}; } catch (e) { return {}; } }
  async function sySetPref(patch) { const p = Object.assign(await syPref(), patch); await DB.set('sync_pref', p); return p; }
  const hexOf = u8 => Array.from(u8).map(b => b.toString(16).padStart(2, '0')).join('');
  async function syInviteToken() {
    let v = null; try { v = await DB.get('sync_invite'); } catch (e) { v = null; }
    return v && v.token && Date.now() - v.at < 48 * 3600e3 ? v.token : null;
  }
  // Aceita o convite guardado neste aparelho (link aberto). Não dá acesso ainda: o dono precisa aprovar.
  async function syAcceptInvite() {
    const tok = await syInviteToken(); if (!tok) return null;
    const uid = SY.state.user.id;
    try {
      const r = (await rest('rpc/accept_invite_v2', { method: 'POST', body: { token: tok } }))[0];
      if (!r) throw nErr('Convite inválido, já usado ou expirado. Peça um novo link.');
      const me = (await rest('profiles?select=enc_public_key&user_id=eq.' + uid))[0];
      const code = await Sigilo.safetyCode(me.enc_public_key, r.owner_enc_public_key);
      SY.state.pending = { vault_id: r.vault_id, role: r.role, owner_email: r.owner_email || 'o dono do cofre', code, since: nowIso() };
      await sySetPref({ ['pending_' + uid]: SY.state.pending });
      await sySave();
      return SY.state.pending;
    } catch (e) {
      if (e.status === 400 || /inválido|expirado|já é membro/.test(e.message)) throw nErr(/já é membro/.test(e.message) ? 'Você já faz parte deste cofre.' : 'Convite inválido, já usado ou expirado. Peça um novo link a quem convidou.');
      throw e;
    } finally { await DB.set('sync_invite', null); S.syInvited = false; }
  }
  async function syActivate(m) {
    const vk = await Sigilo.vaultKeys(await Sigilo.unlockVaultSecret(m.wrapped_vault_key, SY.keys.encPrivate, m.vault_id));
    SY.keys = { encPrivate: SY.keys.encPrivate, signPrivate: SY.keys.signPrivate, data: vk.data, rid: vk.rid };
    const changed = SY.state.vault_id !== m.vault_id;
    Object.assign(SY.state, { vault_id: m.vault_id, role: m.role, key_version: m.key_version, wrapped_vault_key: m.wrapped_vault_key, connected_at: nowIso() });
    if (changed) Object.assign(SY.state, { cursor: 0, base: {}, conflicts: [] });
    delete SY.state.removed;
    await DB.set('sync_keys', SY.keys); await sySave();
    await sySetPref({ ['vault_' + SY.state.user.id]: m.vault_id });
  }
  async function syCreateOwnVault(uid) {
    const v = (await rest('vaults', { method: 'POST', body: { owner_id: uid }, headers: { Prefer: 'return=representation' } }))[0];
    const me = (await rest('profiles?select=enc_public_key&user_id=eq.' + uid))[0];
    const wrapped = await Sigilo.lockForMember(Sigilo.newVaultSecret(), me.enc_public_key, v.id);
    await rest('vault_members', { method: 'POST', body: { vault_id: v.id, user_id: uid, role: 'owner', wrapped_vault_key: wrapped, key_version: 1, added_by: uid }, headers: { Prefer: 'return=minimal' } });
    return { vault_id: v.id, role: 'owner', wrapped_vault_key: wrapped, key_version: 1 };
  }

  // Login ou cadastro. A senha nunca sai do aparelho: vai só a "prova" derivada dela.
  async function syConnect(mode, email, password) {
    await syLoad();
    email = String(email).trim().toLowerCase();
    toast('Protegendo a senha… (alguns segundos)', null, null, 60000);
    const pw = await Sigilo.fromPassword(email, password);
    let j;
    if (mode === 'signup') {
      j = await nFetch('/auth/v1/signup', { method: 'POST', body: { email, password: pw.authSecret } });
      if (!j || !j.access_token) return { needsConfirm: true, email };
    } else j = await nFetch('/auth/v1/token?grant_type=password', { method: 'POST', body: { email, password: pw.authSecret } });
    return syAfterAuth(j, email, pw);
  }
  // Depois de autenticado (login, cadastro ou recuperação): chaves, convite e cofre.
  async function syAfterAuth(j, email, pw) {
    const uid = j.user.id;
    SY.state = { user: { id: uid, email }, session: sessOf(j), vault_id: null, cursor: 0, base: {}, conflicts: [], last_sync_at: null };
    SY.keys = null;
    await sySave();
    let uk = (await rest('user_keys?select=*'))[0];
    if (!uk) {
      document.querySelectorAll('.toast').forEach(t => t.remove());
      const keys = await Sigilo.newUserKeys(), pub = await Sigilo.publicKeys(keys), code = Sigilo.newRecoveryWords();
      if (!(await showRecoveryWords(code))) { await syForget(); throw nErr('Cadastro interrompido antes de anotar as palavras de recuperação. Nada foi enviado. Entre de novo para continuar.'); }
      toast('Criando suas chaves…', null, null, 60000);
      await rest('profiles', { method: 'POST', body: Object.assign({ user_id: uid, email }, pub), headers: { Prefer: 'resolution=merge-duplicates,return=minimal' } });
      await rest('user_keys', { method: 'POST', body: { user_id: uid, wrapped_private_keys: await Sigilo.lockPrivate(keys, pw.kek), recovery_wrapped_private_keys: await Sigilo.lockPrivate(keys, await Sigilo.recoveryKek(code)), kdf: pw.kdf }, headers: { Prefer: 'return=minimal' } });
      uk = (await rest('user_keys?select=*'))[0];
    } else rest('profiles?user_id=eq.' + uid, { method: 'PATCH', body: { email }, headers: { Prefer: 'return=minimal' } }).catch(() => {});
    const priv = await Sigilo.unlockPrivate(uk.wrapped_private_keys, pw.kek);
    SY.keys = { encPrivate: priv.encPrivate, signPrivate: priv.signPrivate };
    await DB.set('sync_keys', SY.keys);
    // Convite aberto neste aparelho? Aceita (fica aguardando a aprovação do dono).
    let pend = null, inviteError = null;
    try { pend = await syAcceptInvite(); } catch (e) { if (e.offline) throw e; inviteError = e.message; } // convite ruim não impede o login
    pend = pend || (await syPref())['pending_' + uid] || null;
    if (pend) SY.state.pending = pend;
    let mem = await rest('vault_members?select=vault_id,role,wrapped_vault_key,key_version&user_id=eq.' + uid);
    if (SY.state.pending && mem.some(x => x.vault_id === SY.state.pending.vault_id)) { delete SY.state.pending; await sySetPref({ ['pending_' + uid]: null }); }
    let created = false;
    if (!mem.length) {
      if (SY.state.pending) { await sySave(); document.querySelectorAll('.toast').forEach(t => t.remove()); return { pending: true }; } // entrando num cofre de outra pessoa: não cria um próprio
      mem = [await syCreateOwnVault(uid)]; created = true;
    }
    const want = (await syPref())['vault_' + uid];
    const m = mem.find(x => x.vault_id === want) || mem.find(x => x.role === 'owner') || mem[0];
    await syActivate(m);
    document.querySelectorAll('.toast').forEach(t => t.remove());
    // sameVault: este aparelho já sincronizava este cofre (ex.: saiu e entrou de novo) → junta sem perguntar
    return { created, pending: !!SY.state.pending, inviteError, sameVault: want === m.vault_id };
  }

  // ---------- Esqueci minha senha ----------
  // 1) o servidor manda um link por e-mail; 2) o link volta ao app com uma sessão temporária;
  // 3) a pessoa digita as 12 palavras e a senha nova; as chaves são retrancadas com a senha nova.
  const appUrl = () => location.origin + location.pathname;
  async function syRecoverStart(email) {
    await nFetch('/auth/v1/recover?redirect_to=' + encodeURIComponent(appUrl()), { method: 'POST', body: { email: String(email).trim().toLowerCase() } });
  }
  async function syRecoverFinish(words, newPassword) {
    await syLoad();
    const r = S.syRecovery; if (!r) throw nErr('O link de recuperação expirou. Peça outro.');
    const parsed = Sigilo.parseWords(words); if (parsed.error) throw nErr(parsed.error);
    const user = await nFetch('/auth/v1/user', { auth: r.access_token });
    const email = String(user.email).toLowerCase();
    SY.state = { user: { id: user.id, email }, session: sessOf(r) }; await sySave();
    const uk = (await rest('user_keys?select=*'))[0];
    if (!uk) throw nErr('Esta conta ainda não tem dados protegidos. Entre normalmente e crie a senha.');
    toast('Conferindo as palavras…', null, null, 60000);
    const pw = await Sigilo.fromPassword(email, newPassword);
    let novo; // erra aqui se as palavras não conferem; nesse caso nada é enviado ao servidor
    try { novo = await Sigilo.relock(uk.recovery_wrapped_private_keys, await Sigilo.recoveryKek(parsed.words), pw.kek); }
    catch (e) { throw nErr('As 12 palavras não conferem com as desta conta. Confira a ordem e a grafia.'); }
    await rest('user_keys?user_id=eq.' + user.id, { method: 'PATCH', body: { wrapped_private_keys: novo, kdf: pw.kdf }, headers: { Prefer: 'return=minimal' } });
    await nFetch('/auth/v1/user', { method: 'PUT', auth: await nToken(), body: { password: pw.authSecret } });
    S.syRecovery = null;
    const res = await syAfterAuth(Object.assign({}, r, { user: { id: user.id } }), email, pw);
    document.querySelectorAll('.toast').forEach(t => t.remove());
    return res;
  }

  // Quem pediu para entrar: confere se o dono já aprovou e, se sim, troca para o cofre compartilhado.
  async function syCheckPending(manual, fromRun) {
    await syLoad(); const st = SY.state;
    if (!st || !st.pending || !st.session || !SY.keys) return false;
    const mem = await rest(`vault_members?select=vault_id,role,wrapped_vault_key,key_version&vault_id=eq.${st.pending.vault_id}&user_id=eq.${st.user.id}`);
    if (!mem.length) { if (manual) toast('Ainda aguardando a aprovação de ' + st.pending.owner_email); return false; }
    const owner = st.pending.owner_email;
    if (S.ds && Object.keys(S.ds).length) {
      const juntar = await confirmDialog({ title: 'Acesso aprovado', text: `Você entrou no cofre de <b>${esc(owner)}</b>, mas este aparelho já tem dados.<br><br><b>Usar só os do cofre</b> (recomendado): os dados deste aparelho são trocados pelos do cofre; os atuais ficam numa cópia automática.<br><br><b>Juntar</b>: seus dados atuais são enviados para o cofre compartilhado e todos os membros passam a vê-los.`, ok: 'Juntar', cancel: 'Usar só os do cofre' });
      if (!juntar) { await DB.saveWithBackup(makeBackup(S.ds, 'Antes de entrar no cofre de ' + owner), null, S.meta); S.ds = null; }
    }
    await syActivate(mem[0]);
    delete st.pending; await sySetPref({ ['pending_' + st.user.id]: null }); await sySave();
    toast('Acesso aprovado: agora vocês compartilham o mesmo cofre');
    render();
    if (!fromRun) await syRun(manual); // dentro de syRun a sincronização continua sozinha (evita esperar por si mesma)
    return true;
  }
  // Volta para um cofre só seu (depois de sair ou ser removido de um compartilhado).
  async function syUseOwn() {
    await syLoad(); const uid = SY.state.user.id;
    const mem = await rest('vault_members?select=vault_id,role,wrapped_vault_key,key_version&user_id=eq.' + uid + '&role=eq.owner');
    await syActivate(mem[0] || await syCreateOwnVault(uid));
    toast('Sincronizando com um cofre só seu'); render(); await syRun(true);
  }


  // Baixa, junta e envia. Sem conexão: tenta de novo depois, sem perder nada.
  let syRunning = null, syTimer = null;
  function syLater(ms) { clearTimeout(syTimer); syTimer = setTimeout(() => { syRun(false); }, ms || 2500); }
  // Baixa (e confere a assinatura de) todos os registros do cofre depois de `since`.
  async function syFetch(V, since) {
    const signOf = {};
    (await rest('profiles?select=user_id,sign_public_key')).forEach(p => { signOf[p.user_id] = p.sign_public_key; });
    const remote = []; let cursor = since || 0, bad = 0;
    for (;;) {
      const rows = await rest(`records?select=rid,ciphertext,iv,key_version,sig,deleted,rev,updated_by&vault_id=eq.${V}&rev=gt.${cursor}&order=rev.asc&limit=500`);
      for (const r of rows) {
        cursor = Math.max(cursor, r.rev);
        const ok = signOf[r.updated_by] && await Sigilo.verifyRecord(signOf[r.updated_by], V, r.rid, r.key_version, r.iv, r.ciphertext, r.deleted, r.sig);
        if (!ok) { bad++; continue; }
        let payload; try { payload = await Sigilo.openRecord(SY.keys.data, V, r.rid, r.key_version, r); } catch (e) { bad++; continue; }
        if (!payload || !payload.key || await Sigilo.rid(SY.keys.rid, payload.key) !== r.rid || !!payload.deleted !== !!r.deleted) { bad++; continue; }
        remote.push({ payload, hash: payload.deleted ? undefined : await Sync.hashOf(payload) });
      }
      if (rows.length < 500) break;
    }
    return { remote, cursor, bad };
  }
  // Registros "de bastidor" que viajam com o cofre mas ficam fora dos dados: chave da IA da família e cotação do dia.
  const FX_SYNC_KEY = '__cotacao';
  async function sideRecords() {
    const out = {};
    if (S.ia && S.ia.shared) out[IA_SYNC_KEY] = S.ia.shared;
    try {
      const c = await DB.get('fx_cache');
      if (c && c.data && S.ds && c.main === C.mainCurrency(S.ds)) {
        const used = currenciesInUse(S.ds).map(x => x.toLowerCase()), data = {};
        used.forEach(k => { if (c.data[k] > 0) data[k] = c.data[k]; });
        if (Object.keys(data).length) out[FX_SYNC_KEY] = { main: c.main, date: c.date, data };
      }
    } catch (e) { /* sem cotação */ }
    return out;
  }
  // Cotação vinda da nuvem mais nova que a deste aparelho: passa a valer aqui (todos usam a mesma tabela).
  async function adoptFx(v, ds) {
    ds = ds || S.ds;
    if (!v || !v.data || !ds || v.main !== C.mainCurrency(ds)) return false;
    let c = null; try { c = await DB.get('fx_cache'); } catch (e) { c = null; }
    if (c && c.main === v.main && c.date >= v.date) return false;
    const merged = Object.assign({}, (c && c.main === v.main && c.data) || {}, v.data);
    await DB.set('fx_cache', { main: v.main, date: v.date, data: merged, fetched_at: (c && c.fetched_at) || 0, source: 'nuvem do cofre' });
    C.setAutoRates(v.main, v.date, merged); return true;
  }
  // Código dos dados: igual em dois aparelhos = dados idênticos (independe da ordem das listas).
  async function dataCode(ds) {
    const { h } = await Sync.hashes(ds || {});
    const all = Object.keys(h).sort().map(k => k + '=' + h[k]).join('|');
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(all));
    const hex = Array.from(new Uint8Array(buf).slice(0, 4)).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
    return hex.slice(0, 4) + '-' + hex.slice(4);
  }
  /* Conferência completa com a nuvem: envia o que falta, baixa TODOS os registros e compara.
     A nuvem é a fonte da verdade: se este aparelho ficou diferente, passa a ter exatamente os dados da nuvem
     (com cópia automática do que havia antes). */
  let syVerifying = null;
  function syVerify(manual) {
    if (syVerifying) return syVerifying;
    syVerifying = (async () => {
      if (!syReady()) return null;
      if (manual) toast('Conferindo com a nuvem…', null, null, 60000);
      try {
        await syRun(false);
        if (!syReady()) return null;
        const st = SY.state, V = st.vault_id;
        const got = await syFetch(V, 0);
        const server = {};
        for (const x of got.remote) Sync.apply(server, x.payload);
        const fxSrv = server[FX_SYNC_KEY];
        [IA_SYNC_KEY, FX_SYNC_KEY].forEach(k => delete server[k]);
        if (fxSrv) await adoptFx(fxSrv, Object.keys(server).length ? server : S.ds);
        const local = C.clone(S.ds || {});
        const [hs, hl] = [(await Sync.hashes(server)).h, (await Sync.hashes(local)).h];
        const keys = new Set(Object.keys(hs).concat(Object.keys(hl)));
        let onlyServer = 0, onlyLocal = 0, differ = 0;
        keys.forEach(k => { if (!(k in hl)) onlyServer++; else if (!(k in hs)) onlyLocal++; else if (hs[k] !== hl[k]) differ++; });
        const total = onlyServer + onlyLocal + differ;
        if (total && Object.keys(server).length) {
          const backup = S.ds ? makeBackup(S.ds, 'Antes de igualar com a nuvem') : null;
          await DB.saveWithBackup(backup, server, S.meta);
          S.ds = server;
          const nb = (await Sync.hashes(Object.assign({}, server, await sideRecords()))).h;
          Object.assign(st, { base: nb, cursor: got.cursor });
        }
        const code = await dataCode(S.ds);
        Object.assign(st, { verified_at: nowIso(), verified_code: code, verified_fixed: total, last_error: null });
        await sySave();
        document.querySelectorAll('.toast').forEach(t => t.remove());
        if (total && Object.keys(server).length) { render(); toast(`Este aparelho estava diferente da nuvem (${total} item(ns)). Agora está igual. Uma cópia do anterior ficou em Backup.`, null, null, 8000); }
        else if (manual) toast('Tudo certo: este aparelho está igual à nuvem · código ' + code);
        if (S.page === 'sync') render();
        return { total, code };
      } catch (e) {
        document.querySelectorAll('.toast').forEach(t => t.remove());
        if (manual) showError('Conferência', esc(e.friendly ? e.message : 'Erro inesperado: ' + (e && e.message)));
        return null;
      }
    })().finally(() => { syVerifying = null; });
    return syVerifying;
  }
  function syRun(manual) {
    if (syRunning) return syRunning;
    syRunning = (async () => {
      await syLoad();
      if (SY.state && SY.state.pending && SY.state.session && SY.keys) { try { await syCheckPending(manual, true); } catch (e) { /* tenta depois */ } }
      if (!syReady()) { if (manual) go('mais', 'sync'); return; }
      const st = SY.state, V = st.vault_id, kv = st.key_version || 1;
      if (manual) toast('Sincronizando…', null, null, 60000);
      try {
        const eu = await rest(`vault_members?select=role&vault_id=eq.${V}&user_id=eq.${st.user.id}`);
        if (!eu.length) { // o dono removeu este acesso: para de sincronizar, sem apagar nada daqui
          st.removed = { vault_id: V, at: nowIso() }; st.vault_id = null; await sySave();
          document.querySelectorAll('.toast').forEach(t => t.remove());
          toast('Seu acesso ao cofre compartilhado foi removido'); render(); return;
        }
        st.role = eu[0].role;
        if (!st.email_ok) { // contas antigas: grava o e-mail no perfil (aparece para quem divide o cofre)
          try { const me = (await rest('profiles?select=email&user_id=eq.' + st.user.id))[0]; if (me && !me.email) await rest('profiles?user_id=eq.' + st.user.id, { method: 'PATCH', body: { email: st.user.email }, headers: { Prefer: 'return=minimal' } }); st.email_ok = true; } catch (e) { /* tenta na próxima */ }
        }
        if (st.role === 'owner') {
          const reqs = await rest(`vault_invites?select=id&vault_id=eq.${V}&status=eq.accepted`);
          if (reqs.length && reqs.length !== st.requests) toast(`${reqs.length} pessoa(s) pedindo para entrar no cofre`, 'Ver', () => go('mais', 'sync'), 6000);
          st.requests = reqs.length;
        }
        // 1) baixar o que mudou desde a última vez
        const got = await syFetch(V, st.cursor || 0); const remote = got.remote; let cursor = got.cursor; const bad = got.bad;
        // 2) juntar com o que está neste aparelho
        const cur = S.ds;
        await iaLoad();
        const iaBefore = JSON.stringify(S.ia.shared || null);
        // Cotação: se a da nuvem for mais nova, passa a valer aqui antes de juntar (evita mandar a antiga de volta).
        const fxRemote = remote.filter(x => x.payload.key === '@' + FX_SYNC_KEY && !x.payload.deleted).pop();
        const fxChanged = fxRemote ? await adoptFx(fxRemote.payload.value) : false;
        const withIa = Object.assign({}, cur || {}, await sideRecords()); // chave da IA e cotação (ficam fora de S.ds)
        const m = await Sync.merge(withIa, st.base || {}, remote);
        // 3) enviar o que mudou aqui (quem é "só vê" não envia)
        if (S.ds !== cur) { syLater(1500); return; } // você editou durante a sincronização: refaz em seguida
        const p = st.role === 'viewer' ? { ups: [], dels: [] } : await Sync.plan(m.ds, m.base);
        const rows = [];
        for (const u of p.ups.concat(p.dels)) {
          const r = await Sigilo.rid(SY.keys.rid, u.payload.key), del = !!u.payload.deleted;
          const box = await Sigilo.sealRecord(SY.keys.data, V, r, kv, u.payload);
          rows.push({ vault_id: V, rid: r, iv: box.iv, ciphertext: box.ciphertext, key_version: kv, deleted: del, sig: await Sigilo.signRecord(SY.keys.signPrivate, V, r, kv, box.iv, box.ciphertext, del) });
        }
        for (let i = 0; i < rows.length; i += 200) await rest('records?on_conflict=vault_id,rid', { method: 'POST', body: rows.slice(i, i + 200), headers: { Prefer: 'resolution=merge-duplicates,return=minimal' } });
        for (const u of p.ups) m.base[u.payload.key] = u.hash;
        for (const d of p.dels) delete m.base[d.payload.key];
        const fxNew = m.ds[FX_SYNC_KEY]; const iaNew = m.ds[IA_SYNC_KEY] || null; delete m.ds[IA_SYNC_KEY]; delete m.ds[FX_SYNC_KEY];
        const fxAfter = fxNew ? await adoptFx(fxNew, m.ds) : false; // aparelho que acabou de entrar (antes não tinha dados)
        const iaChanged = JSON.stringify(iaNew) !== iaBefore;
        if (iaChanged && JSON.stringify(S.ia.shared || null) === iaBefore) { S.ia.shared = iaNew; await iaSave(); }
        const side = x => x.key === '@' + IA_SYNC_KEY || x.key === '@' + FX_SYNC_KEY;
        m.appliedList = m.appliedList.filter(x => !side(x)); m.applied = m.appliedList.length;
        m.conflicts = m.conflicts.filter(x => !side(x));
        // 4) gravar neste aparelho o que veio de fora
        if (m.applied) {
          let fin = m.ds;
          if (S.ds !== cur) { fin = C.clone(S.ds || {}); m.appliedList.forEach(x => Sync.apply(fin, x)); }
          const backup = cur && (m.deletions || m.applied >= 10) ? makeBackup(cur, 'Antes de aplicar a sincronização') : null;
          await DB.saveWithBackup(backup, fin, S.meta);
          S.ds = fin;
        }
        Object.assign(st, { base: m.base, cursor, last_sync_at: nowIso(), last_error: null, bad_records: bad, last_sent: rows.length, last_received: m.applied });
        if (m.conflicts.length) st.conflicts = (st.conflicts || []).concat(m.conflicts).slice(-50);
        await sySave();
        if (m.applied || fxChanged || fxAfter || S.page === 'sync' || (iaChanged && S.page === 'leitor')) render();
        if (manual) { document.querySelectorAll('.toast').forEach(t => t.remove()); toast(`Sincronizado · ${m.applied} recebido(s), ${rows.length} enviado(s)`); }
        else if (m.applied) toast(`${m.applied} alteração(ões) recebida(s) de outro aparelho`);
      } catch (e) {
        st.last_error = e.friendly ? e.message : 'Erro inesperado: ' + (e && e.message);
        try { await sySave(); } catch (e2) { /* ignora */ }
        if (manual) { document.querySelectorAll('.toast').forEach(t => t.remove()); showError('Sincronização', esc(st.last_error)); }
        if (S.page === 'sync') render();
      }
    })().finally(() => { syRunning = null; });
    return syRunning;
  }

  let syPeople = null;
  async function syFillPeople() {
    const el = document.getElementById('sy-people'); if (!el || !syReady()) return;
    const st = SY.state, V = st.vault_id, owner = st.role === 'owner';
    try {
      const [mem, profs, invs] = await Promise.all([
        rest(`vault_members?select=user_id,role,created_at&vault_id=eq.${V}`),
        rest('profiles?select=user_id,email,enc_public_key'),
        owner ? rest(`vault_invites?select=id,role,status,accepted_by,expires_at,created_at&vault_id=eq.${V}&status=in.(pending,accepted)&order=created_at.desc`) : Promise.resolve([])
      ]);
      const prof = {}; profs.forEach(x => { prof[x.user_id] = x; });
      const myPub = prof[st.user.id] && prof[st.user.id].enc_public_key;
      syPeople = { mem, prof, invs, myPub };
      const roleName = r => r === 'owner' ? 'Dono' : r === 'editor' ? 'Pode editar' : 'Só vê';
      let h = '';
      const reqs = invs.filter(i => i.status === 'accepted' && i.accepted_by && prof[i.accepted_by]);

      }
      h += '<div class="rows">' + mem.sort((a, b) => (a.role === 'owner' ? -1 : b.role === 'owner' ? 1 : 0)).map(m => {
        const me = m.user_id === st.user.id, mail = (prof[m.user_id] || {}).email || 'membro';
        const acts = owner && !me ? `<div style="display:flex;gap:6px;width:100%;padding-left:52px;margin-top:6px"><button class="chip" data-act="sy-role" data-id="${esc(m.user_id)}" data-role="${m.role === 'editor' ? 'viewer' : 'editor'}">${m.role === 'editor' ? 'Mudar para só ver' : 'Deixar editar'}</button><button class="chip" data-act="sy-remove" data-id="${esc(m.user_id)}" style="color:var(--danger)">Remover</button></div>` : '';

      }).join('') + '</div>';
      const open = invs.filter(i => i.status === 'pending' && Date.parse(i.expires_at) > Date.now());
      if (open.length) h += `<div class="small muted" style="margin-top:10px">Convites ainda não usados: ${open.map(i => `${roleName(i.role).toLowerCase()} · expira ${fdatetime(i.expires_at)} <button class="link" data-act="sy-cancel-inv" data-id="${esc(i.id)}">cancelar</button>`).join(' · ')}</div>`;

      else h += `<button class="btn ghost" data-act="sy-leave" style="margin-top:12px;color:var(--danger)">Sair deste cofre compartilhado</button>`;
      el.innerHTML = h;
    } catch (e) { el.innerHTML = `<div class="muted small">${esc(e.friendly ? e.message : 'Não foi possível carregar as pessoas.')}</div>`; }
  }
  async function syInvite() {
    const sh = openSheet({

        const link = location.origin + location.pathname + '#convite=' + tok;

            <input class="input" id="inv-link" readonly value="${esc(link)}" style="font-size:13px">

  async function syApprove(id) {
    const P = syPeople; const i = P && P.invs.find(x => x.id === id); if (!i) return;
    const who = P.prof[i.accepted_by]; const st = SY.state;
    const code = await Sigilo.safetyCode(P.myPub, who.enc_public_key);
    const ok = await confirmDialog({ title: 'Conferir código', text: `Pergunte a <b>${esc(who.email || 'pessoa')}</b> qual código aparece no celular dela. Só aprove se for exatamente:<div class="num" style="font-size:36px;font-weight:800;letter-spacing:8px;text-align:center;margin:14px 0">${esc(code)}</div>Se for diferente, <b>recuse</b>: alguém pode estar tentando se passar por ela.`, ok: 'É igual: aprovar', cancel: 'Voltar' });
    if (!ok) return;
    try {
      const secret = await Sigilo.unlockVaultSecret(st.wrapped_vault_key, SY.keys.encPrivate, st.vault_id);
      const wrapped = await Sigilo.lockForMember(secret, who.enc_public_key, st.vault_id);
      await rest('vault_members', { method: 'POST', body: { vault_id: st.vault_id, user_id: i.accepted_by, role: i.role, wrapped_vault_key: wrapped, key_version: st.key_version || 1, added_by: st.user.id }, headers: { Prefer: 'return=minimal' } });
      await rest('vault_invites?id=eq.' + i.id, { method: 'PATCH', body: { status: 'approved' }, headers: { Prefer: 'return=minimal' } });
      toast((who.email || 'A pessoa') + ' agora tem acesso'); syFillPeople();
    } catch (e) { showError('Aprovação', esc(e.friendly ? e.message : 'Erro inesperado: ' + e.message)); }
  }

  // ---------- MOEDAS, CÂMBIO E CADASTRO DE CONTAS ----------
  const COMMON_CURRENCIES = ['BRL', 'USD', 'EUR', 'GBP', 'ARS', 'CLP', 'UYU', 'PYG', 'COP', 'PEN', 'MXN', 'CAD', 'AUD', 'CHF', 'JPY', 'CNY'];
  const BANKS = ['Nubank', 'Itaú', 'Bradesco', 'Banco do Brasil', 'Caixa', 'Santander', 'Inter', 'C6 Bank', 'BTG Pactual', 'XP', 'Mercado Pago', 'PicPay', 'PagBank', 'Sicoob', 'Sicredi', 'Banrisul', 'Neon', 'Safra', 'InfinitePay', 'Revolut', 'Wise', 'Nomad', 'Avenue', 'N26'];
  function currencyOptions(selected) {
    let all = [];
    try { all = Intl.supportedValuesOf('currency'); } catch (e) { all = []; }
    const rest = all.filter(c => !COMMON_CURRENCIES.includes(c));
    const opt = c => `<option value="${c}" ${c === selected ? 'selected' : ''}>${c} · ${esc(curName(c))}</option>`;
    return `<optgroup label="Mais usadas">${COMMON_CURRENCIES.map(opt).join('')}</optgroup>` + (rest.length ? `<optgroup label="Todas">${rest.map(opt).join('')}</optgroup>` : '');
  }
  // Moedas que aparecem nos dados (contas, lançamentos, contas a pagar), exceto a principal.
  function currenciesInUse(ds) {
    const set = new Set();
    (ds.accounts || []).forEach(a => a && a.currency && set.add(String(a.currency).toUpperCase()));
    (ds.transactions || []).forEach(t => t && t.currency && set.add(String(t.currency).toUpperCase()));
    (ds.obligations || []).forEach(o => o && set.add(C.currencyOf(o, ds)));
    const rates = (ds.settings && ds.settings.exchange_rates) || {};
    Object.keys(rates).forEach(c => set.add(c));
    set.delete(C.mainCurrency(ds));
    return Array.from(set).sort();
  }
  // ---------- cotação automática ----------
  // Tabela pública diária (fawazahmed0/currency-api, publicada no npm e servida pelo jsDelivr; espelho de reserva).
  // Ela traz TODAS as moedas: o serviço não fica sabendo quais você tem nem quanto. Fica neste aparelho (não sincroniza).
  const FX_URLS = cur => [`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/${cur}.min.json`, `https://latest.currency-api.pages.dev/v1/currencies/${cur}.min.json`];
  const FX_MAX_AGE = 6 * 3600e3;
  let fxBusy = null;
  const fxOn = ds => !(ds && ds.settings && ds.settings.auto_rates === false);
  async function fxLoadCache() {
    try { const c = await DB.get('fx_cache'); if (c && c.data) C.setAutoRates(c.main, c.date, c.data); return c || null; } catch (e) { return null; }
  }
  // force: ignora o intervalo de 6 h. Devolve true se a tabela mudou.
  function fxRefresh(force) {
    if (fxBusy) return fxBusy;
    fxBusy = (async () => {
      if (!S.ds || !fxOn(S.ds)) return false;
      const main = C.mainCurrency(S.ds), cur = main.toLowerCase();
      let cache = null; try { cache = await DB.get('fx_cache'); } catch (e) { cache = null; }
      if (!force && cache && cache.main === main && Date.now() - cache.fetched_at < FX_MAX_AGE) return false;
      let lastErr = null;
      for (const url of FX_URLS(cur)) {
        try {
          const r = await fetch(url, { cache: 'no-store', credentials: 'omit' });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const j = await r.json();
          const data = j && j[cur];
          if (!j || typeof j.date !== 'string' || !data || typeof data !== 'object' || !(Object.values(data).filter(v => v > 0).length > 20)) throw new Error('tabela inválida');
          const novo = { main, date: j.date, data, fetched_at: Date.now(), source: url.includes('jsdelivr') ? 'jsDelivr' : 'espelho' };
          await DB.set('fx_cache', novo);
          C.setAutoRates(main, j.date, data);
          S.fxError = null;
          return !cache || cache.date !== j.date || cache.main !== main;
        } catch (e) { lastErr = e; }
      }
      S.fxError = navigator.onLine === false || (lastErr && lastErr.name === 'TypeError') ? 'sem conexão com o serviço de cotação' : 'o serviço de cotação respondeu com erro';
      return false;
    })().then(changed => { if (changed || S.page === 'moedas') render(); if (changed && syReady()) syLater(3000); return changed; }).finally(() => { fxBusy = null; });
    return fxBusy;
  }
  function fmtRate(v, cur) {
    const d = v >= 100 ? 2 : v >= 1 ? 4 : 6;
    return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: cur, minimumFractionDigits: 2, maximumFractionDigits: d }).format(v).replace(/\s/g, ' ');
  }
  function pageMoedas() {
    const ds = S.ds, MC = C.mainCurrency(ds), used = currenciesInUse(ds), auto = C.autoRatesState(), on = fxOn(ds);
    let h = backBar('Mais', 'mais') + `<h1 class="page-title">Moedas e câmbio</h1>
      <div class="card"><div class="lbl">Moeda principal</div>
        <div style="font-size:20px;font-weight:700;margin:2px 0 4px">${esc(MC)} · ${esc(curName(MC))}</div>
        <p class="small muted" style="margin:0 0 10px">O patrimônio total e os resumos aparecem nesta moeda. Contas em outras moedas são convertidas pela cotação abaixo.</p>
        <button class="btn secondary" data-act="cur-main">Trocar moeda principal</button></div>
      <div class="section-title"><span>Cotações</span></div>
      <div class="card"><label class="check" style="padding-top:0"><input type="checkbox" data-act="fx-toggle" ${on ? 'checked' : ''}><div><b>Atualizar automaticamente</b><div class="small muted">${on ? (auto.main === MC && auto.date ? `Cotações de ${esc(fdate(auto.date))}. O app confere de novo a cada 6 horas.` : 'Ainda não baixou a tabela de cotações.') : 'Desligado: só valem as cotações que você fixar.'}${on && S.fxError ? ` <span style="color:var(--warn)">Última tentativa falhou: ${esc(S.fxError)}${auto.date ? '; usando a tabela anterior' : ''}.</span>` : ''}</div></div></label>
        ${on ? `<button class="btn secondary" data-act="fx-now">Atualizar agora</button>` : ''}</div>`;
    if (!used.length) return h + `<div class="card muted small">Todas as contas estão em ${esc(MC)}. Quando você cadastrar uma conta em outra moeda, a cotação dela aparece aqui.</div>`;
    h += `<div class="card"><div class="rows">` + used.map(c => {
      const info = C.rateInfo(ds, c);
      const tag = info.source === 'fixada' ? '<span class="badge gold">fixada por você</span>' : info.source === 'automatica' ? '<span class="badge">automática</span>' : info.source === 'digitada' ? '<span class="badge">digitada</span>' : '<span class="badge warn">sem cotação</span>';
      const btn = info.source === 'fixada' ? `<button class="chip" data-act="fx-unfix" data-cur="${c}">Usar automática</button>` : `<button class="chip" data-act="fx-fix" data-cur="${c}">Fixar valor</button>`;
      return `<div class="row-item" style="flex-wrap:wrap"><div class="ico">${esc(c)}</div><div class="main"><div class="t">${info.rate ? `1 ${esc(c)} = ${esc(fmtRate(info.rate, MC))}` : esc(curName(c))}</div><div class="s">${tag}${info.source === 'fixada' && info.date ? ' desde ' + esc(fdate(info.date)) : ''}${!info.rate ? ' fica fora do patrimônio total' : ''}</div></div>
        <div style="width:100%;padding-left:52px;margin-top:6px">${btn}</div></div>`;
    }).join('') + `</div><p class="help" style="margin-top:10px"><b>Fixar valor</b> serve para usar a cotação que o seu banco ou corretora cobrou. A cotação fixada vale até você voltar para a automática.</p></div>
      <p class="tiny muted">Fonte da cotação automática: tabela pública diária <i>currency-api</i>, baixada pelo jsDelivr. Ela traz todas as moedas de uma vez, então o serviço não sabe quais você tem nem quanto.</p>`;
    return h;
  }
  function fixRate(cur) {
    const MC = C.mainCurrency(S.ds), now = C.rateInfo(S.ds, cur);
    const sh = openSheet({
      title: 'Fixar cotação de ' + cur,
      body: `<div class="field"><label for="fx-val">1 ${esc(cur)} vale quantos ${esc(MC)}?</label><input class="input num" id="fx-val" inputmode="decimal" placeholder="ex.: 5,40" value="${now.rate ? esc(String(C.round2(now.rate * 10000) / 10000).replace('.', ',')) : ''}"></div>
        <p class="help">Enquanto estiver fixada, a cotação automática não muda este valor.</p><div id="fx-err" class="small" style="color:var(--danger)"></div>`,
      footHtml: `<button class="btn" data-ok>Fixar</button>`
    });
    sh.foot.querySelector('[data-ok]').onclick = async () => {
      const v = C.num(sh.body.querySelector('#fx-val').value.trim());
      if (!(v > 0)) { sh.body.querySelector('#fx-err').textContent = 'Use um número maior que zero, ex.: 5,40.'; return; }
      sh.close();
      const ds2 = C.clone(S.ds);
      ds2.settings = Object.assign({}, ds2.settings || {});
      ds2.settings.exchange_rates = Object.assign({}, ds2.settings.exchange_rates || {}, { [cur]: { rate: v, fixed: true, updated_at: nowIso() } });
      await commit(ds2, { audit: { type: 'exchange-rates', description: `Cotação fixada: 1 ${cur} = ${String(v).replace('.', ',')} ${MC}` }, toast: 'Cotação fixada' });
    };
  }
  async function unfixRate(cur) {
    const ds2 = C.clone(S.ds);
    ds2.settings = Object.assign({}, ds2.settings || {});
    const r = Object.assign({}, ds2.settings.exchange_rates || {}); delete r[cur]; ds2.settings.exchange_rates = r;
    await commit(ds2, { audit: { type: 'exchange-rates', description: `Cotação de ${cur} voltou para a automática` }, toast: cur + ': cotação automática' });
  }
  async function toggleAutoRates(on) {
    const ds2 = C.clone(S.ds);
    ds2.settings = Object.assign({}, ds2.settings || {}, { auto_rates: !!on });
    if (!on) { try { await DB.set('fx_cache', null); } catch (e) { /* ignora */ } C.setAutoRates(null, null, {}); }
    await commit(ds2, { audit: { type: 'exchange-rates', description: on ? 'Cotação automática ligada' : 'Cotação automática desligada' }, toast: on ? 'Cotação automática ligada' : 'Cotação automática desligada' });

  }

  // Primeiro uso sem backup: começa com dados vazios.
  async function startFresh() {

      footHtml: `<button class="btn" data-ok>Começar</button>`
    });
    sh.foot.querySelector('[data-ok]').onclick = async () => {
      const cur = sh.body.querySelector('#fr-cur').value, today = todayStr();
      sh.close();
      const ds = { schema_version: C.APP_SCHEMA, source: 'cadastro no app', snapshot_date: today, currency_default: cur, settings: { main_currency: cur, exchange_rates: {} }, accounts: [], credit_facilities: [], transactions: [], obligations: [], audit_log: [], deleted_records: [] };
      await commit(ds, { audit: { type: 'start', description: 'Início do zero, moeda principal ' + cur } });
      go('inicio');
      openAccountWizard();
    };
  }

  // ---------- BACKUP NO GITHUB ----------
  /* Envia/baixa o backup JSON para um arquivo num repositório do GitHub (API "contents").
     Cada envio vira um commit, então o GitHub guarda o histórico de todas as versões.
     O token fica só em S.meta (IndexedDB deste aparelho) e nunca entra no backup exportado. */
  const GH_API = 'https://api.github.com';
  const GH_DEFAULT_PATH = 'cofre-backup.json';
  const ghErr = msg => Object.assign(new Error(msg), { friendly: true });
  function ghParseRepo(v) {
    const m = String(v || '').trim().replace(/\.git$/i, '').replace(/\/+$/, '').match(/^(?:https?:\/\/(?:www\.)?github\.com\/)?([A-Za-z0-9-]+)\/([A-Za-z0-9._-]+)$/);
    return m ? { owner: m[1], repo: m[2] } : null;
  }
  function ghCleanPath(v) {
    const p = String(v || '').trim().replace(/\\/g, '/').replace(/^\/+|\/+$/g, '').replace(/\/{2,}/g, '/');
    return p || GH_DEFAULT_PATH;
  }
  function ghContentsPath(cfg) {
    return `/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/` + cfg.path.split('/').map(encodeURIComponent).join('/');
  }
  function ghErrorText(status, msg) {
    if (status === 401) return 'O GitHub recusou o token (inválido, expirado ou revogado). Gere um novo token e salve de novo.';
    if (status === 403) return /rate limit/i.test(msg) ? 'Limite de uso da API do GitHub atingido. Espere alguns minutos e tente de novo.' : 'O token não tem permissão para isso. Ele precisa de acesso a este repositório com <b>Contents: Read and write</b>.';
    if (status === 404) return 'Não encontrado. Confira o nome do repositório e o branch. O GitHub também responde assim quando o token <b>não tem acesso</b> ao repositório.';
    if (status === 409) return 'O arquivo mudou no GitHub durante o envio. Tente de novo.';
    if (status === 422) return 'O GitHub recusou o envio' + (msg ? ': ' + esc(msg) : '') + '. Confira o branch e o caminho do arquivo.';
    return 'Erro do GitHub (' + status + ')' + (msg ? ': ' + esc(msg) : '') + '.';
  }
  async function ghFetch(cfg, path, opts) {
    opts = opts || {};
    const headers = { Authorization: 'Bearer ' + cfg.token, Accept: opts.accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    if (opts.body) headers['Content-Type'] = 'application/json';
    let r;
    try { r = await fetch(GH_API + path, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined, cache: 'no-store', credentials: 'omit' }); }
    catch (e) { throw ghErr('Sem conexão com o GitHub. Verifique a internet e tente de novo.'); }
    if (r.ok) return r;
    if (opts.allow404 && r.status === 404) return null;
    let msg = ''; try { msg = (await r.json()).message || ''; } catch (e) { /* sem corpo */ }
    throw Object.assign(ghErr(ghErrorText(r.status, msg)), { status: r.status });
  }
  async function ghRepoInfo(cfg) {
    const r = await ghFetch(cfg, `/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`);
    return r.json();
  }
  async function ghCurrentFile(cfg) {
    const r = await ghFetch(cfg, ghContentsPath(cfg) + (cfg.branch ? '?ref=' + encodeURIComponent(cfg.branch) : ''), { allow404: true });
    if (!r) return null;
    const j = await r.json();
    if (Array.isArray(j) || j.type !== 'file') throw ghErr('O caminho <b>' + esc(cfg.path) + '</b> é uma pasta no repositório. Informe o nome de um arquivo, ex.: <b>backups/cofre.json</b>.');
    return j;
  }
  function ghLabel(cfg) { return `${cfg.owner}/${cfg.repo}/${cfg.path}${cfg.branch ? ' (' + cfg.branch + ')' : ''}`; }
  async function ghRun(label, fn) {
    if (S.ghBusy) { toast('Aguarde: já há uma operação com o GitHub em andamento.'); return; }
    S.ghBusy = true;
    toast(label + '…', null, null, 60000);
    try { await fn(); }
    catch (e) { document.querySelectorAll('.toast').forEach(t => t.remove()); showError('GitHub', e && e.friendly ? e.message : esc('Erro inesperado: ' + (e && e.message))); }
    finally { S.ghBusy = false; }
  }

  function ghSaveConfig() {
    return ghRun('Testando conexão', async () => {
      const val = id => (document.getElementById(id) || {}).value || '';
      const rp = ghParseRepo(val('gh-repo'));
      if (!rp) throw ghErr('Repositório inválido. Use o formato <b>usuario/repositorio</b> (ex.: <b>felippy/cofre-backup</b>).');
      const old = S.meta.github || {};
      const token = val('gh-token').trim() || old.token || '';
      if (!token) throw ghErr('Cole o token de acesso do GitHub.');
      const encEl = document.getElementById('gh-enc');
      const cfg = { owner: rp.owner, repo: rp.repo, branch: val('gh-branch').trim(), path: ghCleanPath(val('gh-path')), token, encrypt: encEl ? encEl.checked : true };
      const info = await ghRepoInfo(cfg);
      if (!info.private && !cfg.encrypt) throw ghErr('Este repositório é <b>público</b>: qualquer pessoa na internet veria seus dados financeiros. Use um repositório <b>privado</b> ou ative a criptografia com senha.');
      const cur = await ghCurrentFile(cfg);
      await saveMeta({ github: Object.assign({}, old, cfg, { repo_private: !!info.private, default_branch: info.default_branch || null, connected_at: old.connected_at || nowIso() }) });
      render();
      document.querySelectorAll('.toast').forEach(t => t.remove());
      openSheet({
        title: 'GitHub conectado',
        body: `<div class="notice ok">${ic('check')}<div class="ntext">Acesso ao repositório <b>${esc(cfg.owner + '/' + cfg.repo)}</b> confirmado (${info.private ? 'privado' : '<b>público</b>'}).</div></div>
          <p class="small">${cur ? `Já existe um backup em <b>${esc(cfg.path)}</b>. Você pode baixá-lo e importar, ou enviar um novo (o anterior continua no histórico do GitHub).` : `Ainda não há arquivo em <b>${esc(cfg.path)}</b>. Ele será criado no primeiro envio.`}</p>
          ${!info.private ? `<div class="notice warn">${ic('alert')}<div class="ntext">Repositório público: só backups <b>criptografados</b> serão enviados. Mesmo assim, prefira um privado.</div></div>` : ''}`,
        footHtml: '<button class="btn secondary" data-close>Fechar</button>'
      });
    });
  }
  async function ghDisconnect() {
    if (!(await confirmDialog({ title: 'Desconectar o GitHub?', text: 'O token será apagado deste aparelho. Os backups que já estão no GitHub <b>continuam lá</b>. Para invalidar o token de vez, revogue-o também em github.com → Settings → Developer settings.', ok: 'Desconectar', danger: true }))) return;
    const m = Object.assign({}, S.meta); delete m.github; S.meta = m; await DB.set('meta', m); render(); toast('GitHub desconectado');
  }
  function ghPush() {
    const cfg = S.meta.github;
    if (!cfg || !cfg.token) { go('mais', 'github'); return; }
    return ghRun('Enviando backup ao GitHub', async () => {
      const ds = S.ds;
      const info = await ghRepoInfo(cfg);
      if (!info.private && !cfg.encrypt) throw ghErr('O repositório <b>' + esc(cfg.owner + '/' + cfg.repo) + '</b> está <b>público</b>. Envio sem criptografia bloqueado para não expor seus dados.');
      const exportedAt = nowIso();
      let text = JSON.stringify(await C.buildExport(ds, exportedAt, { base: S.meta.export_base, previousExportAt: S.meta.last_export_at || S.meta.last_import_file_exported_at }), null, 2);
      if (cfg.encrypt) {
        document.querySelectorAll('.toast').forEach(t => t.remove());
        const pw = await promptPassword({ title: 'Senha do backup', confirm: true, text: 'O arquivo no GitHub será criptografado com esta senha. <b>Sem ela, ninguém (nem você) consegue abrir o backup.</b> Use sempre a mesma e anote num lugar seguro.' });
        if (!pw) { toast('Envio cancelado. Nada foi enviado.'); return; }
        toast('Criptografando…', null, null, 60000);
        text = await C.encryptText(text, pw);
      }
      toast('Enviando ao GitHub…', null, null, 60000);
      const cur = await ghCurrentFile(cfg);
      const body = { message: `Backup Cofre ${stamp().replace('_', ' ')}${cfg.encrypt ? ' (criptografado)' : ''}`, content: C.b64.enc(new TextEncoder().encode(text)) };
      if (cur) body.sha = cur.sha;
      if (cfg.branch) body.branch = cfg.branch;
      const res = await (await ghFetch(cfg, ghContentsPath(cfg), { method: 'PUT', body })).json();
      const commitUrl = res && res.commit && res.commit.html_url;
      await saveMeta({
        last_export_at: exportedAt, last_export_name: 'GitHub: ' + ghLabel(cfg), dirty: false, export_base: C.makeBase(ds), base_source: 'envio ao GitHub',
        github: Object.assign({}, cfg, { last_push_at: exportedAt, last_push_commit: commitUrl || null, last_push_encrypted: !!cfg.encrypt })
      });
      render();
      document.querySelectorAll('.toast').forEach(t => t.remove());
      toast('Backup enviado ao GitHub');
    });
  }
  function ghPull() {
    const cfg = S.meta.github;
    if (!cfg || !cfg.token) { go('mais', 'github'); return; }
    return ghRun('Baixando backup do GitHub', async () => {
      const r = await ghFetch(cfg, ghContentsPath(cfg) + (cfg.branch ? '?ref=' + encodeURIComponent(cfg.branch) : ''), { accept: 'application/vnd.github.raw+json', allow404: true });
      if (!r) throw ghErr('Ainda não há backup em <b>' + esc(ghLabel(cfg)) + '</b>. Envie um primeiro.');
      const buf = new Uint8Array(await r.arrayBuffer());
      document.querySelectorAll('.toast').forEach(t => t.remove());
      await importFromBytes(buf, { name: 'GitHub ' + ghLabel(cfg), size: buf.length });
    });
  }
  function pageGithub() {

    let h = `<button class="back" data-act="page" data-tab="mais" data-page="backup">${ic('left')}Backup</button><h1 class="page-title">Backup no GitHub</h1>

    if (on) h += `<div class="card"><div class="lbl">Conectado</div>

        <div class="small" style="margin-top:8px">Último envio: <b>${g.last_push_at ? fdatetime(g.last_push_at) : 'nenhum'}</b></div>
        ${S.meta.dirty ? `<div class="notice warn" style="margin:12px 0 0">${ic('alert')}<div class="ntext">Há alterações que ainda não foram para nenhum backup.</div></div>` : ''}
        <button class="btn" data-act="gh-push" style="margin-top:12px">${ic('up')} Enviar backup agora</button>

        <div class="field"><label for="gh-path">Arquivo no repositório</label><input class="input" id="gh-path" placeholder="${GH_DEFAULT_PATH}" autocomplete="off" autocapitalize="none" spellcheck="false" value="${esc(g.path || GH_DEFAULT_PATH)}"></div>
        <div class="field"><label for="gh-branch">Branch (opcional)</label><input class="input" id="gh-branch" placeholder="${esc(g.default_branch || 'padrão do repositório')}" autocomplete="off" autocapitalize="none" spellcheck="false" value="${esc(g.branch || '')}"></div>
        <div class="field"><label for="gh-token">Token de acesso</label><input class="input" id="gh-token" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="${on ? '•••••••• salvo (deixe vazio para manter)' : 'github_pat_…'}"></div>
        <label class="check"><input type="checkbox" id="gh-enc" ${g.encrypt === false ? '' : 'checked'}><div><b>Criptografar com senha</b><div class="small muted">Recomendado. O GitHub (e quem tiver acesso ao repositório) só vê dados embaralhados. A senha é pedida a cada envio e nunca é guardada.</div></div></label>

      </div>
      <details class="card fold"${on ? '' : ' open'}><summary>Como criar o repositório e o token</summary><ol class="small" style="padding-left:18px;margin:10px 0 0;display:grid;gap:8px">
        <li>No GitHub, crie um repositório <b>privado</b> (ex.: <b>cofre-backup</b>). Não use o repositório onde o app está publicado.</li>
